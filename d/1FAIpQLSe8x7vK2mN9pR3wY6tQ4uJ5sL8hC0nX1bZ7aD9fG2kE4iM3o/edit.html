/**
 * Generates a single replacement idea for a given funnel stage.
 * @param {string} funnel - Funnel stage ('tof', 'mof', 'bof')
 * @returns {Promise<Object|null>} The new idea or null
 */
async function generateOneIdea(funnel) {
  if (!checkRateLimit()) return null;

  const taste = getTasteProfile();
  const funnelLabel = funnel === 'tof' ? 'TOP OF FUNNEL' : funnel === 'mof' ? 'MIDDLE OF FUNNEL' : 'BOTTOM OF FUNNEL';

  try {
    const r = await fetchWithTimeout('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': getKey(),
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 500,
        system: 'You generate content ideas for Somesh (Kay Capitals) — day trading educator, 1M+ IG followers. Return ONLY valid JSON.',
        messages: [{ role: 'user', content: 'Generate 1 new ' + funnelLabel + ' Instagram reel idea. Be SPECIFIC and TIMELY.\n\nTaste profile: ' + JSON.stringify(taste) + '\n\nReturn ONLY: {"idea":{"id":"' + Date.now() + '_new","funnel":"' + funnel + '","topic":"trading|psychology|family|lifestyle|news|student_story","title":"...","preview":"2-3 sentences","tags":[]}}' }]
      })
    }, 30000);

    const data = await r.json();
    if (!data || data.error || !data.content || !data.content.length) return null;
    const txt = data.content[0].text;
    const m = txt.match(/\{[\s\S]*"idea"[\s\S]*\}/);
    if (m) {
      const parsed = JSON.parse(m[0]);
      return (parsed.idea && validateIdea(parsed.idea)) ? parsed.idea : null;
    }
    return null;
  } catch (e) {
    return null;
  }
}

// ========== SWIPE GESTURES ==========

const SWIPE_THRESHOLD = 80;
let _swipeState = null;
let _swipeContainerBound = false;

/**
 * Attaches swipe event handlers using event delegation.
 */
function attachSwipeHandlers() {
  if (_swipeContainerBound) return; // Only bind once
  const container = document.getElementById('ideasContent');
  if (!container) return;
  _swipeContainerBound = true;
  
  container.addEventListener('touchstart', (e) => {
    const card = e.target.closest('.idea-card');
    if (!card) return;
    onSwipeStart({ ...e, currentTarget: card, touches: e.touches });
  }, { passive: true });
  
  container.addEventListener('touchmove', (e) => {
    if (!_swipeState) return;
    onSwipeMove(e);
  }, { passive: false });
  
  container.addEventListener('touchend', (e) => {
    if (!_swipeState) return;
    onSwipeEnd(e);
  }, { passive: true });
}

/**
 * Handles touch start for swipe.
 * @param {TouchEvent} e
 */
function onSwipeStart(e) {
  const touch = e.touches[0];
  if (!touch) return;
  const card = e.target.closest('.idea-card');
  if (!card) return;
  _swipeState = {
    startX: touch.clientX,
    startY: touch.clientY,
    card: card,
    id: card.dataset.ideaId,
    moved: false
  };
}

/**
 * Handles touch move for swipe.
 * @param {TouchEvent} e
 */
function onSwipeMove(e) {
  if (!_swipeState) return;
  const touch = e.touches[0];
  if (!touch) return;

  const dx = touch.clientX - _swipeState.startX;
  const dy = touch.clientY - _swipeState.startY;

  // If vertical scroll is dominant, bail
  if (Math.abs(dy) > Math.abs(dx) && !_swipeState.moved) {
    _swipeState = null;
    return;
  }

  if (Math.abs(dx) > 10) {
    _swipeState.moved = true;
    e.preventDefault();
    _swipeState.card.classList.add('swiping');
    _swipeState.card.style.transform = 'translateX(' + dx + 'px)';
    _swipeState.card.style.opacity = String(Math.max(0.3, 1 - Math.abs(dx) / 300));
  }
}

/**
 * Handles touch end for swipe.
 * @param {TouchEvent} e
 */
function onSwipeEnd(e) {
  if (!_swipeState || !_swipeState.moved) {
    _swipeState = null;
    return;
  }

  const card = _swipeState.card;
  const id = _swipeState.id;
  const touch = e.changedTouches[0];
  if (!touch) { resetSwipe(card); return; }

  const dx = touch.clientX - _swipeState.startX;

  if (dx > SWIPE_THRESHOLD && id) {
    // Swipe right → approve
    card.classList.remove('swiping');
    card.classList.add('slide-out-right');
    setTimeout(() => approveIdea(id), 300);
  } else if (dx < -SWIPE_THRESHOLD && id) {
    // Swipe left → reject
    card.classList.remove('swiping');
    card.classList.add('slide-out-left');
    setTimeout(() => handleReject(id), 300);
  } else {
    resetSwipe(card);
  }

  _swipeState = null;
}

/**
 * Resets a card's swipe position.
 * @param {HTMLElement} card
 */
function resetSwipe(card) {
  if (!card) return;
  card.classList.remove('swiping');
  card.style.transform = '';
  card.style.opacity = '';
}

// ========== APPROVED TAB ==========

/**
 * Renders the approved queue and completed sections.
 */
function renderApproved() {
  const approved = secureLoad('_approved', []);
  if (!Array.isArray(approved)) return;

  const active = approved.filter(a => !a.filmed);
  const completed = approved.filter(a => a.filmed);

  const counterEl = document.getElementById('approvedCounter');
  if (counterEl) counterEl.textContent = active.length + ' idea' + (active.length !== 1 ? 's' : '') + ' ready to film';

  let html = '';
  if (active.length === 0) {
    html = '<div class="ideas-empty">No approved ideas yet.<br>Go to 💡 Ideas and approve some!</div>';
  }

  active.forEach(idea => {
    if (!idea) return;
    const safeId = (idea.id || '').replace(/[^a-zA-Z0-9_-]/g, '');
    const funnelClass = VALID_FUNNELS.has(idea.funnel) ? idea.funnel : 'tof';
    const funnelLabel = funnelClass === 'tof' ? 'TOF' : funnelClass === 'mof' ? 'MOF' : 'BOF';
    const topicLabel = TOPIC_LABELS[idea.topic] || idea.topic || 'General';

    html += '<div class="approved-card" id="approved-' + safeId + '">'
      + '<div class="idea-badges">'
      + '<span class="idea-badge ' + funnelClass + '">' + funnelLabel + '</span>'
      + '<span class="idea-badge topic">' + esc(topicLabel) + '</span>'
      + '</div>'
      + '<div class="approved-title">' + esc(idea.title) + '</div>'
      + '<div class="approved-actions">'
      + '<button class="approved-action generate" onclick="generateFromIdea(\'' + safeId + '\')">⚡ Generate Scripts</button>'
      + '<button class="approved-action filmed" onclick="markFilmed(\'' + safeId + '\')">✅ Filmed</button>'
      + '<button class="approved-action remove" onclick="confirmRemoveApproved(\'' + safeId + '\')">🗑️</button>'
      + '</div></div>';
  });

  const listEl = document.getElementById('approvedList');
  if (listEl) listEl.innerHTML = html;

  // Completed section
  const completedSection = document.getElementById('completedSection');
  if (completed.length > 0) {
    if (completedSection) completedSection.style.display = 'block';
    const countEl = document.getElementById('completedCount');
    if (countEl) countEl.textContent = completed.length;
    let cHtml = '';
    completed.forEach(idea => {
      if (!idea) return;
      const funnelClass = VALID_FUNNELS.has(idea.funnel) ? idea.funnel : 'tof';
      const funnelLabel = funnelClass === 'tof' ? 'TOF' : funnelClass === 'mof' ? 'MOF' : 'BOF';
      cHtml += '<div class="completed-card"><div class="idea-badges"><span class="idea-badge ' + funnelClass + '">' + funnelLabel + '</span></div><div class="idea-title">' + esc(idea.title) + '</div></div>';
    });
    const completedList = document.getElementById('completedList');
    if (completedList) completedList.innerHTML = cHtml;
  } else {
    if (completedSection) completedSection.style.display = 'none';
  }

  updateTabCounts();
}

/**
 * Switches to generate tab and pre-fills with an approved idea.
 * @param {string} id - Safe card ID
 */
function generateFromIdea(id) {
  const approved = secureLoad('_approved', []);
  if (!Array.isArray(approved)) return;
  const idea = approved.find(i => (i.id || '').replace(/[^a-zA-Z0-9_-]/g, '') === id);
  if (!idea) return;

  switchTab('generate');
  const ta = document.getElementById('idea');
  if (ta) {
    ta.value = idea.title;
    ta.focus();
  }
  setTimeout(() => generate(), 300);
}

/**
 * Marks an approved idea as filmed.
 * @param {string} id - Safe card ID
 */
function markFilmed(id) {
  const approved = secureLoad('_approved', []);
  if (!Array.isArray(approved)) return;
  const idea = approved.find(i => (i.id || '').replace(/[^a-zA-Z0-9_-]/g, '') === id);
  if (idea) {
    idea.filmed = true;
    idea.filmedAt = Date.now();
    secureStore('_approved', approved);
    renderApproved();
    haptic(10);
    showToast('Marked as filmed!', 'success', { duration: 1500 });
  }
}

/**
 * Confirms before removing from approved queue.
 * @param {string} id - Safe card ID
 */
function confirmRemoveApproved(id) {
  const approved = secureLoad('_approved', []);
  if (!Array.isArray(approved)) return;
  const idea = approved.find(i => (i.id || '').replace(/[^a-zA-Z0-9_-]/g, '') === id);
  if (!idea) return;

  // Show confirmation via toast with undo
  const filtered = approved.filter(i => (i.id || '').replace(/[^a-zA-Z0-9_-]/g, '') !== id);
  secureStore('_approved', filtered);

  // Animate
  const card = document.getElementById('approved-' + id);
  if (card) {
    card.classList.add('slide-out');
    setTimeout(() => renderApproved(), 350);
  } else {
    renderApproved();
  }

  haptic(10);

  showToast('Removed from queue', 'info', {
    duration: 5000,
    onUndo: () => {
      const current = secureLoad('_approved', []);
      current.push(idea);
      secureStore('_approved', current);
      renderApproved();
      showToast('Restored', 'success', { duration: 1500 });
    }
  });
}

/**
 * Toggles the completed ideas list visibility.
 */
function toggleCompleted() {
  const list = document.getElementById('completedList');
  const arrow = document.getElementById('completedArrow');
  if (!list || !arrow) return;
  if (list.style.display === 'none') {
    list.style.display = 'block';
    arrow.textContent = '▼';
  } else {
    list.style.display = 'none';
    arrow.textContent = '▶';
  }
}

// ========== UNBOUNDED STORAGE CLEANUP ==========
function cleanupUnboundedStorage() {
  // Cap _feedback to last 50 entries
  try {
    const fb = JSON.parse(localStorage.getItem('_feedback') || '[]');
    if (Array.isArray(fb) && fb.length > 50) {
      localStorage.setItem('_feedback', JSON.stringify(fb.slice(-50)));
    }
  } catch(e) {
    localStorage.removeItem('_feedback');
  }
  
  // Cap _scriptRatings to last 100 entries
  try {
    const sr = JSON.parse(localStorage.getItem('_scriptRatings') || '{}');
    const keys = Object.keys(sr);
    if (keys.length > 100) {
      const trimmed = {};
      keys.slice(-100).forEach(k => {
        trimmed[k] = sr[k];
      });
      localStorage.setItem('_scriptRatings', JSON.stringify(trimmed));
    }
  } catch(e) {
    localStorage.removeItem('_scriptRatings');
  }
  
  // Cap _scriptCopies to last 100 entries
  try {
    const sc = JSON.parse(localStorage.getItem('_scriptCopies') || '{}');
    const keys = Object.keys(sc);
    if (keys.length > 100) {
      const trimmed = {};
      keys.slice(-100).forEach(k => {
        trimmed[k] = sc[k];
      });
      localStorage.setItem('_scriptCopies', JSON.stringify(trimmed));
    }
  } catch(e) {
    localStorage.removeItem('_scriptCopies');
  }
}

// ========== INIT ==========
document.addEventListener('DOMContentLoaded', () => {
  cleanupUnboundedStorage();
  
  if (localStorage.getItem('_cs') === 'true') {
    const loginScreen = document.getElementById('loginScreen');
    const mainApp = document.getElementById('mainApp');
    if (loginScreen) loginScreen.style.display = 'none';
    if (mainApp) mainApp.style.display = 'block';
    initTabIndicator();
    
    // Restore session if coming back from background
    restoreSessionState();
  }
  updateTabCounts();
  initPullToRefresh();

  // Resize handler for tab indicator
  window.addEventListener('resize', updateTabIndicator);
});

// Periodic auto-save (fix beforeunload iOS unreliability)
setInterval(() => {
  if (window._scripts && window._scripts.length > 0 && !_isRestoring) {
    saveSessionState();
  }
}, 30000);

// Save state when app is about to be suspended/hidden (iOS PWA background)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && window._scripts) {
    saveSessionState();
  } else if (document.visibilityState === 'visible' && (!window._scripts || window._scripts.length === 0)) {
    restoreSessionState();
  }
});

// Also save on beforeunload as fallback
window.addEventListener('beforeunload', () => {
  if (window._scripts) {
    saveSessionState();
  }
});
