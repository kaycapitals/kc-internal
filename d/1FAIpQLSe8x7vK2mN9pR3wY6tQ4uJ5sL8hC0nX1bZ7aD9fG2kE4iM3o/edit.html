<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect rx='20' width='100' height='100' fill='%230a0a0a'/><text x='50' y='72' font-size='60' text-anchor='middle' fill='%23d4a843'>⚡</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect rx='20' width='100' height='100' fill='%230a0a0a'/><text x='50' y='72' font-size='60' text-anchor='middle' fill='%23d4a843'>⚡</text></svg>">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Content Engine">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://api.anthropic.com https://api.openai.com https://kc-tools.kaycapitals.co; img-src 'self' data:; font-src 'self';">
<title>Content Engine</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px));-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto}
.hdr{text-align:center;padding:24px 0 20px}
.hdr h1{font-size:24px;font-weight:700;color:#d4a843;margin-bottom:6px}
.hdr p{color:#555;font-size:13px}
.input-wrap{margin-bottom:20px}
textarea{width:100%;padding:16px;border-radius:12px;border:1px solid #222;background:#111;color:#fff;font-size:16px;resize:none;outline:none;font-family:inherit;min-height:80px;transition:border-color .2s}
textarea:focus{border-color:#d4a843}
textarea::placeholder{color:#444}
.btn-row{display:flex;gap:8px;margin-top:10px}
.gen-btn{flex:1;padding:14px;border-radius:12px;border:none;background:#d4a843;color:#000;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .2s}
.gen-btn:disabled{opacity:.4;cursor:not-allowed}
.gen-btn:hover:not(:disabled){opacity:.85}
.hint{color:#333;font-size:11px;text-align:center;margin-top:6px}
.loading{text-align:center;padding:40px 20px}
.loading .bar{width:100%;height:3px;background:#1a1a1a;border-radius:2px;overflow:hidden;margin-bottom:16px}
.loading .fill{width:0%;height:100%;background:#d4a843;border-radius:2px;animation:load 8s ease-in-out forwards}
@keyframes load{0%{width:0%}50%{width:60%}90%{width:85%}100%{width:92%}}
.loading p{color:#555;font-size:13px}
.error{padding:14px;border-radius:10px;background:#1a0a0a;color:#cc4444;font-size:14px;margin-bottom:16px}
.results-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.results-hdr h2{color:#fff;font-size:18px}
.copy-all{padding:10px 14px;border-radius:8px;border:1px solid #d4a843;background:transparent;color:#d4a843;font-size:12px;cursor:pointer;min-height:44px}
.card{background:#111;border:1px solid #1a1a1a;border-radius:14px;padding:18px;margin-bottom:16px}
.card-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #1a1a1a}
.badge{font-size:14px;font-weight:700;color:#d4a843;letter-spacing:.5px}
.card-meta{display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dur{color:#555;font-size:12px}
.copy-btn{background:none;border:none;font-size:16px;cursor:pointer;padding:8px;min-height:44px;min-width:44px}
.section{margin-bottom:14px}
.lbl{font-size:10px;font-weight:700;color:#d4a843;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px}
.hook-box{padding:12px;border-radius:10px;background:#161616;border-left:3px solid #d4a843}
.hook-box p{color:#fff;font-size:16px;font-weight:600;line-height:1.4}
.body-text{color:#bbb;font-size:14px;line-height:1.7;white-space:pre-wrap}
.cta-box{padding:10px 12px;border-radius:10px;background:#0f1a0f}
.cta-box p{color:#6b6;font-size:14px;font-weight:500;line-height:1.5}
.vis-box{padding:8px 12px;border-radius:8px;background:#0f0f1a}
.vis-box p{color:#88c;font-size:12px;line-height:1.5;font-style:italic}
.cost{text-align:center;color:#333;font-size:11px;padding:8px}
.raw{color:#bbb;font-size:13px;white-space:pre-wrap;line-height:1.6}

/* Tab Navigation */
.tab-bar{display:flex;gap:0;border-bottom:1px solid #222;margin-bottom:20px;overflow-x:auto;-webkit-overflow-scrolling:touch;position:relative}
.tab-btn{flex:1;padding:14px 8px;background:none;border:none;color:#555;font-size:14px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;transition:color .2s;white-space:nowrap;min-width:0;text-align:center;position:relative;z-index:1}
.tab-btn.active{color:#d4a843;border-bottom-color:transparent}
.tab-btn:hover{color:#888}
.tab-indicator{position:absolute;bottom:0;height:3px;background:#d4a843;border-radius:2px;transition:left .3s cubic-bezier(.4,0,.2,1),width .3s cubic-bezier(.4,0,.2,1)}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* Idea Cards */
.funnel-section{margin-bottom:24px}
.funnel-hdr{font-size:16px;font-weight:700;margin-bottom:12px;padding:10px 14px;border-radius:10px;display:flex;align-items:center;gap:8px}
.funnel-hdr.tof{background:#1a0808;color:#cc2222;border:1px solid #331111}
.funnel-hdr.mof{background:#1a1508;color:#d4a843;border:1px solid #332a11}
.funnel-hdr.bof{background:#081a0c;color:#22aa44;border:1px solid #113322}

.idea-card{background:#111;border:1px solid #222;border-radius:12px;padding:14px;margin-bottom:10px;position:relative;transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .3s ease;will-change:transform,opacity;touch-action:pan-y}
.idea-card.replacing{opacity:.5;pointer-events:none}
.idea-card.slide-out-right{transform:translateX(120%);opacity:0}
.idea-card.slide-out-left{transform:translateX(-120%);opacity:0}
.idea-card.swiping{transition:none}
.idea-badges{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.idea-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.5px}
.idea-badge.tof{background:#cc2222;color:#fff}
.idea-badge.mof{background:#d4a843;color:#000}
.idea-badge.bof{background:#22aa44;color:#fff}
.idea-badge.topic{background:#222;color:#999}
.idea-badge.confidence{background:#1a1a2a;color:#88f;font-size:9px}
.idea-title{color:#fff;font-size:15px;font-weight:600;line-height:1.4;margin-bottom:8px}
.idea-preview{display:none;color:#999;font-size:13px;line-height:1.5;padding:10px;background:#0a0a0a;border-radius:8px;margin-bottom:8px}
.idea-preview.show{display:block}
.idea-toggle{background:none;border:none;color:#555;font-size:12px;cursor:pointer;padding:10px 0;margin-bottom:6px;min-height:44px}
.idea-toggle:hover{color:#888}
.idea-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.idea-action{padding:12px 16px;border-radius:8px;border:1px solid #222;background:#0a0a0a;color:#fff;font-size:14px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px;min-height:44px;min-width:44px;justify-content:center}
.idea-action:hover{border-color:#444}
.idea-action.approve{border-color:#22aa44}
.idea-action.approve:hover{background:#0a1a0f}
.idea-action.reject{border-color:#cc2222}
.idea-action.reject:hover{background:#1a0a0a}
.idea-action.refresh{border-color:#555}

/* Reject Feedback Form (desktop inline) */
.reject-form{display:none;padding:12px;background:#0a0a0a;border-radius:10px;margin-top:8px;border:1px solid #1a1111}
.reject-form.show{display:block}
.reject-form select{width:100%;padding:10px;border-radius:8px;border:1px solid #222;background:#111;color:#fff;font-size:14px;margin-bottom:8px;outline:none}
.reject-form .fb-row{display:flex;gap:6px}
.reject-form input{flex:1;padding:10px;border-radius:8px;border:1px solid #222;background:#111;color:#fff;font-size:14px;outline:none}
.reject-form .fb-mic{width:44px;height:44px;border-radius:50%;border:2px solid #333;background:#111;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.reject-form .fb-mic.recording{background:#cc2222;border-color:#cc2222}
.reject-form .fb-submit{width:100%;padding:10px;border-radius:8px;border:none;background:#cc2222;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;min-height:44px}

/* Bottom Sheet (mobile reject form) */
.bottom-sheet-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;opacity:0;transition:opacity .3s}
.bottom-sheet-overlay.show{display:flex;align-items:flex-end;opacity:1}
.bottom-sheet{width:100%;max-width:720px;margin:0 auto;background:#111;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom, 0px));transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.bottom-sheet-overlay.show .bottom-sheet{transform:translateY(0)}
.bottom-sheet-handle{width:40px;height:4px;background:#333;border-radius:2px;margin:0 auto 16px}
.bottom-sheet h3{color:#fff;font-size:16px;margin-bottom:4px}
.bottom-sheet .bs-subtitle{color:#666;font-size:13px;margin-bottom:16px}
.bottom-sheet select{width:100%;padding:12px;border-radius:10px;border:1px solid #222;background:#1a1a1a;color:#fff;font-size:15px;margin-bottom:10px;outline:none}
.bottom-sheet .fb-row{display:flex;gap:8px;margin-bottom:10px}
.bottom-sheet .fb-row input{flex:1;padding:12px;border-radius:10px;border:1px solid #222;background:#1a1a1a;color:#fff;font-size:15px;outline:none}
.bottom-sheet .fb-row .fb-mic{width:48px;height:48px;border-radius:50%;border:2px solid #333;background:#1a1a1a;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bottom-sheet .fb-row .fb-mic.recording{background:#cc2222;border-color:#cc2222}
.bottom-sheet .bs-submit{width:100%;padding:14px;border-radius:12px;border:none;background:#cc2222;color:#fff;font-size:15px;font-weight:700;cursor:pointer;min-height:48px}

/* Approved Queue */
.approved-counter{text-align:center;padding:16px;color:#d4a843;font-size:18px;font-weight:700;margin-bottom:16px}
.approved-card{background:#111;border:1px solid #222;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;flex-direction:column;gap:10px;transition:transform .3s,opacity .3s}
.approved-card.slide-out{transform:translateX(-120%);opacity:0}
.approved-title{color:#fff;font-size:15px;font-weight:600;line-height:1.4}
.approved-actions{display:flex;gap:6px;flex-wrap:wrap}
.approved-action{padding:10px 14px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;min-height:44px}
.approved-action.generate{background:#d4a843;color:#000}
.approved-action.remove{background:none;border:1px solid #cc2222;color:#cc2222}
.approved-action.filmed{background:none;border:1px solid #22aa44;color:#22aa44}
.completed-section{margin-top:24px;border-top:1px solid #222;padding-top:16px}
.completed-toggle{background:none;border:none;color:#555;font-size:13px;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;gap:6px;min-height:44px;padding:8px 0}
.completed-card{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:10px;padding:12px;margin-bottom:8px;opacity:.6}
.completed-card .idea-title{font-size:13px;color:#666}

/* Loading overlay for ideas */
.ideas-loading{text-align:center;padding:60px 20px}
.ideas-loading .spinner{width:40px;height:40px;border:3px solid #222;border-top-color:#d4a843;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.ideas-loading p{color:#555;font-size:14px}
.ideas-empty{text-align:center;padding:40px 20px;color:#444;font-size:14px}

/* Skeleton loading cards */
.skeleton-card{background:#111;border:1px solid #1a1a1a;border-radius:12px;padding:14px;margin-bottom:10px;overflow:hidden}
.skeleton-line{height:12px;background:#1a1a1a;border-radius:6px;margin-bottom:8px;position:relative;overflow:hidden}
.skeleton-line::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.03),transparent);animation:shimmer 1.5s infinite}
.skeleton-line.w60{width:60%}
.skeleton-line.w80{width:80%}
.skeleton-line.w40{width:40%}
.skeleton-line.h20{height:20px}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* Toast notification */
.toast-container{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom, 0px));left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:90%;max-width:400px}
.toast{background:#222;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,.5);pointer-events:auto;animation:toastIn .3s ease;width:100%;justify-content:space-between}
.toast.success{border-left:3px solid #22aa44}
.toast.error{border-left:3px solid #cc2222}
.toast.info{border-left:3px solid #d4a843}
.toast-undo{background:none;border:1px solid #d4a843;color:#d4a843;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;min-height:36px}
@keyframes toastIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateY(10px)}}

/* Waveform visualization */
.waveform-wrap{display:flex;align-items:center;gap:10px;margin-top:6px}
.waveform-canvas{height:32px;width:120px;border-radius:4px}
.rec-timer{color:#cc2222;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}

/* Taste profile summary */
.taste-summary{background:#111;border:1px solid #1a1a1a;border-radius:12px;padding:14px;margin-bottom:16px}
.taste-summary h3{color:#d4a843;font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.taste-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.taste-tag{font-size:11px;padding:3px 8px;border-radius:6px;font-weight:600}
.taste-tag.liked{background:#0a1a0f;color:#22aa44;border:1px solid #113322}
.taste-tag.rejected{background:#1a0a0a;color:#cc2222;border:1px solid #331111}
.taste-ratio{color:#666;font-size:11px;margin-left:4px}
.taste-actions{display:flex;gap:8px;margin-top:8px}
.taste-reset{background:none;border:1px solid #333;color:#666;padding:6px 12px;border-radius:6px;font-size:11px;cursor:pointer;min-height:36px}
.taste-reset:hover{border-color:#555;color:#999}

/* Script quality features */
.script-meta{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid #1a1a1a;margin-top:10px;flex-wrap:wrap}
.script-meta-item{color:#555;font-size:11px;display:flex;align-items:center;gap:4px}
.script-rate{display:flex;gap:4px}
.script-rate button{background:none;border:1px solid #222;border-radius:6px;padding:4px 8px;font-size:14px;cursor:pointer;min-height:36px;min-width:36px;transition:all .15s}
.script-rate button:hover{border-color:#444}
.script-rate button.rated-up{background:#0a1a0f;border-color:#22aa44}
.script-rate button.rated-down{background:#1a0a0a;border-color:#cc2222}
.script-regen{background:none;border:1px solid #333;color:#888;padding:4px 10px;border-radius:6px;font-size:12px;cursor:pointer;min-height:36px;transition:all .15s}
.script-regen:hover{border-color:#d4a843;color:#d4a843}
.brain-sources{margin-top:8px}
.brain-sources-toggle{background:none;border:none;color:#555;font-size:11px;cursor:pointer;padding:4px 0;min-height:32px}
.brain-sources-toggle:hover{color:#888}
.brain-sources-list{display:none;padding:8px;background:#0a0a0a;border-radius:8px;margin-top:4px}
.brain-sources-list.show{display:block}
.brain-source{color:#666;font-size:11px;line-height:1.5;padding:4px 0;border-bottom:1px solid #111}
.brain-source:last-child{border-bottom:none}

/* Pull to refresh */
.ptr-indicator{text-align:center;padding:0;overflow:hidden;height:0;transition:height .2s;color:#d4a843;font-size:13px}
.ptr-indicator.pulling{height:40px;padding:10px 0}
.ptr-indicator.refreshing{height:40px;padding:10px 0}

/* Session timeout overlay */
.timeout-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:3000;align-items:center;justify-content:center}
.timeout-overlay.show{display:flex}
.timeout-box{text-align:center;padding:32px}
.timeout-box h2{color:#d4a843;font-size:20px;margin-bottom:8px}
.timeout-box p{color:#666;font-size:14px;margin-bottom:20px}
.timeout-box button{padding:14px 32px;border-radius:12px;border:none;background:#d4a843;color:#000;font-size:15px;font-weight:700;cursor:pointer}

/* Rate limit indicator */
.rate-limit-bar{height:2px;background:#1a1a1a;border-radius:1px;margin-bottom:8px;overflow:hidden;opacity:0;transition:opacity .3s}
.rate-limit-bar.show{opacity:1}
.rate-limit-fill{height:100%;background:#d4a843;border-radius:1px;transition:width .3s}
.rate-limit-fill.warning{background:#cc8800}
.rate-limit-fill.danger{background:#cc2222}

/* Next Reel Suggestion */
.next-reel-card{background:#111;border:1px solid #d4a843;border-radius:12px;padding:16px;margin:16px 0;position:relative}
.next-reel-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#d4a843,#ffcc66);border-radius:12px 12px 0 0}
.next-reel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.next-reel-title{color:#d4a843;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.next-reel-content h4{color:#fff;font-size:15px;margin-bottom:6px;font-weight:600}
.next-reel-hook{color:#d4a843;font-size:14px;font-style:italic;margin-bottom:8px;padding:8px 12px;background:#1a1a0a;border-radius:8px;border-left:3px solid #d4a843}
.next-reel-why{color:#888;font-size:13px;line-height:1.5}
.next-reel-btn{padding:12px 20px;border-radius:8px;border:none;background:#d4a843;color:#000;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;min-height:44px}
.next-reel-btn:hover{opacity:.85;transform:translateY(-1px)}

/* Chat Interface */
.chat-interface{margin-top:24px;border-top:2px solid #222;padding-top:16px}
.chat-header{color:#d4a843;font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.chat-messages{max-height:400px;overflow-y:auto;margin-bottom:16px;padding:8px 0;scrollbar-width:thin;scrollbar-color:#333 #0a0a0a}
.chat-messages::-webkit-scrollbar{width:6px}
.chat-messages::-webkit-scrollbar-track{background:#0a0a0a}
.chat-messages::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
.chat-message{margin-bottom:16px;display:flex;gap:12px}
.chat-message.user{flex-direction:row-reverse}
.chat-message.user .chat-bubble{background:#1a1a2a;border:1px solid #333;color:#fff;text-align:right}
.chat-message.assistant .chat-bubble{background:#111;border:1px solid #d4a843;color:#e0e0e0}
.chat-bubble{max-width:80%;padding:12px 16px;border-radius:16px;line-height:1.5;font-size:14px;position:relative;word-wrap:break-word}
.chat-bubble p{margin:0 0 8px 0}
.chat-bubble p:last-child{margin-bottom:0}
.chat-bubble strong{color:#d4a843}
.chat-bubble em{color:#888;font-style:italic}
.chat-bubble code{background:#0a0a0a;padding:2px 4px;border-radius:4px;font-family:monospace;font-size:12px}
.chat-input-area{position:relative}
.chat-textarea{width:100%;padding:14px 110px 14px 16px;border-radius:12px;border:1px solid #222;background:#111;color:#fff;font-size:15px;resize:none;outline:none;font-family:inherit;min-height:60px;transition:border-color .2s}
.chat-textarea:focus{border-color:#d4a843}
.chat-textarea::placeholder{color:#444}
.chat-send-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:2px solid #d4a843;background:#111;color:#d4a843;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.chat-send-btn:hover{background:#d4a843;color:#000}
.chat-send-btn:disabled{opacity:.4;cursor:not-allowed}
.chat-mic-btn{position:absolute;right:60px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:2px solid #333;background:#111;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.chat-mic-btn.recording{background:#cc2222;border-color:#cc2222;color:#fff}
.chat-loading{display:flex;align-items:center;gap:8px;color:#d4a843;font-size:13px;margin-top:8px}

const _uploadedCharts = []; // {base64, mimeType, name}
const MAX_CHARTS = 4;

/**
 * Handles chart image upload from file input.
 */
function handleChartUpload(event) {
  const files = Array.from(event.target.files || []);
  if (_uploadedCharts.length + files.length > MAX_CHARTS) {
    showToast('Max ' + MAX_CHARTS + ' charts allowed', 'error');
    event.target.value = '';
    return;
  }
  files.forEach(file => {
    if (!file.type.startsWith('image/')) return;
    if (file.size > 10 * 1024 * 1024) { showToast('Image too large (max 10MB)', 'error'); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      const base64 = e.target.result.split(',')[1];
      _uploadedCharts.push({ base64, mimeType: file.type, name: file.name });
      renderChartPreviews();
    };
    reader.readAsDataURL(file);
  });
  event.target.value = '';
}

/**
 * Renders chart thumbnail previews with remove buttons.
 */
function renderChartPreviews() {
  const container = document.getElementById('chartPreviews');
  const count = document.getElementById('chartCount');
  if (!container) return;
  if (count) count.textContent = _uploadedCharts.length > 0 ? _uploadedCharts.length + '/' + MAX_CHARTS + ' charts' : '';
  container.innerHTML = _uploadedCharts.map((c, i) =>
    '<div style="position:relative;width:80px;height:80px;border-radius:8px;overflow:hidden;border:1px solid #333">'
    + '<img src="data:' + c.mimeType + ';base64,' + c.base64 + '" style="width:100%;height:100%;object-fit:cover">'
    + '<button onclick="removeChart(' + i + ')" style="position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,0.7);border:none;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center">✕</button>'
    + '</div>'
  ).join('');
}

/**
 * Removes a chart from the upload queue.
 */
function removeChart(index) {
  _uploadedCharts.splice(index, 1);
  renderChartPreviews();
  haptic(5);
}

/**
 * Builds the Claude API message content array with text and optional images.
 */
function buildMessageContent(textPrompt) {
  const content = [];
  // Add chart images first so Claude sees them before the text
  _uploadedCharts.forEach(c => {
    content.push({
      type: 'image',
      source: { type: 'base64', media_type: c.mimeType, data: c.base64 }
    });
  });
  content.push({ type: 'text', text: textPrompt });
  return content;
}

/**
 * Escapes a string for safe HTML rendering.
 * @param {string} s - Raw string to escape
 * @returns {string} HTML-escaped string
 */
function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

/**
 * Sanitizes an entire API response object by escaping all string values recursively.
 * @param {*} obj - The object to sanitize
 * @returns {*} The sanitized copy
 */
function sanitizeResponse(obj) {
  if (obj === null || obj === undefined) return obj;
  if (typeof obj === 'string') return obj;
  if (Array.isArray(obj)) return obj.map(sanitizeResponse);
  if (typeof obj === 'object') {
    const clean = {};
    for (const key of Object.keys(obj)) {
      clean[key] = sanitizeResponse(obj[key]);
    }
    return clean;
  }
  return obj;
}

/** @type {number[]} Timestamps of recent API calls */

const RATE_LIMIT_WINDOW_MS = 60000;

/**
 * Checks if an API call is allowed under the rate limit.
 * @returns {boolean} True if allowed
 */
function checkRateLimit() {
  const now = Date.now();
  // Remove expired timestamps
  while (_apiCallTimestamps.length > 0 && _apiCallTimestamps[0] < now - RATE_LIMIT_WINDOW_MS) {
    _apiCallTimestamps.shift();
  }
  if (_apiCallTimestamps.length >= RATE_LIMIT_MAX) {
    const waitSec = Math.ceil((_apiCallTimestamps[0] + RATE_LIMIT_WINDOW_MS - now) / 1000);
    showToast(`Rate limited — wait ${waitSec}s`, 'error');
    return false;
  }
  _apiCallTimestamps.push(now);
  updateRateLimitBar();
  return true;
}

  const bar = document.getElementById('rateLimitBar');

  const now = Date.now();
  const active = _apiCallTimestamps.filter(t => t > now - RATE_LIMIT_WINDOW_MS).length;
  const pct = (active / RATE_LIMIT_MAX) * 100;
  fill.style.width = pct + '%';

/**
 * Computes a simple checksum for a string (DJB2 hash).
 * @param {string} str - The string to hash
 * @returns {number} Hash value
 */
function simpleHash(str) {
  let hash = 5381;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) + hash + str.charCodeAt(i)) & 0xFFFFFFFF;
  }
  return hash;
}

/**
 * Saves data to localStorage with an integrity checksum.
 * @param {string} key - Storage key
 * @param {*} data - Data to store (will be JSON-stringified)
 */
function secureStore(key, data) {
  const json = JSON.stringify(data);
  const hash = simpleHash(json);
  try {
    localStorage.setItem(key, json);
    localStorage.setItem(key + '_h', String(hash));
  } catch(e) {
    if (e.name === 'QuotaExceededError' || e.code === 22) {
      showToast('Storage full — clearing old data...', 'error');
      try { localStorage.removeItem('_feedback'); localStorage.removeItem('_scriptRatings'); localStorage.removeItem('_scriptCopies'); } catch(_){}
      try { localStorage.setItem(key, json); localStorage.setItem(key + '_h', String(hash)); } catch(_) { showToast('Storage still full. Clear browser data.', 'error'); }
    }
  }
}

/**
 * Loads data from localStorage, verifying its integrity checksum.
 * @param {string} key - Storage key
 * @param {*} fallback - Fallback value if missing or corrupted
 * @returns {*} Parsed data or fallback
 */
function secureLoad(key, fallback) {
  try {
    const json = localStorage.getItem(key);
    if (!json) return fallback;
    const stored = localStorage.getItem(key + '_h');
    const data = JSON.parse(json);
    if (stored && String(simpleHash(json)) !== stored) {
      localStorage.removeItem(key);
      localStorage.removeItem(key + '_h');
      return fallback;
    }
    return data;
  } catch (e) {
    localStorage.removeItem(key);
    localStorage.removeItem(key + '_h');
    return fallback;
  }
}

/**
 * Performs a fetch with an abort timeout.
 * @param {string} url - URL to fetch
 * @param {RequestInit} opts - Fetch options
 * @param {number} [ms=60000] - Timeout in milliseconds
 * @returns {Promise<Response>}
 */
function fetchWithTimeout(url, opts, ms = 60000) {
  const ctrl = new AbortController();
  const id = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { ...opts, signal: ctrl.signal }).finally(() => clearTimeout(id));
}

/**
 * Shows a toast notification.
 * @param {string} message - Toast message
 * @param {'success'|'error'|'info'} [type='info'] - Toast type
 * @param {Object} [opts] - Options
 * @param {Function} [opts.onUndo] - Undo callback (shows undo button)
 * @param {number} [opts.duration=3000] - Auto-dismiss duration in ms
 * @returns {HTMLElement} The toast element
 */
function showToast(message, type = 'info', opts = {}) {
  const container = document.getElementById('toastContainer');
  if (!container) return null;

  const toast = document.createElement('div');
  toast.className = 'toast ' + type;

  let html = '<span>' + esc(message) + '</span>';
  if (opts.onUndo) {
    html += '<button class="toast-undo" id="undoBtn_' + Date.now() + '">Undo</button>';
  }
  toast.innerHTML = html;

  container.appendChild(toast);
  haptic(5);

  const undoBtn = toast.querySelector('.toast-undo');
  if (undoBtn && opts.onUndo) {
    undoBtn.addEventListener('click', () => {
      opts.onUndo();
      removeToast(toast);
    });
  }

  const dur = opts.duration || (opts.onUndo ? 5000 : 3000);
  setTimeout(() => removeToast(toast), dur);

  return toast;
}

/**
 * Removes a toast element with animation.
 * @param {HTMLElement} toast - The toast to remove
 */
function removeToast(toast) {
  if (!toast || !toast.parentNode) return;
  toast.style.animation = 'toastOut .3s ease forwards';
  setTimeout(() => {
    if (toast.parentNode) toast.parentNode.removeChild(toast);
  }, 300);
}

      ? 'audio/webm;codecs=opus'
      : MediaRecorder.isTypeSupported('audio/mp4')

        const gain = ctx.createGain();
        gain.gain.value = 0.001; // inaudible

        gain.connect(ctx.destination);
        osc.start();
        window._keepAliveCtx = ctx;
        window._keepAliveOsc = osc;

    }
    btn.style.background = '#cc2222';
    btn.style.borderColor = '#cc2222';

    setTimeout(() => {

      }
    }, MAX_RECORDING_SECONDS * 1000);

  } catch (err) {
    status.style.display = 'block';
    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
      status.textContent = '🚫 Microphone access denied. Please allow mic access in your browser settings.';

/**
 * Starts the waveform visualization on a canvas element.
 * @param {MediaStream} stream - Audio stream
 * @param {string} canvasId - Canvas element ID
 */
function startWaveform(stream, canvasId) {
  try {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyserNode = audioContext.createAnalyser();
    analyserNode.fftSize = 64;
    const source = audioContext.createMediaStreamSource(stream);
    source.connect(analyserNode);

    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const bufLen = analyserNode.frequencyBinCount;
    const dataArr = new Uint8Array(bufLen);

    function draw() {
      waveformAnimId = requestAnimationFrame(draw);
      analyserNode.getByteFrequencyData(dataArr);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const barW = (canvas.width / bufLen) * 1.5;
      let x = 0;
      for (let i = 0; i < bufLen; i++) {
        const barH = (dataArr[i] / 255) * canvas.height;
        ctx.fillStyle = '#cc2222';
        ctx.fillRect(x, canvas.height - barH, barW - 1, barH);
        x += barW;
      }
    }
    draw();
  } catch (e) {
    // Waveform is non-critical, fail silently
  }
}

/**
 * Stops the waveform visualization.
 */
function stopWaveform() {
  if (waveformAnimId) {
    cancelAnimationFrame(waveformAnimId);
    waveformAnimId = null;
  }
  if (audioContext) {
    audioContext.close().catch(() => {});
    audioContext = null;
  }
}

/**
 * Starts the recording duration timer.
 * @param {string} timerId - Timer element ID
 */
function startRecordingTimer(timerId) {
  recordingStartTime = Date.now();
  const el = document.getElementById(timerId);
  if (!el) return;
  recordingTimerInterval = setInterval(() => {
    const secs = Math.floor((Date.now() - recordingStartTime) / 1000);
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    el.textContent = m + ':' + String(s).padStart(2, '0');
  }, 200);
}

/**
 * Stops the recording timer.
 */
function stopRecordingTimer() {
  if (recordingTimerInterval) {
    clearInterval(recordingTimerInterval);
    recordingTimerInterval = null;
  }
}

let fbMediaRecorder = null;
let fbAudioChunks = [];
let fbRecordingId = null;
let fbRecordingTimer = null;
let fbAudioCtx = null;
let fbAnalyser = null;

/**
 * Toggles voice recording for reject feedback.
 * @param {string} id - The card ID or '_bs' for bottom sheet
 */
async function toggleFbMic(id) {
  // Conflict checks
  if (isRecording) {
    showToast('Stop main mic first', 'error');
    return;
  }
  if (_chatRecording) {
    showToast('Stop chat mic first', 'error');
    return;
  }
  
  const btn = document.getElementById('fb-mic-' + id) || document.getElementById('bsMic');
  const status = document.getElementById('fb-mic-status-' + id);

  if (!btn) return;

  if (fbRecordingId === id) {
    if (fbMediaRecorder && fbMediaRecorder.state !== 'inactive') fbMediaRecorder.stop();
    btn.classList.remove('recording');
    btn.textContent = '🎙️';
    if (status) { status.textContent = '⏳ Transcribing...'; status.style.display = 'block'; }
    fbRecordingId = null;
    if (fbRecordingTimer) { clearInterval(fbRecordingTimer); fbRecordingTimer = null; }
    return;
  }

  // Stop any existing recording
  if (fbRecordingId && fbMediaRecorder && fbMediaRecorder.state !== 'inactive') {
    fbMediaRecorder.stop();
    const oldBtn = document.getElementById('fb-mic-' + fbRecordingId);
    if (oldBtn) { oldBtn.classList.remove('recording'); oldBtn.textContent = '🎙️'; }
  }

  // Check MediaRecorder support
  if (typeof MediaRecorder === 'undefined') {
    if (status) {
      status.style.display = 'block';
      status.textContent = '⚠️ Voice not supported in this browser';
      setTimeout(() => { status.style.display = 'none'; }, 4000);
    }
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    fbAudioChunks = [];

    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
      ? 'audio/webm;codecs=opus'
      : MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '';

    const opts = mimeType ? { mimeType, audioBitsPerSecond: 32000 } : { audioBitsPerSecond: 32000 };
    fbMediaRecorder = new MediaRecorder(stream, opts);
    fbRecordingId = id;

    fbMediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) fbAudioChunks.push(e.data);
    };

    fbMediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      if (fbRecordingTimer) { clearInterval(fbRecordingTimer); fbRecordingTimer = null; }

      const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
      const blob = new Blob(fbAudioChunks, { type: mimeType || 'audio/webm' });
      if (blob.size < 1000) {
        if (status) { status.textContent = '⚠️ Too short'; status.style.display = 'block'; setTimeout(() => { status.style.display = 'none'; }, 2000); }
        return;
      }

      if (status) { status.style.display = 'block'; status.textContent = '⏳ Transcribing...'; }

      try {
        const formData = new FormData();
        formData.append('file', blob, 'voice.' + ext);
        formData.append('model', 'whisper-1');
        formData.append('language', 'en');

        const res = await fetchWithTimeout('https://api.openai.com/v1/audio/transcriptions', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + getOKey() },
          body: formData
        }, 30000);

        const data = await res.json();
        if (data && data.text) {
          // Write to the correct input
          const inputId = id === '_bs' ? 'bsFeedback' : 'fb-text-' + id;
          const input = document.getElementById(inputId);
          if (input) input.value = input.value ? input.value + ' ' + data.text : data.text;
          if (status) { status.textContent = '✅ Got it!'; setTimeout(() => { status.style.display = 'none'; }, 1500); }
        } else {
          if (status) { status.textContent = '❌ ' + ((data && data.error) ? data.error.message : 'Failed'); setTimeout(() => { status.style.display = 'none'; }, 3000); }
        }
      } catch (err) {
        if (status) { status.textContent = '❌ ' + (err.message || 'Failed'); setTimeout(() => { status.style.display = 'none'; }, 3000); }
      }
    };

    fbMediaRecorder.start(250);
    btn.classList.add('recording');
    btn.textContent = '⏹️';
    if (status) { status.style.display = 'block'; status.textContent = '🔴 Recording...'; }

    // Auto-stop at MAX_RECORDING_SECONDS
    setTimeout(() => {
      if (fbRecordingId === id && fbMediaRecorder && fbMediaRecorder.state !== 'inactive') {
        fbMediaRecorder.stop();
        btn.classList.remove('recording');
        btn.textContent = '🎙️';
        fbRecordingId = null;
        showToast('Recording auto-stopped at ' + (MAX_RECORDING_SECONDS / 60) + ' min', 'info');
      }
    }, MAX_RECORDING_SECONDS * 1000);

  } catch (err) {
    if (status) {
      status.style.display = 'block';
      if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
        status.textContent = '🚫 Mic access denied — check browser settings';
      } else {
        status.textContent = '❌ ' + (err.message || 'Mic error');
      }
      setTimeout(() => { status.style.display = 'none'; }, 5000);
    }
  }
}

/**

 * @returns {Object} Taste profile object
 */
function getTasteProfile() {
  const defaults = {
    liked_topics: [], rejected_topics: [],
    liked_funnels: { tof: 0, mof: 0, bof: 0 },
    rejected_reasons: [], notes: [],
    history: [] // timestamped entries for recency weighting
  };
  const taste = secureLoad('_taste', defaults);
  if (!taste.liked_topics) taste.liked_topics = [];
  if (!taste.rejected_topics) taste.rejected_topics = [];
  if (!taste.liked_funnels) taste.liked_funnels = { tof: 0, mof: 0, bof: 0 };
  if (!taste.rejected_reasons) taste.rejected_reasons = [];
  if (!taste.notes) taste.notes = [];
  if (!taste.history) taste.history = [];
  return taste;
}

/**
 * Saves the taste profile to secure storage.
 * @param {Object} taste - Taste profile
 */
function saveTasteProfile(taste) {
  secureStore('_taste', taste);
}

/**

 */
function resetTasteProfile() {
  const defaults = {
    liked_topics: [], rejected_topics: [],

  };

/**
 * Computes per-topic approve/reject ratios with recency weighting.
 * @returns {Object.<string, {approved: number, rejected: number, ratio: number}>}
 */
function getTopicRatios() {
  const taste = getTasteProfile();
  const ratios = {};
  const now = Date.now();
  const DAY_MS = 86400000;

  // Process history entries with recency weighting
  const history = Array.isArray(taste.history) ? taste.history : [];
  for (const entry of history) {
    if (!entry || !entry.topic) continue;
    const topic = entry.topic;
    if (!ratios[topic]) ratios[topic] = { approved: 0, rejected: 0, ratio: 0 };
    // Weight: 1.0 for today, decays to 0.3 for entries > 7 days old
    const ageDays = Math.max(0, (now - (entry.ts || 0)) / DAY_MS);
    const weight = Math.max(0.3, 1 - (ageDays * 0.1));
    if (entry.action === 'approve') {
      ratios[topic].approved += weight;
    } else if (entry.action === 'reject') {
      ratios[topic].rejected += weight;
    }
  }

  // Calculate ratios
  for (const topic of Object.keys(ratios)) {
    const total = ratios[topic].approved + ratios[topic].rejected;
    ratios[topic].ratio = total > 0 ? ratios[topic].approved / total : 0.5;
  }

  return ratios;
}

/**
 * Calculates a confidence score for an idea based on taste profile.
 * @param {Object} idea - The idea object
 * @returns {{score: number, label: string}} Confidence score (0-1) and label
 */
function getIdeaConfidence(idea) {
  if (!idea || !idea.topic) return { score: 0.5, label: '' };
  const ratios = getTopicRatios();
  const topicData = ratios[idea.topic];

  if (!topicData || (topicData.approved + topicData.rejected) < 2) {
    return { score: 0.5, label: '' }; // Not enough data
  }

  const score = topicData.ratio;
  if (score >= 0.7) return { score, label: 'Likely match' };
  if (score <= 0.3) return { score, label: 'Unlikely match' };
  return { score, label: '' };
}

/**
 * Renders the taste profile summary in the Ideas tab.
 */
function renderTasteSummary() {
  const container = document.getElementById('tasteSummary');
  if (!container) return;

  const taste = getTasteProfile();
  const ratios = getTopicRatios();
  const topics = Object.keys(ratios);

  if (topics.length === 0 && taste.liked_topics.length === 0 && taste.rejected_topics.length === 0) {
    container.innerHTML = '';
    return;
  }

  // Count topic frequencies
  const liked = {};
  const rejected = {};
  for (const t of (taste.liked_topics || [])) { liked[t] = (liked[t] || 0) + 1; }
  for (const t of (taste.rejected_topics || [])) { rejected[t] = (rejected[t] || 0) + 1; }

  const likedArr = Object.entries(liked).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const rejectedArr = Object.entries(rejected).sort((a, b) => b[1] - a[1]).slice(0, 5);

  let html = '<div class="taste-summary"><h3>📊 Your Taste Profile</h3>';

  if (likedArr.length > 0) {
    html += '<div style="margin-bottom:4px;color:#888;font-size:11px">Topics you like:</div><div class="taste-row">';
    for (const [topic, count] of likedArr) {
      const r = ratios[topic];
      const pct = r ? Math.round(r.ratio * 100) : '?';
      html += '<span class="taste-tag liked">' + esc(TOPIC_LABELS[topic] || topic) + '<span class="taste-ratio">' + pct + '% match</span></span>';
    }
    html += '</div>';
  }

  if (rejectedArr.length > 0) {
    html += '<div style="margin-bottom:4px;color:#888;font-size:11px;margin-top:6px">Topics you skip:</div><div class="taste-row">';
    for (const [topic] of rejectedArr) {
      html += '<span class="taste-tag rejected">' + esc(TOPIC_LABELS[topic] || topic) + '</span>';
    }
    html += '</div>';
  }

  html += '<div class="taste-actions"><button class="taste-reset" onclick="resetTasteProfile()">Reset Taste</button></div>';
  html += '</div>';

  container.innerHTML = html;
}

/**
 * Restores generation session state from localStorage.
 * Called on page load if a saved session exists.
 * Returns true if state was restored.
 */
function restoreSessionState() {
  const state = secureLoad('_session', null);
  if (!state || !state.scripts || !Array.isArray(state.scripts) || state.scripts.length === 0) return false;
  
  // Don't restore sessions older than 4 hours
  if (state.savedAt && (Date.now() - state.savedAt > 4 * 60 * 60 * 1000)) {
    localStorage.removeItem('_session');
    localStorage.removeItem('_session_h');
    return false;
  }
  
  _isRestoring = true;
  try {
    window._scripts = state.scripts;
    _chatHistory = Array.isArray(state.chatHistory) ? state.chatHistory : [];
    _chatSystemContext = state.chatSystemContext || '';
    _nextReelSuggestion = state.nextReelSuggestion || null;
    window._brainSources = Array.isArray(state.brainSources) ? state.brainSources : [];
    
    // Restore idea text
    const ideaEl = document.getElementById('idea');
    if (ideaEl && state.idea) ideaEl.value = state.idea;
    
    // Re-render the scripts output
    generate_renderScripts();
    
    // Re-render chat messages if any exist
    if (_chatHistory.length > 0) {
      renderChatMessages();
    }
  } finally {
    _isRestoring = false;
  }
  
  showToast('✅ Session restored', 'success', { duration: 2000 });
  return true;
}

/**
 * Generates 4 script variants from the user's idea input.
 * Includes triple brain search, retry logic, and progress indicators.
 */
async function generate() {
  const btn = document.getElementById('genBtn');
  if (btn && btn.disabled) return; // Already generating
  const ideaEl = document.getElementById('idea');
  const idea = ideaEl ? ideaEl.value.trim() : '';
  if (!idea) return;

  if (!checkRateLimit()) return;

  const out = document.getElementById('output');
  if (!btn || !out) return;

  btn.disabled = true;
  btn.textContent = '🧠 Triple-searching brain...';
  out.innerHTML = '<div class="loading"><div class="bar"><div class="fill"></div></div><p>Deep searching your knowledge base (3 passes)...</p></div>';

  // TRIPLE BRAIN SEARCH
  let topicResults = [], storyResults = [], psychResults = [];
  try {
    [topicResults, storyResults, psychResults] = await Promise.all([
      searchBrain(idea, 6),
      searchBrain('my personal story experience about ' + idea, 4),
      searchBrain('psychology emotions mindset ' + idea, 4),
    ]);
  } catch (e) {
    // Brain API down — continue without brain context
  }

  // Deduplicate
  const seen = new Set();
  const allResults = [];
  for (const r of [...topicResults, ...storyResults, ...psychResults]) {
    if (!r || !r.text) continue;
    const key = r.text.substring(0, 80);
    if (!seen.has(key)) { seen.add(key); allResults.push(r); }
  }

  window._brainSources = allResults;

  const reelQuotes = allResults.filter(r => r.type === 'reel');
  const bookKnowledge = allResults.filter(r => r.type === 'book');
  const courseContent = allResults.filter(r => r.type === 'course');

  let brainContext = '';
  if (reelQuotes.length > 0) {
    brainContext += '\n\n## YOUR OWN WORDS ON THIS TOPIC (from your reels — USE THESE EXACT PHRASES):\n';
    brainContext += reelQuotes.map(r => '"' + r.text + '"').join('\n\n');
  }
  if (bookKnowledge.length > 0) {
    brainContext += '\n\n## BOOK KNOWLEDGE (weave in naturally, don\'t quote the author — make it sound like YOUR insight):\n';
    brainContext += bookKnowledge.map(r => '[' + (r.source || 'unknown') + ']: ' + r.text).join('\n\n');
  }
  if (courseContent.length > 0) {
    brainContext += '\n\n## FROM YOUR KCU COURSE (your own teaching — reference these frameworks):\n';
    brainContext += courseContent.map(r => r.text).join('\n\n');
  }

  const totalHits = allResults.length;
  btn.textContent = '⏳ Generating 4 scripts...';
  const chartNote = _uploadedCharts.length > 0 ? ' + ' + _uploadedCharts.length + ' chart(s) attached' : '';
  out.innerHTML = '<div class="loading"><div class="bar"><div class="fill"></div></div><p>Crafting scripts in your voice (' + totalHits + ' brain matches' + chartNote + ')...</p></div>';

  const apiBody = {
    model: 'claude-sonnet-4-20250514',
    max_tokens: 3000,
    system: SYSTEM_PROMPT,
    messages: [{ role: 'user', content: buildMessageContent((_uploadedCharts.length > 0 ? 'I\'ve attached ' + _uploadedCharts.length + ' chart screenshot(s). Analyze the chart patterns, levels, and setups visible. Reference what you SEE in the chart(s) when writing the scripts — mention specific patterns, support/resistance levels, candle formations, or indicators visible.\n\n' : '') + 'Write 4 Instagram reel scripts for this idea:\n\n"' + idea + '"\n' + brainContext + '\n\n4 variants:\n1. 🔥 AGGRESSIVE — confrontational, calling people out\n2. 📚 TEACHING — step-by-step breakdown with specifics\n3. 📖 STORY — REAL personal story (from brain context above, NOT made up)\n4. 🌶️ HOT TAKE — controversial opinion, polarizing, debate-starter\n\nCRITICAL:\n- If "YOUR OWN WORDS" section exists above, you MUST use those exact phrases in at least 2 scripts\n- Story variant MUST reference a real experience from the brain context, not a generic "I remember when..."\n- Hot take should be something 50% of traders would disagree with\n- Sound like you\'re ranting to camera, not reading a script\n- 80-180 words per script MAX\n- Return ONLY valid JSON, no markdown\n- ALSO include a "next_reel" object with: title (follow-up reel idea that chains naturally), hook (sample hook for it), why (why it chains well with this reel)') }]
  };

  let scripts = null;
  let iT = 0, oT = 0;

  // Try up to 2 times (1 retry)
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      if (attempt === 1) {
        btn.textContent = '🔄 Retrying...';
        if (!checkRateLimit()) break;
      }

      const r = await fetchWithTimeout('https://api.anthropic.com/v1/messages', {
        method: 'POST',

          'Content-Type': 'application/json',
          'x-api-key': getKey(),

          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify(apiBody)
      }, 90000);

      const data = await r.json();
      if (data && data.error) throw new Error(data.error.message || 'API error');
      if (!data || !data.content || !data.content.length) throw new Error('Empty response from API');

      const txt = data.content[0].text;
      iT = (data.usage && data.usage.input_tokens) || 0;
      oT = (data.usage && data.usage.output_tokens) || 0;

      try {
        const m = txt.match(/\{[\s\S]*"scripts"[\s\S]*\}/);

  const cost = ((iT * 3) + (oT * 15)) / 1000000;

/**
 * Regenerates a single script variant.
 * @param {number} idx - Script index to regenerate
 */
async function regenerateVariant(idx) {
  if (!window._scripts || !window._scripts[idx]) return;
  if (!checkRateLimit()) return;

  const variant = window._scripts[idx].variant;
  const ideaEl = document.getElementById('idea');
  const idea = ideaEl ? ideaEl.value.trim() : '';
  if (!idea) { showToast('No idea text to regenerate from', 'error'); return; }

  const card = document.getElementById('card' + idx);
  if (card) card.style.opacity = '0.4';

  try {
    const r = await fetchWithTimeout('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': getKey(),
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 800,
        system: SYSTEM_PROMPT,
        messages: [{ role: 'user', content: 'Regenerate ONLY the ' + variant.toUpperCase() + ' variant for this idea:\n\n"' + idea + '"\n\nReturn ONLY valid JSON: {"script":{"variant":"' + variant + '","hook":"...","body":"...","cta":"...","visual_notes":"...","estimated_seconds":45,"energy":"high"}}' }]
      })
    }, 60000);

    const data = await r.json();
    if (data && data.error) throw new Error(data.error.message);
    if (!data || !data.content || !data.content.length) throw new Error('Empty response');

    const txt = data.content[0].text;
    const m = txt.match(/\{[\s\S]*"script"[\s\S]*\}/);
    if (m) {
      const parsed = JSON.parse(m[0]);
      if (parsed.script && validateScript(parsed.script)) {
        window._scripts[idx] = parsed.script;
        // Re-render all (simplest approach)
        const out = document.getElementById('output');
        if (out) {
          // Trigger full re-render by calling generate display logic
          showToast('Variant regenerated!', 'success');
          // Quick re-render of just this card
          generate_renderScripts();
          // Save updated session state
          saveSessionState();
        }
        return;
      }
    }
    throw new Error('Bad response');
  } catch (e) {
    showToast('Regen failed: ' + (e.message || 'unknown'), 'error');
  } finally {
    if (card) card.style.opacity = '1';
  }
}

/**
 * Copies a single script to clipboard and tracks the copy.
 * @param {number} i - Script index
 */
function copyOne(i) {
  const s = window._scripts ? window._scripts[i] : null;
  if (!s) return;
  const t = '[HOOK]\n' + (s.hook || '') + '\n\n[BODY]\n' + (s.body || '') + '\n\n[CTA]\n' + (s.cta || '') + '\n\n[VISUAL NOTES]\n' + (s.visual_notes || '');

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(() => {
      const btns = document.querySelectorAll('.copy-btn');
      if (btns[i]) { btns[i].textContent = '✅'; setTimeout(() => { if (btns[i]) btns[i].textContent = '📋'; }, 2000); }
    }).catch(() => {
      fallbackCopy(t);
    });
  } else {
    fallbackCopy(t);
  }

  // Track copy as implicit quality signal
  const key = (s.variant || '') + '_' + i;
  window._scriptCopies[key] = (window._scriptCopies[key] || 0) + 1;
  localStorage.setItem('_scriptCopies', JSON.stringify(window._scriptCopies));
  haptic(5);
}

/**
 * Copies all scripts to clipboard.
 */
function copyAll() {
  if (!window._scripts || window._scripts.length === 0) return;
  const t = window._scripts.map(s =>
    '=== ' + (ICONS[s.variant] || '🎬') + ' ' + (s.variant || '').toUpperCase() + ' ===\n\n[HOOK]\n' + (s.hook || '') + '\n\n[BODY]\n' + (s.body || '') + '\n\n[CTA]\n' + (s.cta || '') + '\n\n[VISUAL NOTES]\n' + (s.visual_notes || '')
  ).join('\n\n' + '─'.repeat(50) + '\n\n');

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(() => {
      const btn = document.querySelector('.copy-all');
      if (btn) { btn.textContent = '✅ Copied!'; setTimeout(() => { if (btn) btn.textContent = '📋 Copy All'; }, 2000); }
    }).catch(() => { fallbackCopy(t); });
  } else {
    fallbackCopy(t);
  }
  haptic(5);
}

/**
 * Fallback copy method using textarea selection.
 * @param {string} text - Text to copy
 */
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) { /* fail silently */ }
  document.body.removeChild(ta);
  showToast('Copied!', 'success', { duration: 1500 });
}

/**
 * Sends a chat message to refine scripts.
 */
async function sendChatMessage() {
  if (!_chatSystemContext) {
    showToast('Generate scripts first before using chat', 'error');
    return;
  }
  
  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('chatSendBtn');
  if (!input || !sendBtn) return;
  
  const message = input.value.trim();
  if (!message) return;
  
  // Safety timeout check
  if (_chatLoading && _chatLoadingStarted && (Date.now() - _chatLoadingStarted > 90000)) {
    _chatLoading = false; // Force reset stuck state
  }
  
  if (_chatLoading) return;
  _chatLoading = true;
  _chatLoadingStarted = Date.now();
  sendBtn.disabled = true;
  
  if (!checkRateLimit()) {
    _chatLoading = false;
    sendBtn.disabled = false;
    return;
  }
  
  // Add user message
  _chatHistory.push({ role: 'user', content: message });
  if (_chatHistory.length > 30) {
    _chatHistory = _chatHistory.slice(-30);
  }
  input.value = '';
  input.style.height = 'auto';
  renderChatMessages();
  
  // Show loading
  _chatLoading = true;
  sendBtn.disabled = true;
  const loadingEl = document.getElementById('chatLoading');
  if (loadingEl) loadingEl.style.display = 'flex';
  
  try {
    const r = await fetchWithTimeout('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': getKey(),
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 2000,
        system: _chatSystemContext,
        messages: _chatHistory
      })
    }, 60000);
    
    const data = await r.json();
    if (data && data.error) throw new Error(data.error.message || 'API error');
    if (!data || !data.content || !data.content.length) throw new Error('Empty response');
    
    const reply = data.content[0].text;
    _chatHistory.push({ role: 'assistant', content: reply });
    if (_chatHistory.length > 30) {
      _chatHistory = _chatHistory.slice(-30);
    }
    renderChatMessages();
    saveSessionState();
    
  } catch (e) {
    _chatHistory.push({ role: 'assistant', content: '❌ Error: ' + (e.message || 'Failed to get response. Try again.') });
    try {
      renderChatMessages();
    } catch (renderErr) {
      // Fallback if renderChatMessages throws
      console.error('Failed to render chat messages:', renderErr);
    }
    saveSessionState();
  } finally {
    _chatLoading = false;
    const sendBtn = document.getElementById('chatSendBtn');
    if (sendBtn) sendBtn.disabled = false;
    const loadingEl = document.getElementById('chatLoading');
    if (loadingEl) loadingEl.style.display = 'none';
  }
}

/**
 * Renders chat messages in the chat container.
 */
function renderChatMessages() {
  const container = document.getElementById('chatMessages');
  if (!container) return;
  
  if (_chatHistory.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:#333;font-size:13px;padding:20px">No messages yet. Ask me to refine your scripts!</div>';
    return;
  }
  
  let html = '';
  _chatHistory.forEach(msg => {
    const isUser = msg.role === 'user';
    html += '<div class="chat-message ' + msg.role + '">'
      + '<div class="chat-bubble">' + formatChatText(msg.content) + '</div>'
      + '</div>';
  });
  
  container.innerHTML = html;
  requestAnimationFrame(() => {
    container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
  });
}

/**
 * Formats chat text with basic markdown-like rendering.
 * @param {string} text - Raw text
 * @returns {string} HTML formatted text
 */
function formatChatText(text) {
  if (!text) return '';
  let html = esc(text);
  // Bold: **text**
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // Italic: *text*
  html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  // Inline code: `text`
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Line breaks
  html = html.replace(/\n/g, '<br>');
  return html;
}

// Chat voice recording state
let _chatMediaRecorder = null;
let _chatAudioChunks = [];
let _chatRecording = false;

/**
 * Toggles voice recording for chat input.
 */
async function toggleChatMic() {
  if (isRecording) {
    showToast('Stop the main mic first', 'error');
    return;
  }
  if (fbRecordingId) {
    showToast('Stop feedback recording first', 'error');
    return;
  }
  
  const btn = document.getElementById('chatMicBtn');
  const status = document.getElementById('chatMicStatus');
  if (!btn) return;
  
  if (_chatRecording) {
    if (_chatMediaRecorder && _chatMediaRecorder.state !== 'inactive') _chatMediaRecorder.stop();
    _chatRecording = false;
    btn.classList.remove('recording');
    btn.textContent = '🎙️';
    if (status) { status.textContent = '⏳ Transcribing...'; status.style.display = 'block'; }
    return;
  }
  
  if (typeof MediaRecorder === 'undefined') {
    if (status) { status.style.display = 'block'; status.textContent = '⚠️ Voice not supported'; setTimeout(() => { status.style.display = 'none'; }, 3000); }
    return;
  }
  
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    _chatAudioChunks = [];
    
    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
      ? 'audio/webm;codecs=opus'
      : MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '';
    
    const opts = mimeType ? { mimeType, audioBitsPerSecond: 32000 } : { audioBitsPerSecond: 32000 };
    _chatMediaRecorder = new MediaRecorder(stream, opts);
    _chatRecording = true;
    
    _chatMediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) _chatAudioChunks.push(e.data);
    };
    
    _chatMediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      _chatRecording = false;
      
      const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
      const blob = new Blob(_chatAudioChunks, { type: mimeType || 'audio/webm' });
      if (blob.size < 1000) {
        if (status) { status.textContent = '⚠️ Too short'; status.style.display = 'block'; setTimeout(() => { status.style.display = 'none'; }, 2000); }
        return;
      }
      
      if (status) { status.style.display = 'block'; status.textContent = '⏳ Transcribing...'; }
      
      try {
        const formData = new FormData();
        formData.append('file', blob, 'voice.' + ext);
        formData.append('model', 'whisper-1');
        formData.append('language', 'en');
        
        const res = await fetchWithTimeout('https://api.openai.com/v1/audio/transcriptions', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + getOKey() },
          body: formData
        }, 30000);
        
        const data = await res.json();
        if (data && data.text) {
          const input = document.getElementById('chatInput');
          if (input) input.value = input.value ? input.value + ' ' + data.text : data.text;
          if (status) { status.textContent = '✅ Got it!'; setTimeout(() => { status.style.display = 'none'; }, 1500); }
        } else {
          if (status) { status.textContent = '❌ Failed'; setTimeout(() => { status.style.display = 'none'; }, 3000); }
        }
      } catch (err) {
        if (status) { status.textContent = '❌ ' + (err.message || 'Failed'); setTimeout(() => { status.style.display = 'none'; }, 3000); }
      }
    };
    
    _chatMediaRecorder.start(250);
    btn.classList.add('recording');
    btn.textContent = '⏹️';
    if (status) { status.style.display = 'block'; status.textContent = '🔴 Recording...'; }
    
    // Auto-stop at MAX_RECORDING_SECONDS
    setTimeout(() => {
      if (_chatRecording && _chatMediaRecorder && _chatMediaRecorder.state !== 'inactive') {
        _chatMediaRecorder.stop();
        btn.classList.remove('recording');
        btn.textContent = '🎙️';
        _chatRecording = false;
        showToast('Chat recording auto-stopped at ' + (MAX_RECORDING_SECONDS / 60) + ' min', 'info');
      }
    }, MAX_RECORDING_SECONDS * 1000);
    
  } catch (err) {
    if (status) {
      status.style.display = 'block';
      status.textContent = err.name === 'NotAllowedError' ? '🚫 Mic access denied' : '❌ ' + (err.message || 'Mic error');
      setTimeout(() => { status.style.display = 'none'; }, 4000);
    }
  }
}

/**
 * Loads and displays the Ideas tab content.
 */
function loadIdeasTab() {
  const ideas = secureLoad('_ideas', []);
  const ts = parseInt(localStorage.getItem('_ideas_ts') || '0') || 0;
  const age = Date.now() - ts;

  renderTasteSummary();

  if (!Array.isArray(ideas) || ideas.length === 0) {
    generateAllIdeas(false);
  } else if (age > IDEAS_STALE_MS) {
    // Show existing ideas but show a subtle "stale" banner — don't auto-regenerate
    renderIdeas(ideas);
    updateIdeasAge(ts);
    const container = document.getElementById('ideasContent');
    if (container) {
      container.insertAdjacentHTML('afterbegin', '<div style="text-align:center;padding:12px;color:#d4a843;font-size:13px;border:1px solid #333;border-radius:8px;margin-bottom:12px">⏰ Ideas are ' + Math.round(age/3600000) + 'h old. Tap "🔄 Generate Fresh Ideas" to refresh.</div>');
    }
  } else {
    renderIdeas(ideas);
    updateIdeasAge(ts);
  }
}

/**
 * Updates the "Generated X ago" text.
 * @param {number} ts - Timestamp of generation
 */
function updateIdeasAge(ts) {
  const el = document.getElementById('ideasAge');
  if (!el) return;
  if (!ts) { el.textContent = ''; return; }
  const hrs = Math.floor((Date.now() - ts) / 3600000);
  const mins = Math.floor((Date.now() - ts) / 60000) % 60;
  el.textContent = hrs > 0 ? 'Generated ' + hrs + 'h ' + mins + 'm ago' : 'Generated ' + mins + 'm ago';
}

/**
 * Fetches trending context from brain for idea generation.
 * @returns {Promise<string>}
 */
async function fetchTrendingContext() {
  try {
    const queries = ['stock market news today', 'trading trending topics', 'day trading social media'];
    const results = await Promise.all(queries.map(q => searchBrain(q, 3)));
    const all = results.flat().filter(r => r && r.text);
    if (all.length === 0) return 'No trending context available — use general market awareness.';
    return all.map(r => r.text).join('\n\n');
  } catch (e) {
    return 'No trending context available — use general market awareness.';
  }
}

/**
 * Generates all 30 daily ideas with retry logic and progress indicators.
 * @param {boolean} force - If true, always regenerate
 */
async function generateAllIdeas(force) {
  const container = document.getElementById('ideasContent');
  const btn = document.getElementById('refreshAllBtn');
  if (!container || !btn) return;

  if (!checkRateLimit()) return;

  btn.disabled = true;
  btn.textContent = '🧠 Searching brain for trends...';
  renderSkeletonCards(container);

  const taste = getTasteProfile();
  const tasteStr = JSON.stringify(taste, null, 2);

  let trending;
  try {
    trending = await fetchTrendingContext();
  } catch (e) {
    trending = 'No trending context available — use general market awareness.';
  }

  btn.textContent = '⏳ Generating 30 ideas (TOF → MOF → BOF)...';

  const now = new Date();
  const dateStr = now.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  const dayStr = now.toLocaleDateString('en-US', { weekday: 'long' });
  const prompt = IDEAS_SYSTEM_PROMPT
    .replace('{todays_date}', dateStr)
    .replace('{day_of_week}', dayStr)
    .replace('{todays_date}', dateStr)
    .replace('{taste_profile}', tasteStr)
    .replace('{trending_context}', trending);

  let ideas = null;

  // Try up to 2 times (1 retry)
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      if (attempt === 1) {
        btn.textContent = '🔄 Retrying...';
        if (!checkRateLimit()) break;
      }

      const r = await fetchWithTimeout('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': getKey(),
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 4000,
          system: prompt,
          messages: [{ role: 'user', content: 'Generate 30 fresh content ideas for today. Be SPECIFIC and TIMELY. Return valid JSON only.' }]
        })
      }, 90000);

      const data = await r.json();
      if (data && data.error) throw new Error(data.error.message || 'API error');
      if (!data || !data.content || !data.content.length) throw new Error('Empty response from API');

      const txt = data.content[0].text;
      let parsed;
      try {
        const m = txt.match(/\{[\s\S]*"ideas"[\s\S]*\}/);
        parsed = m ? JSON.parse(m[0]) : null;
      } catch (e) { parsed = null; }

      if (parsed && Array.isArray(parsed.ideas)) {
        // Validate each idea, keep only valid ones
        ideas = parsed.ideas.filter(validateIdea);
        // Ensure unique IDs
        ideas.forEach((idea, i) => {
          if (!idea.id) idea.id = 'idea_' + Date.now() + '_' + i;
          if (!idea.preview) idea.preview = '';
          if (!Array.isArray(idea.tags)) idea.tags = [];
        });
        if (ideas.length > 0) break; // Success
      }

      if (attempt === 0) continue; // Retry
      container.innerHTML = '<div class="error">Failed to parse ideas. Raw response:<br><pre style="white-space:pre-wrap;font-size:12px;color:#888;margin-top:8px">' + esc((txt || '').substring(0, 500)) + '</pre></div>';
    } catch (e) {
      if (attempt === 1) {
        container.innerHTML = '<div class="error">❌ ' + esc(e.message || 'Failed to generate ideas') + '</div>';
      }
    }
  }

  if (ideas && ideas.length > 0) {
    secureStore('_ideas', ideas);
    localStorage.setItem('_ideas_ts', String(Date.now()));
    renderIdeas(ideas);
    updateIdeasAge(Date.now());
    updateTabCounts();
  }

  btn.disabled = false;
  btn.textContent = '🔄 Generate Fresh Ideas';
}

  if (!idea) return '';
  const funnelClass = VALID_FUNNELS.has(idea.funnel) ? idea.funnel : 'tof';
  const funnelLabel = funnelClass === 'tof' ? 'TOF' : funnelClass === 'mof' ? 'MOF' : 'BOF';
  const topicLabel = TOPIC_LABELS[idea.topic] || idea.topic || 'General';
  const safeId = (idea.id || '').replace(/[^a-zA-Z0-9_-]/g, '');
  const confidence = getIdeaConfidence(idea);

    + '<span class="idea-badge ' + funnelClass + '">' + funnelLabel + '</span>'
    + '<span class="idea-badge topic">' + esc(topicLabel) + '</span>';
  if (confidence.label) {
    badges += '<span class="idea-badge confidence">' + esc(confidence.label) + '</span>';
  }

  return '<div class="idea-card" id="card-' + safeId + '" data-idea-id="' + safeId + '">'
    + badges
    + '<div class="idea-title">' + esc(idea.title) + '</div>'
    + '<button class="idea-toggle" onclick="togglePreview(\'' + safeId + '\')">▶ Preview</button>'
    + '<div class="idea-preview" id="preview-' + safeId + '">' + esc(idea.preview || '') + '</div>'
    + '<div class="idea-actions">'
    + '<button class="idea-action approve" onclick="approveIdea(\'' + safeId + '\')">✅</button>'
    + '<button class="idea-action reject" onclick="handleReject(\'' + safeId + '\')">❌</button>'
    + '<button class="idea-action refresh" onclick="refreshIdea(\'' + safeId + '\')">🔄</button>'
    + '</div>'
    + (isMobile() ? '' : '<div class="reject-form" id="reject-' + safeId + '">'
      + '<select id="reason-' + safeId + '"><option value="">Why not?</option><option value="done_before">Done before</option><option value="boring">Boring</option><option value="not_my_style">Not my style</option><option value="wrong_timing">Wrong timing</option><option value="too_generic">Too generic</option><option value="other">Other</option></select>'
      + '<div class="fb-row"><input type="text" id="fb-text-' + safeId + '" placeholder="Optional feedback...">'

// ========== APPROVE / REJECT ==========

const _busyCards = new Set();

/**
 * Approves an idea: moves it to approved queue with undo toast.
 * @param {string} id - Safe card ID
 */
function approveIdea(id) {
  if (_busyCards.has(id)) return;
  _busyCards.add(id);

  try {
    const ideas = secureLoad('_ideas', []);
    if (!Array.isArray(ideas)) { _busyCards.delete(id); return; }
    const idx = ideas.findIndex(i => (i.id || '').replace(/[^a-zA-Z0-9_-]/g, '') === id);
    if (idx === -1) { _busyCards.delete(id); return; }

    const idea = ideas[idx];
    ideas.splice(idx, 1);
    secureStore('_ideas', ideas);

    // Add to approved
    const approved = secureLoad('_approved', []);
    idea.approvedAt = Date.now();
    idea.filmed = false;
    approved.unshift(idea);
    secureStore('_approved', approved);

    // Update taste with timestamped history
    const taste = getTasteProfile();
    taste.liked_topics.push(idea.topic);
    if (taste.liked_funnels && taste.liked_funnels[idea.funnel] !== undefined) taste.liked_funnels[idea.funnel]++;
    if (taste.liked_topics.length > 50) taste.liked_topics = taste.liked_topics.slice(-50);
    taste.history.push({ action: 'approve', topic: idea.topic, funnel: idea.funnel, ts: Date.now() });
    if (taste.history.length > 100) taste.history = taste.history.slice(-100);
    saveTasteProfile(taste);

    haptic(15);

    // Animate slide out
    const card = document.getElementById('card-' + id);
    if (card) {
      card.classList.add('slide-out-right');
      setTimeout(() => { renderIdeas(ideas); updateTabCounts(); renderTasteSummary(); }, 350);
    } else {
      renderIdeas(ideas);
      updateTabCounts();
      renderTasteSummary();
    }

    // Show toast with undo
    showToast('✅ Approved!', 'success', {
      duration: 5000,
      onUndo: () => {
        // Undo: remove from approved, add back to ideas
        const currentApproved = secureLoad('_approved', []);
        const undoIdx = currentApproved.findIndex(a => (a.id || '').replace(/[^a-zA-Z0-9_-]/g, '') === id);
        if (undoIdx !== -1) {
          const undone = currentApproved.splice(undoIdx, 1)[0];
          delete undone.approvedAt;
          delete undone.filmed;
          secureStore('_approved', currentApproved);
          const currentIdeas = secureLoad('_ideas', []);
          currentIdeas.push(undone); // Push to end instead of using stale idx
          secureStore('_ideas', currentIdeas);
          renderIdeas(currentIdeas);
          updateTabCounts();
          showToast('Approve undone', 'info', { duration: 1500 });
        }
      }
    });
  } finally {
    _busyCards.delete(id);
  }
}

/**
 * Core reject logic: saves feedback, updates taste, replaces idea, with undo.
 * @param {string} id - Safe card ID
 * @param {string} reason - Reject reason
 * @param {string} text - Optional feedback text
 */
async function doReject(id, reason, text) {
  if (_busyCards.has(id)) return;
  _busyCards.add(id);

  try {
    const ideas = secureLoad('_ideas', []);
    if (!Array.isArray(ideas)) { _busyCards.delete(id); return; }
    const idx = ideas.findIndex(i => (i.id || '').replace(/[^a-zA-Z0-9_-]/g, '') === id);
    if (idx === -1) { _busyCards.delete(id); return; }

    const idea = ideas[idx];

    // Save feedback
    const feedback = _safeParse('_feedback', '[]');
    feedback.push({ ideaId: idea.id, title: idea.title, funnel: idea.funnel, topic: idea.topic, reason: reason || '', text: text || '', ts: Date.now() });
    localStorage.setItem('_feedback', JSON.stringify(feedback));

    // Update taste with history
    const taste = getTasteProfile();
    taste.rejected_topics.push(idea.topic);
    if (reason) taste.rejected_reasons.push(reason);
    if (text) taste.notes.push(text);
    if (taste.rejected_topics.length > 50) taste.rejected_topics = taste.rejected_topics.slice(-50);
    if (taste.rejected_reasons.length > 50) taste.rejected_reasons = taste.rejected_reasons.slice(-50);
    if (taste.notes.length > 30) taste.notes = taste.notes.slice(-30);
    taste.history.push({ action: 'reject', topic: idea.topic, funnel: idea.funnel, reason: reason || '', ts: Date.now() });
    if (taste.history.length > 100) taste.history = taste.history.slice(-100);
    saveTasteProfile(taste);

    haptic(15);

    // Animate slide out
    const card = document.getElementById('card-' + id);
    if (card) card.classList.add('slide-out-left');

    // Store for undo
    const rejectedIdea = { ...idea };
    const rejectedIdx = idx;

    // Replace with new idea
    try {
      const newIdea = await generateOneIdea(idea.funnel);
      if (newIdea && validateIdea(newIdea)) {
        ideas[idx] = newIdea;
      } else {
        ideas.splice(idx, 1);
      }
    } catch (e) {
      ideas.splice(idx, 1);
    }

    secureStore('_ideas', ideas);

    setTimeout(() => {
      renderIdeas(ideas);
      updateTabCounts();
      renderTasteSummary();
    }, card ? 350 : 0);

    // Show undo toast
    showToast('❌ Rejected', 'info', {
      duration: 5000,
      onUndo: () => {
        const currentIdeas = secureLoad('_ideas', []);
        currentIdeas.splice(Math.min(rejectedIdx, currentIdeas.length), 0, rejectedIdea);
        secureStore('_ideas', currentIdeas);
        renderIdeas(currentIdeas);
        updateTabCounts();
        showToast('Reject undone', 'info', { duration: 1500 });
      }
    });
  } finally {
    _busyCards.delete(id);
  }
}

/**
 * Refreshes a single idea with a new one.
 * @param {string} id - Safe card ID
 */
async function refreshIdea(id) {
  if (_busyCards.has(id)) return;
  _busyCards.add(id);

  try {
    const ideas = secureLoad('_ideas', []);
    if (!Array.isArray(ideas)) { _busyCards.delete(id); return; }
    const idx = ideas.findIndex(i => (i.id || '').replace(/[^a-zA-Z0-9_-]/g, '') === id);
    if (idx === -1) { _busyCards.delete(id); return; }

    const idea = ideas[idx];
    const card = document.getElementById('card-' + id);
    if (card) card.classList.add('replacing');

    try {
      const newIdea = await generateOneIdea(idea.funnel);
      if (newIdea && validateIdea(newIdea)) {
        ideas[idx] = newIdea;
      }
    } catch (e) { /* keep old idea on error */ }

    secureStore('_ideas', ideas);
    renderIdeas(ideas);
    updateTabCounts();
  } finally {
    _busyCards.delete(id);
  }
}
