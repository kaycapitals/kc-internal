<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://api.anthropic.com https://api.openai.com https://kc-tools.kaycapitals.co https://api.allorigins.win; img-src 'self' data:; font-src 'self';">
<title>Content Engine</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px));-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto}
.hdr{text-align:center;padding:24px 0 20px}
.hdr h1{font-size:24px;font-weight:700;color:#d4a843;margin-bottom:6px}
.hdr p{color:#555;font-size:13px}
.input-wrap{margin-bottom:20px}
textarea{width:100%;padding:16px;border-radius:12px;border:1px solid #222;background:#111;color:#fff;font-size:16px;resize:none;outline:none;font-family:inherit;min-height:80px;transition:border-color .2s}
textarea:focus{border-color:#d4a843}
textarea::placeholder{color:#444}
.btn-row{display:flex;gap:8px;margin-top:10px}
.gen-btn{flex:1;padding:14px;border-radius:12px;border:none;background:#d4a843;color:#000;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .2s}
.gen-btn:disabled{opacity:.4;cursor:not-allowed}
.gen-btn:hover:not(:disabled){opacity:.85}
.hint{color:#333;font-size:11px;text-align:center;margin-top:6px}
.loading{text-align:center;padding:40px 20px}
.loading .bar{width:100%;height:3px;background:#1a1a1a;border-radius:2px;overflow:hidden;margin-bottom:16px}
.loading .fill{width:0%;height:100%;background:#d4a843;border-radius:2px;animation:load 8s ease-in-out forwards}
@keyframes load{0%{width:0%}50%{width:60%}90%{width:85%}100%{width:92%}}
.loading p{color:#555;font-size:13px}
.error{padding:14px;border-radius:10px;background:#1a0a0a;color:#cc4444;font-size:14px;margin-bottom:16px}
.results-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.results-hdr h2{color:#fff;font-size:18px}
.copy-all{padding:10px 14px;border-radius:8px;border:1px solid #d4a843;background:transparent;color:#d4a843;font-size:12px;cursor:pointer;min-height:44px}
.card{background:#111;border:1px solid #1a1a1a;border-radius:14px;padding:18px;margin-bottom:16px}
.card-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #1a1a1a}
.badge{font-size:14px;font-weight:700;color:#d4a843;letter-spacing:.5px}
.card-meta{display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dur{color:#555;font-size:12px}
.copy-btn{background:none;border:none;font-size:16px;cursor:pointer;padding:8px;min-height:44px;min-width:44px}
.section{margin-bottom:14px}
.lbl{font-size:10px;font-weight:700;color:#d4a843;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px}
.hook-box{padding:12px;border-radius:10px;background:#161616;border-left:3px solid #d4a843}
.hook-box p{color:#fff;font-size:16px;font-weight:600;line-height:1.4}
.body-text{color:#bbb;font-size:14px;line-height:1.7;white-space:pre-wrap}
.cta-box{padding:10px 12px;border-radius:10px;background:#0f1a0f}
.cta-box p{color:#6b6;font-size:14px;font-weight:500;line-height:1.5}
.vis-box{padding:8px 12px;border-radius:8px;background:#0f0f1a}
.vis-box p{color:#88c;font-size:12px;line-height:1.5;font-style:italic}
.cost{text-align:center;color:#333;font-size:11px;padding:8px}
.raw{color:#bbb;font-size:13px;white-space:pre-wrap;line-height:1.6}

/* Tab Navigation */
.tab-bar{display:flex;gap:0;border-bottom:1px solid #222;margin-bottom:20px;overflow-x:auto;-webkit-overflow-scrolling:touch;position:relative}
.tab-btn{flex:1;padding:14px 8px;background:none;border:none;color:#555;font-size:14px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;transition:color .2s;white-space:nowrap;min-width:0;text-align:center;position:relative;z-index:1}
.tab-btn.active{color:#d4a843;border-bottom-color:transparent}
.tab-btn:hover{color:#888}
.tab-indicator{position:absolute;bottom:0;height:3px;background:#d4a843;border-radius:2px;transition:left .3s cubic-bezier(.4,0,.2,1),width .3s cubic-bezier(.4,0,.2,1)}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* Idea Cards */
.funnel-section{margin-bottom:24px}
.funnel-hdr{font-size:16px;font-weight:700;margin-bottom:12px;padding:10px 14px;border-radius:10px;display:flex;align-items:center;gap:8px}
.funnel-hdr.tof{background:#1a0808;color:#cc2222;border:1px solid #331111}
.funnel-hdr.mof{background:#1a1508;color:#d4a843;border:1px solid #332a11}
.funnel-hdr.bof{background:#081a0c;color:#22aa44;border:1px solid #113322}

.idea-card{background:#111;border:1px solid #222;border-radius:12px;padding:14px;margin-bottom:10px;position:relative;transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .3s ease;will-change:transform,opacity;touch-action:pan-y}
.idea-card.replacing{opacity:.5;pointer-events:none}
.idea-card.slide-out-right{transform:translateX(120%);opacity:0}
.idea-card.slide-out-left{transform:translateX(-120%);opacity:0}
.idea-card.swiping{transition:none}
.idea-badges{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.idea-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.5px}
.idea-badge.tof{background:#cc2222;color:#fff}
.idea-badge.mof{background:#d4a843;color:#000}
.idea-badge.bof{background:#22aa44;color:#fff}
.idea-badge.topic{background:#222;color:#999}
.idea-badge.confidence{background:#1a1a2a;color:#88f;font-size:9px}
.idea-title{color:#fff;font-size:15px;font-weight:600;line-height:1.4;margin-bottom:8px}
.idea-preview{display:none;color:#999;font-size:13px;line-height:1.5;padding:10px;background:#0a0a0a;border-radius:8px;margin-bottom:8px}
.idea-preview.show{display:block}
.idea-toggle{background:none;border:none;color:#555;font-size:12px;cursor:pointer;padding:10px 0;margin-bottom:6px;min-height:44px}
.idea-toggle:hover{color:#888}
.idea-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.idea-action{padding:12px 16px;border-radius:8px;border:1px solid #222;background:#0a0a0a;color:#fff;font-size:14px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px;min-height:44px;min-width:44px;justify-content:center}
.idea-action:hover{border-color:#444}
.idea-action.approve{border-color:#22aa44}
.idea-action.approve:hover{background:#0a1a0f}
.idea-action.reject{border-color:#cc2222}
.idea-action.reject:hover{background:#1a0a0a}
.idea-action.refresh{border-color:#555}

/* Reject Feedback Form (desktop inline) */
.reject-form{display:none;padding:12px;background:#0a0a0a;border-radius:10px;margin-top:8px;border:1px solid #1a1111}
.reject-form.show{display:block}
.reject-form select{width:100%;padding:10px;border-radius:8px;border:1px solid #222;background:#111;color:#fff;font-size:14px;margin-bottom:8px;outline:none}
.reject-form .fb-row{display:flex;gap:6px}
.reject-form input{flex:1;padding:10px;border-radius:8px;border:1px solid #222;background:#111;color:#fff;font-size:14px;outline:none}
.reject-form .fb-mic{width:44px;height:44px;border-radius:50%;border:2px solid #333;background:#111;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.reject-form .fb-mic.recording{background:#cc2222;border-color:#cc2222}
.reject-form .fb-submit{width:100%;padding:10px;border-radius:8px;border:none;background:#cc2222;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;min-height:44px}

/* Bottom Sheet (mobile reject form) */
.bottom-sheet-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;opacity:0;transition:opacity .3s}
.bottom-sheet-overlay.show{display:flex;align-items:flex-end;opacity:1}
.bottom-sheet{width:100%;max-width:720px;margin:0 auto;background:#111;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom, 0px));transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.bottom-sheet-overlay.show .bottom-sheet{transform:translateY(0)}
.bottom-sheet-handle{width:40px;height:4px;background:#333;border-radius:2px;margin:0 auto 16px}
.bottom-sheet h3{color:#fff;font-size:16px;margin-bottom:4px}
.bottom-sheet .bs-subtitle{color:#666;font-size:13px;margin-bottom:16px}
.bottom-sheet select{width:100%;padding:12px;border-radius:10px;border:1px solid #222;background:#1a1a1a;color:#fff;font-size:15px;margin-bottom:10px;outline:none}
.bottom-sheet .fb-row{display:flex;gap:8px;margin-bottom:10px}
.bottom-sheet .fb-row input{flex:1;padding:12px;border-radius:10px;border:1px solid #222;background:#1a1a1a;color:#fff;font-size:15px;outline:none}
.bottom-sheet .fb-row .fb-mic{width:48px;height:48px;border-radius:50%;border:2px solid #333;background:#1a1a1a;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bottom-sheet .fb-row .fb-mic.recording{background:#cc2222;border-color:#cc2222}
.bottom-sheet .bs-submit{width:100%;padding:14px;border-radius:12px;border:none;background:#cc2222;color:#fff;font-size:15px;font-weight:700;cursor:pointer;min-height:48px}

/* Approved Queue */
.approved-counter{text-align:center;padding:16px;color:#d4a843;font-size:18px;font-weight:700;margin-bottom:16px}
.approved-card{background:#111;border:1px solid #222;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;flex-direction:column;gap:10px;transition:transform .3s,opacity .3s}
.approved-card.slide-out{transform:translateX(-120%);opacity:0}
.approved-title{color:#fff;font-size:15px;font-weight:600;line-height:1.4}
.approved-actions{display:flex;gap:6px;flex-wrap:wrap}
.approved-action{padding:10px 14px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;min-height:44px}
.approved-action.generate{background:#d4a843;color:#000}
.approved-action.remove{background:none;border:1px solid #cc2222;color:#cc2222}
.approved-action.filmed{background:none;border:1px solid #22aa44;color:#22aa44}
.completed-section{margin-top:24px;border-top:1px solid #222;padding-top:16px}
.completed-toggle{background:none;border:none;color:#555;font-size:13px;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;gap:6px;min-height:44px;padding:8px 0}
.completed-card{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:10px;padding:12px;margin-bottom:8px;opacity:.6}
.completed-card .idea-title{font-size:13px;color:#666}

/* Loading overlay for ideas */
.ideas-loading{text-align:center;padding:60px 20px}
.ideas-loading .spinner{width:40px;height:40px;border:3px solid #222;border-top-color:#d4a843;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.ideas-loading p{color:#555;font-size:14px}
.ideas-empty{text-align:center;padding:40px 20px;color:#444;font-size:14px}

/* Skeleton loading cards */
.skeleton-card{background:#111;border:1px solid #1a1a1a;border-radius:12px;padding:14px;margin-bottom:10px;overflow:hidden}
.skeleton-line{height:12px;background:#1a1a1a;border-radius:6px;margin-bottom:8px;position:relative;overflow:hidden}
.skeleton-line::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.03),transparent);animation:shimmer 1.5s infinite}
.skeleton-line.w60{width:60%}
.skeleton-line.w80{width:80%}
.skeleton-line.w40{width:40%}
.skeleton-line.h20{height:20px}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* Toast notification */
.toast-container{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom, 0px));left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:90%;max-width:400px}
.toast{background:#222;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,.5);pointer-events:auto;animation:toastIn .3s ease;width:100%;justify-content:space-between}
.toast.success{border-left:3px solid #22aa44}
.toast.error{border-left:3px solid #cc2222}
.toast.info{border-left:3px solid #d4a843}
.toast-undo{background:none;border:1px solid #d4a843;color:#d4a843;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;min-height:36px}
@keyframes toastIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateY(10px)}}

/* Waveform visualization */
.waveform-wrap{display:flex;align-items:center;gap:10px;margin-top:6px}
.waveform-canvas{height:32px;width:120px;border-radius:4px}
.rec-timer{color:#cc2222;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}

/* Taste profile summary */
.taste-summary{background:#111;border:1px solid #1a1a1a;border-radius:12px;padding:14px;margin-bottom:16px}
.taste-summary h3{color:#d4a843;font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.taste-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.taste-tag{font-size:11px;padding:3px 8px;border-radius:6px;font-weight:600}
.taste-tag.liked{background:#0a1a0f;color:#22aa44;border:1px solid #113322}
.taste-tag.rejected{background:#1a0a0a;color:#cc2222;border:1px solid #331111}
.taste-ratio{color:#666;font-size:11px;margin-left:4px}
.taste-actions{display:flex;gap:8px;margin-top:8px}
.taste-reset{background:none;border:1px solid #333;color:#666;padding:6px 12px;border-radius:6px;font-size:11px;cursor:pointer;min-height:36px}
.taste-reset:hover{border-color:#555;color:#999}

/* Script quality features */
.script-meta{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid #1a1a1a;margin-top:10px;flex-wrap:wrap}
.script-meta-item{color:#555;font-size:11px;display:flex;align-items:center;gap:4px}
.script-rate{display:flex;gap:4px}
.script-rate button{background:none;border:1px solid #222;border-radius:6px;padding:4px 8px;font-size:14px;cursor:pointer;min-height:36px;min-width:36px;transition:all .15s}
.script-rate button:hover{border-color:#444}
.script-rate button.rated-up{background:#0a1a0f;border-color:#22aa44}
.script-rate button.rated-down{background:#1a0a0a;border-color:#cc2222}
.script-regen{background:none;border:1px solid #333;color:#888;padding:4px 10px;border-radius:6px;font-size:12px;cursor:pointer;min-height:36px;transition:all .15s}
.script-regen:hover{border-color:#d4a843;color:#d4a843}
.brain-sources{margin-top:8px}
.brain-sources-toggle{background:none;border:none;color:#555;font-size:11px;cursor:pointer;padding:4px 0;min-height:32px}
.brain-sources-toggle:hover{color:#888}
.brain-sources-list{display:none;padding:8px;background:#0a0a0a;border-radius:8px;margin-top:4px}
.brain-sources-list.show{display:block}
.brain-source{color:#666;font-size:11px;line-height:1.5;padding:4px 0;border-bottom:1px solid #111}
.brain-source:last-child{border-bottom:none}

/* Pull to refresh */
.ptr-indicator{text-align:center;padding:0;overflow:hidden;height:0;transition:height .2s;color:#d4a843;font-size:13px}
.ptr-indicator.pulling{height:40px;padding:10px 0}
.ptr-indicator.refreshing{height:40px;padding:10px 0}

/* Session timeout overlay */
.timeout-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:3000;align-items:center;justify-content:center}
.timeout-overlay.show{display:flex}
.timeout-box{text-align:center;padding:32px}
.timeout-box h2{color:#d4a843;font-size:20px;margin-bottom:8px}
.timeout-box p{color:#666;font-size:14px;margin-bottom:20px}
.timeout-box button{padding:14px 32px;border-radius:12px;border:none;background:#d4a843;color:#000;font-size:15px;font-weight:700;cursor:pointer}

/* Rate limit indicator */
.rate-limit-bar{height:2px;background:#1a1a1a;border-radius:1px;margin-bottom:8px;overflow:hidden;opacity:0;transition:opacity .3s}
.rate-limit-bar.show{opacity:1}
.rate-limit-fill{height:100%;background:#d4a843;border-radius:1px;transition:width .3s}
.rate-limit-fill.warning{background:#cc8800}
.rate-limit-fill.danger{background:#cc2222}

@media(max-width:600px){
  body{padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px))}
  .hdr h1{font-size:20px}
  textarea{font-size:15px;padding:12px}
  .gen-btn{padding:12px;font-size:14px}
  .tab-btn{font-size:13px;padding:12px 4px}
  .idea-actions{gap:8px}
  .idea-action{padding:10px 14px;font-size:13px;min-height:44px;min-width:44px}
  /* On mobile, hide inline reject form — use bottom sheet instead */
  .reject-form{display:none !important}
}
</style>
</head>
<body>
<!-- Login Screen -->
<div id="loginScreen" style="display:flex;align-items:center;justify-content:center;min-height:100vh">
  <div style="max-width:360px;width:100%;padding:24px">
    <div style="text-align:center;margin-bottom:32px">
      <div style="font-size:40px;margin-bottom:12px">🎬</div>
      <h1 style="font-size:22px;font-weight:700;color:#d4a843;margin-bottom:6px">Content Engine</h1>
      <p style="color:#444;font-size:13px">Private access only</p>
    </div>
    <input type="password" id="loginPwd" placeholder="Password" style="width:100%;padding:14px 16px;border-radius:12px;border:1px solid #222;background:#111;color:#fff;font-size:16px;outline:none;margin-bottom:12px;font-family:inherit" autocomplete="off">
    <button onclick="checkLogin()" style="width:100%;padding:14px;border-radius:12px;border:none;background:#d4a843;color:#000;font-size:15px;font-weight:700;cursor:pointer;min-height:48px">Enter</button>
    <div id="loginErr" style="display:none;text-align:center;color:#cc4444;font-size:13px;margin-top:12px"></div>
    <button onclick="localStorage.removeItem('_cs');document.getElementById('loginErr').textContent='Session cleared';document.getElementById('loginErr').style.display='block'" style="display:block;margin:20px auto 0;background:none;border:none;color:#333;font-size:11px;cursor:pointer;min-height:44px">Clear saved session</button>
  </div>
</div>

<!-- Main App (hidden until login) -->
<div id="mainApp" style="display:none">
<div class="wrap">
  <div class="hdr">
    <h1>🎬 Content Engine</h1>
    <p>1,025 reels analyzed · your voice · your scripts</p>
    <button onclick="handleLogout()" style="background:none;border:none;color:#333;font-size:11px;cursor:pointer;margin-top:8px;min-height:44px">Log out</button>
  </div>

  <div class="rate-limit-bar" id="rateLimitBar"><div class="rate-limit-fill" id="rateLimitFill" style="width:0%"></div></div>

  <!-- Tab Navigation -->
  <div class="tab-bar" id="tabBar">
    <button class="tab-btn active" onclick="switchTab('generate')" id="tabGenerate">⚡ Generate</button>
    <button class="tab-btn" onclick="switchTab('ideas')" id="tabIdeas">💡 Ideas <span id="ideasCount">(0)</span></button>
    <button class="tab-btn" onclick="switchTab('approved')" id="tabApproved">✅ Approved <span id="approvedCount">(0)</span></button>
    <div class="tab-indicator" id="tabIndicator"></div>
  </div>

  <!-- Tab 1: Generate (existing) -->
  <div class="tab-panel active" id="panelGenerate">
    <div class="input-wrap">
      <div style="position:relative">
        <textarea id="idea" rows="3" placeholder="Drop your idea here or tap the mic to speak..." style="padding-right:56px"></textarea>
        <button id="micBtn" onclick="toggleMic()" style="position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:50%;border:2px solid #333;background:#111;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s">🎙️</button>
      </div>
      <div id="micStatus" style="display:none;text-align:center;padding:8px;color:#d4a843;font-size:13px"></div>
      <div id="micWaveform" style="display:none" class="waveform-wrap">
        <canvas id="waveformCanvas" class="waveform-canvas" width="120" height="32"></canvas>
        <span class="rec-timer" id="recTimer">0:00</span>
      </div>
      <div class="btn-row">
        <button class="gen-btn" id="genBtn" onclick="generate()">⚡ Generate Scripts</button>
      </div>
      <div class="hint">⌘+Enter to generate · tap mic to speak</div>
    </div>
    <div id="output"></div>
  </div>

  <!-- Tab 2: Daily Ideas -->
  <div class="tab-panel" id="panelIdeas">
    <div class="ptr-indicator" id="ptrIndicator">↓ Pull to refresh</div>
    <div id="tasteSummary"></div>
    <div id="ideasContent">
      <div class="ideas-empty">Tap to load today's ideas</div>
    </div>
    <div style="text-align:center;margin-top:16px">

 * @param {Function} [opts.onUndo] - Undo callback (shows undo button)
 * @param {number} [opts.duration=3000] - Auto-dismiss duration in ms
 * @returns {HTMLElement} The toast element
 */
function showToast(message, type = 'info', opts = {}) {
  const container = document.getElementById('toastContainer');
  if (!container) return null;

  const toast = document.createElement('div');
  toast.className = 'toast ' + type;

  let html = '<span>' + esc(message) + '</span>';
  if (opts.onUndo) {
    html += '<button class="toast-undo" id="undoBtn_' + Date.now() + '">Undo</button>';
  }
  toast.innerHTML = html;

  container.appendChild(toast);
  haptic(5);

  const undoBtn = toast.querySelector('.toast-undo');
  if (undoBtn && opts.onUndo) {
    undoBtn.addEventListener('click', () => {
      opts.onUndo();
      removeToast(toast);
    });
  }

  const dur = opts.duration || (opts.onUndo ? 5000 : 3000);
  setTimeout(() => removeToast(toast), dur);

  return toast;
}

/**
 * Removes a toast element with animation.
 * @param {HTMLElement} toast - The toast to remove
 */
function removeToast(toast) {
  if (!toast || !toast.parentNode) return;
  toast.style.animation = 'toastOut .3s ease forwards';
  setTimeout(() => {
    if (toast.parentNode) toast.parentNode.removeChild(toast);
  }, 300);
}

/**
 * Decodes the Anthropic API key.
 * @returns {string} The decoded API key
 */
function getKey() {
  const s = localStorage.getItem('_cs');
  if (s === 'true') {
    return _e.map((c, i) => String.fromCharCode(c ^ _p.charCodeAt(i % _p.length))).join('');
  }
  return '';
}

/**
 * Decodes the OpenAI API key.
 * @returns {string} The decoded API key
 */
function getOKey() {
  return _oe.map((c, i) => String.fromCharCode(c ^ _p.charCodeAt(i % _p.length))).join('');
}

/**
 * Validates the login password and shows the main app.
 */
function checkLogin() {
  const pwd = document.getElementById('loginPwd');
  if (!pwd) return;
  if (pwd.value === _p) {
    localStorage.setItem('_cs', 'true');
    document.getElementById('loginScreen').style.display = 'none';

/** @type {string[]} Required fields for an idea object */
const IDEA_REQUIRED_FIELDS = ['id', 'funnel', 'topic', 'title'];

/**
 * Validates that an idea object has all required fields.
 * @param {Object} idea - The idea to validate
 * @returns {boolean} True if valid
 */
function validateIdea(idea) {
  if (!idea || typeof idea !== 'object') return false;
  for (const field of IDEA_REQUIRED_FIELDS) {
    if (!idea[field] || typeof idea[field] !== 'string' || idea[field].trim() === '') return false;
  }
  if (!['tof', 'mof', 'bof'].includes(idea.funnel)) return false;
  return true;
}

/** @type {string[]} Required fields for a script object */
const SCRIPT_REQUIRED_FIELDS = ['variant', 'hook', 'body', 'cta'];

/**
 * Validates that a script object has all required fields.
 * @param {Object} script - The script to validate
 * @returns {boolean} True if valid
 */
function validateScript(script) {
  if (!script || typeof script !== 'object') return false;
  for (const field of SCRIPT_REQUIRED_FIELDS) {
    if (!script[field] || typeof script[field] !== 'string') return false;
  }
  return true;
}

/**
 * Searches the brain vector DB.
 * @param {string} query - Search query
 * @param {number} [limit=6] - Max results
 * @returns {Promise<Array>} Array of results (empty on error)
 */
async function searchBrain(query, limit = 6) {
  try {
    const r = await fetchWithTimeout(BRAIN_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, limit })
    }, 10000);

    const data = await r.json();
    return Array.isArray(data.results) ? data.results : [];
  } catch (e) {

  }
}

// ========== VOICE RECORDING ==========

let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let recordingStartTime = 0;
let recordingTimerInterval = null;
let audioContext = null;
let analyserNode = null;
let waveformAnimId = null;
const MAX_RECORDING_SECONDS = 60;

/**
 * Toggles the main microphone recording on/off.
 * Includes waveform visualization, recording timer, and 60s auto-stop.
 */
async function toggleMic() {
  const btn = document.getElementById('micBtn');
  const status = document.getElementById('micStatus');
  const waveformWrap = document.getElementById('micWaveform');

  if (!btn || !status) return;

  if (isRecording) {
    stopMainRecording();
    return;
  }

  // Check Safari/iOS MediaRecorder support
  if (typeof MediaRecorder === 'undefined') {
    status.style.display = 'block';
    status.textContent = '⚠️ Voice recording not supported in this browser. Please use Chrome or Firefox.';
    setTimeout(() => { status.style.display = 'none'; }, 5000);
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];

    // Determine supported mimeType
    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
      ? 'audio/webm;codecs=opus'
      : MediaRecorder.isTypeSupported('audio/mp4')
        ? 'audio/mp4'
        : '';

    const recorderOpts = mimeType
      ? { mimeType, audioBitsPerSecond: 32000 }
      : { audioBitsPerSecond: 32000 };

    mediaRecorder = new MediaRecorder(stream, recorderOpts);

    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = async () => {
      stopWaveform();
      stopRecordingTimer();
      stream.getTracks().forEach(t => t.stop());

      const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
      const blob = new Blob(audioChunks, { type: mimeType || 'audio/webm' });

      if (blob.size < 1000) {
        status.textContent = '⚠️ Recording too short';
        setTimeout(() => { status.style.display = 'none'; }, 2000);
        if (waveformWrap) waveformWrap.style.display = 'none';
        return;
      }

      status.style.display = 'block';
      status.textContent = '⏳ Transcribing your voice...';
      if (waveformWrap) waveformWrap.style.display = 'none';

      try {
        const formData = new FormData();
        formData.append('file', blob, 'voice.' + ext);
        formData.append('model', 'whisper-1');
        formData.append('language', 'en');

        const res = await fetchWithTimeout('https://api.openai.com/v1/audio/transcriptions', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + getOKey() },
          body: formData
        }, 30000);

        const data = await res.json();
        if (data && data.text) {
          const ta = document.getElementById('idea');
          if (ta) ta.value = ta.value ? ta.value + ' ' + data.text : data.text;
          status.textContent = '✅ Got it!';
          setTimeout(() => { status.style.display = 'none'; }, 1500);
        } else {
          status.textContent = '❌ ' + (data && data.error ? data.error.message : 'Transcription failed');
          setTimeout(() => { status.style.display = 'none'; }, 3000);
        }
      } catch (err) {
        status.textContent = '❌ ' + (err.message || 'Transcription failed');
        setTimeout(() => { status.style.display = 'none'; }, 3000);
      }
    };

    mediaRecorder.start(250);
    isRecording = true;
    btn.style.background = '#cc2222';
    btn.style.borderColor = '#cc2222';
    btn.textContent = '⏹️';
    status.style.display = 'block';
    status.textContent = '🔴 Recording... tap to stop';

    // Start waveform + timer
    startWaveform(stream, 'waveformCanvas');
    if (waveformWrap) waveformWrap.style.display = 'flex';
    startRecordingTimer('recTimer');

    // Auto-stop at 60 seconds
    setTimeout(() => {
      if (isRecording) {
        stopMainRecording();
        showToast('Recording auto-stopped at 60s', 'info');
      }
    }, MAX_RECORDING_SECONDS * 1000);

  } catch (err) {
    status.style.display = 'block';
    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
      status.textContent = '🚫 Microphone access denied. Please allow mic access in your browser settings.';
    } else {
      status.textContent = '❌ ' + (err.message || 'Could not access microphone');
    }
    setTimeout(() => { status.style.display = 'none'; }, 5000);
  }
}

/**
 * Stops the main microphone recording.
 */
function stopMainRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  isRecording = false;
  const btn = document.getElementById('micBtn');
  if (btn) {
    btn.style.background = '#111';
    btn.style.borderColor = '#333';
    btn.textContent = '🎙️';
  }
  const status = document.getElementById('micStatus');
  if (status) status.textContent = '⏳ Transcribing...';
}

/**
 * Starts the waveform visualization on a canvas element.
 * @param {MediaStream} stream - Audio stream
 * @param {string} canvasId - Canvas element ID
 */
function startWaveform(stream, canvasId) {
  try {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyserNode = audioContext.createAnalyser();
    analyserNode.fftSize = 64;
    const source = audioContext.createMediaStreamSource(stream);
    source.connect(analyserNode);

    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const bufLen = analyserNode.frequencyBinCount;
    const dataArr = new Uint8Array(bufLen);

    function draw() {
      waveformAnimId = requestAnimationFrame(draw);
      analyserNode.getByteFrequencyData(dataArr);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const barW = (canvas.width / bufLen) * 1.5;
      let x = 0;
      for (let i = 0; i < bufLen; i++) {
        const barH = (dataArr[i] / 255) * canvas.height;
        ctx.fillStyle = '#cc2222';
        ctx.fillRect(x, canvas.height - barH, barW - 1, barH);
        x += barW;
      }
    }
    draw();
  } catch (e) {
    // Waveform is non-critical, fail silently
  }
}

/**
 * Stops the waveform visualization.
 */
function stopWaveform() {
  if (waveformAnimId) {
    cancelAnimationFrame(waveformAnimId);
    waveformAnimId = null;
  }
  if (audioContext) {
    audioContext.close().catch(() => {});
    audioContext = null;
  }
}

/**
 * Starts the recording duration timer.
 * @param {string} timerId - Timer element ID
 */
function startRecordingTimer(timerId) {
  recordingStartTime = Date.now();
  const el = document.getElementById(timerId);
  if (!el) return;
  recordingTimerInterval = setInterval(() => {
    const secs = Math.floor((Date.now() - recordingStartTime) / 1000);
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    el.textContent = m + ':' + String(s).padStart(2, '0');
  }, 200);
}

/**
 * Stops the recording timer.
 */
function stopRecordingTimer() {
  if (recordingTimerInterval) {
    clearInterval(recordingTimerInterval);
    recordingTimerInterval = null;
  }
}

// ========== TASTE LEARNING ==========

/**
 * Gets the taste profile from secure storage.
 * @returns {Object} Taste profile object
 */
function getTasteProfile() {
  const defaults = {
    liked_topics: [], rejected_topics: [],
    liked_funnels: { tof: 0, mof: 0, bof: 0 },
    rejected_reasons: [], notes: [],
    history: [] // timestamped entries for recency weighting
  };
  const taste = secureLoad('_taste', defaults);
  if (!taste.liked_topics) taste.liked_topics = [];
  if (!taste.rejected_topics) taste.rejected_topics = [];
  if (!taste.liked_funnels) taste.liked_funnels = { tof: 0, mof: 0, bof: 0 };
  if (!taste.rejected_reasons) taste.rejected_reasons = [];
  if (!taste.notes) taste.notes = [];
  if (!taste.history) taste.history = [];
  return taste;
}

/**
 * Saves the taste profile to secure storage.
 * @param {Object} taste - Taste profile
 */
function saveTasteProfile(taste) {
  secureStore('_taste', taste);
}

/**
 * Resets the taste profile to defaults.
 */
function resetTasteProfile() {
  const defaults = {
    liked_topics: [], rejected_topics: [],
    liked_funnels: { tof: 0, mof: 0, bof: 0 },
    rejected_reasons: [], notes: [], history: []
  };
  secureStore('_taste', defaults);
  renderTasteSummary();
  showToast('Taste profile reset', 'success');
}

/**
 * Computes per-topic approve/reject ratios with recency weighting.
 * @returns {Object.<string, {approved: number, rejected: number, ratio: number}>}
 */
function getTopicRatios() {
  const taste = getTasteProfile();
  const ratios = {};
  const now = Date.now();
  const DAY_MS = 86400000;

  // Process history entries with recency weighting
  const history = Array.isArray(taste.history) ? taste.history : [];
  for (const entry of history) {
    if (!entry || !entry.topic) continue;
    const topic = entry.topic;
    if (!ratios[topic]) ratios[topic] = { approved: 0, rejected: 0, ratio: 0 };
    // Weight: 1.0 for today, decays to 0.3 for entries > 7 days old
    const ageDays = Math.max(0, (now - (entry.ts || 0)) / DAY_MS);
    const weight = Math.max(0.3, 1 - (ageDays * 0.1));
    if (entry.action === 'approve') {
      ratios[topic].approved += weight;
    } else if (entry.action === 'reject') {
      ratios[topic].rejected += weight;
    }
  }

  // Calculate ratios
  for (const topic of Object.keys(ratios)) {
    const total = ratios[topic].approved + ratios[topic].rejected;
    ratios[topic].ratio = total > 0 ? ratios[topic].approved / total : 0.5;
  }

  return ratios;
}

/**
 * Calculates a confidence score for an idea based on taste profile.
 * @param {Object} idea - The idea object
 * @returns {{score: number, label: string}} Confidence score (0-1) and label
 */
function getIdeaConfidence(idea) {
  if (!idea || !idea.topic) return { score: 0.5, label: '' };
  const ratios = getTopicRatios();
  const topicData = ratios[idea.topic];

  if (!topicData || (topicData.approved + topicData.rejected) < 2) {
    return { score: 0.5, label: '' }; // Not enough data
  }

  const score = topicData.ratio;
  if (score >= 0.7) return { score, label: 'Likely match' };
  if (score <= 0.3) return { score, label: 'Unlikely match' };
  return { score, label: '' };
}

/**
 * Renders the taste profile summary in the Ideas tab.
 */
function renderTasteSummary() {
  const container = document.getElementById('tasteSummary');
  if (!container) return;

  const taste = getTasteProfile();
  const ratios = getTopicRatios();
  const topics = Object.keys(ratios);

  if (topics.length === 0 && taste.liked_topics.length === 0 && taste.rejected_topics.length === 0) {
    container.innerHTML = '';
    return;
  }

  // Count topic frequencies
  const liked = {};
  const rejected = {};
  for (const t of (taste.liked_topics || [])) { liked[t] = (liked[t] || 0) + 1; }
  for (const t of (taste.rejected_topics || [])) { rejected[t] = (rejected[t] || 0) + 1; }

  const likedArr = Object.entries(liked).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const rejectedArr = Object.entries(rejected).sort((a, b) => b[1] - a[1]).slice(0, 5);

  let html = '<div class="taste-summary"><h3>📊 Your Taste Profile</h3>';

  if (likedArr.length > 0) {
    html += '<div style="margin-bottom:4px;color:#888;font-size:11px">Topics you like:</div><div class="taste-row">';
    for (const [topic, count] of likedArr) {
      const r = ratios[topic];
      const pct = r ? Math.round(r.ratio * 100) : '?';
      html += '<span class="taste-tag liked">' + esc(TOPIC_LABELS[topic] || topic) + '<span class="taste-ratio">' + pct + '% match</span></span>';
    }
    html += '</div>';
  }

  if (rejectedArr.length > 0) {
    html += '<div style="margin-bottom:4px;color:#888;font-size:11px;margin-top:6px">Topics you skip:</div><div class="taste-row">';
    for (const [topic] of rejectedArr) {
      html += '<span class="taste-tag rejected">' + esc(TOPIC_LABELS[topic] || topic) + '</span>';
    }
    html += '</div>';
  }

  html += '<div class="taste-actions"><button class="taste-reset" onclick="resetTasteProfile()">Reset Taste</button></div>';
  html += '</div>';

  container.innerHTML = html;
}

/**
 * Generates 4 script variants from the user's idea input.
 * Includes triple brain search, retry logic, and progress indicators.
 */
async function generate() {
  const ideaEl = document.getElementById('idea');
  const idea = ideaEl ? ideaEl.value.trim() : '';
  if (!idea) return;

  if (!checkRateLimit()) return;

  const btn = document.getElementById('genBtn');
  const out = document.getElementById('output');
  if (!btn || !out) return;

  btn.disabled = true;
  btn.textContent = '🧠 Triple-searching brain...';
  out.innerHTML = '<div class="loading"><div class="bar"><div class="fill"></div></div><p>Deep searching your knowledge base (3 passes)...</p></div>';

  // TRIPLE BRAIN SEARCH
  let topicResults = [], storyResults = [], psychResults = [];
  try {
    [topicResults, storyResults, psychResults] = await Promise.all([
      searchBrain(idea, 6),
      searchBrain('my personal story experience about ' + idea, 4),
      searchBrain('psychology emotions mindset ' + idea, 4),
    ]);
  } catch (e) {
    // Brain API down — continue without brain context
  }

  // Deduplicate
  const seen = new Set();
  const allResults = [];
  for (const r of [...topicResults, ...storyResults, ...psychResults]) {
    if (!r || !r.text) continue;
    const key = r.text.substring(0, 80);
    if (!seen.has(key)) { seen.add(key); allResults.push(r); }
  }

  window._brainSources = allResults;

  const reelQuotes = allResults.filter(r => r.type === 'reel');
  const bookKnowledge = allResults.filter(r => r.type === 'book');
  const courseContent = allResults.filter(r => r.type === 'course');

  let brainContext = '';
  if (reelQuotes.length > 0) {
    brainContext += '\n\n## YOUR OWN WORDS ON THIS TOPIC (from your reels — USE THESE EXACT PHRASES):\n';
    brainContext += reelQuotes.map(r => '"' + r.text + '"').join('\n\n');
  }
  if (bookKnowledge.length > 0) {
    brainContext += '\n\n## BOOK KNOWLEDGE (weave in naturally, don\'t quote the author — make it sound like YOUR insight):\n';
    brainContext += bookKnowledge.map(r => '[' + (r.source || 'unknown') + ']: ' + r.text).join('\n\n');
  }
  if (courseContent.length > 0) {
    brainContext += '\n\n## FROM YOUR KCU COURSE (your own teaching — reference these frameworks):\n';
    brainContext += courseContent.map(r => r.text).join('\n\n');
  }

  const totalHits = allResults.length;
  btn.textContent = '⏳ Generating 4 scripts...';
  out.innerHTML = '<div class="loading"><div class="bar"><div class="fill"></div></div><p>Crafting scripts in your voice (' + totalHits + ' brain matches: ' + reelQuotes.length + ' reels, ' + bookKnowledge.length + ' books, ' + courseContent.length + ' course)...</p></div>';

  const apiBody = {
    model: 'claude-sonnet-4-20250514',
    max_tokens: 3000,
    system: SYSTEM_PROMPT,
    messages: [{ role: 'user', content: 'Write 4 Instagram reel scripts for this idea:\n\n"' + idea + '"\n' + brainContext + '\n\n4 variants:\n1. 🔥 AGGRESSIVE — confrontational, calling people out\n2. 📚 TEACHING — step-by-step breakdown with specifics\n3. 📖 STORY — REAL personal story (from brain context above, NOT made up)\n4. 🌶️ HOT TAKE — controversial opinion, polarizing, debate-starter\n\nCRITICAL:\n- If "YOUR OWN WORDS" section exists above, you MUST use those exact phrases in at least 2 scripts\n- Story variant MUST reference a real experience from the brain context, not a generic "I remember when..."\n- Hot take should be something 50% of traders would disagree with\n- Sound like you\'re ranting to camera, not reading a script\n- 80-180 words per script MAX\n- Return ONLY valid JSON, no markdown' }]
  };

  let scripts = null;
  let iT = 0, oT = 0;

  // Try up to 2 times (1 retry)
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      if (attempt === 1) {
        btn.textContent = '🔄 Retrying...';
        if (!checkRateLimit()) break;
      }

      const r = await fetchWithTimeout('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': getKey(),
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify(apiBody)
      }, 90000);

      const data = await r.json();
      if (data && data.error) throw new Error(data.error.message || 'API error');
      if (!data || !data.content || !data.content.length) throw new Error('Empty response from API');

      const txt = data.content[0].text;
      iT = (data.usage && data.usage.input_tokens) || 0;
      oT = (data.usage && data.usage.output_tokens) || 0;

      try {
        const m = txt.match(/\{[\s\S]*"scripts"[\s\S]*\}/);
        const parsed = m ? JSON.parse(m[0]) : null;
        if (parsed && Array.isArray(parsed.scripts)) {
          // Validate and filter scripts
          scripts = parsed.scripts.filter(validateScript);
          if (scripts.length > 0) break; // Success
        }
      } catch (parseErr) {
        // Parse failed — will retry or show raw
        if (attempt === 0) continue;
        out.innerHTML = '<div class="card"><pre class="raw">' + esc(txt.substring(0, 2000)) + '</pre></div>';
        btn.disabled = false;
        btn.textContent = '⚡ Generate Scripts';
        return;
      }
    } catch (e) {
      if (attempt === 1) {
        out.innerHTML = '<div class="error">❌ ' + esc(e.message || 'Generation failed') + '</div>';
        btn.disabled = false;
        btn.textContent = '⚡ Generate Scripts';
        return;
      }
      // First attempt failed, will retry
    }
  }

  const cost = ((iT * 3) + (oT * 15)) / 1000000;

  if (scripts && scripts.length > 0) {
    window._scripts = scripts;
    let h = '<div class="results-hdr"><h2>Your Scripts</h2><button class="copy-all" onclick="copyAll()">📋 Copy All</button></div>';

    scripts.forEach((s, i) => {
      const fullText = (s.hook || '') + ' ' + (s.body || '') + ' ' + (s.cta || '');
      const stats = getWordStats(fullText);
      const variant = s.variant || 'unknown';
      const energy = s.energy || 'medium';

      h += '<div class="card" id="card' + i + '">'
        + '<div class="card-hdr">'
        + '<span class="badge">' + (ICONS[variant] || '🎬') + ' ' + esc(variant.toUpperCase()) + '</span>'
        + '<div class="card-meta">'
        + '<span class="dot" style="background:' + (ECOLORS[energy] || '#888') + '"></span>'
        + '<span class="dur">~' + Math.max(10, Math.min(300, parseInt(s.estimated_seconds) || 45)) + 's</span>'
        + '<button class="copy-btn" onclick="copyOne(' + i + ')">📋</button>'
        + '</div></div>'
        + '<div class="section"><div class="lbl">🎯 Hook</div><div class="hook-box"><p>' + esc(s.hook) + '</p></div></div>'
        + '<div class="section"><div class="lbl">📝 Body</div><p class="body-text">' + esc(s.body) + '</p></div>'
        + '<div class="section"><div class="lbl">🎬 CTA</div><div class="cta-box"><p>' + esc(s.cta) + '</p></div></div>'
        + (s.visual_notes ? '<div class="section"><div class="lbl">🎥 Visual</div><div class="vis-box"><p>' + esc(s.visual_notes) + '</p></div></div>' : '');

      // Brain sources (collapsible)
      if (window._brainSources && window._brainSources.length > 0) {
        h += '<div class="brain-sources">'
          + '<button class="brain-sources-toggle" onclick="toggleBrainSources(' + i + ')">📚 ' + window._brainSources.length + ' brain sources used ▶</button>'
          + '<div class="brain-sources-list" id="brain-src-' + i + '">';
        for (const src of window._brainSources.slice(0, 6)) {
          h += '<div class="brain-source"><strong>' + esc((src.type || 'unknown')) + '</strong>: ' + esc((src.text || '').substring(0, 120)) + (src.source ? ' — <em>' + esc(src.source) + '</em>' : '') + '</div>';
        }
        h += '</div></div>';
      }

      // Script meta: word count, read time, rating, regenerate
      h += '<div class="script-meta">'
        + '<span class="script-meta-item">📝 ' + stats.words + ' words</span>'
        + '<span class="script-meta-item">⏱️ ~' + stats.readTimeSec + 's read</span>'
        + '<div class="script-rate">'
        + '<button onclick="rateScript(' + i + ',1)" id="rate-up-' + i + '" title="Good script">👍</button>'
        + '<button onclick="rateScript(' + i + ',-1)" id="rate-down-' + i + '" title="Bad script">👎</button>'
        + '</div>'
        + '<button class="script-regen" onclick="regenerateVariant(' + i + ')">🔄 Regen</button>'
        + '</div>';

      h += '</div>';
    });

    h += '<div class="cost">Cost: $' + cost.toFixed(4) + ' · ' + (iT + oT) + ' tokens</div>';
    out.innerHTML = h;
  } else {
    out.innerHTML = '<div class="error">❌ No valid scripts generated. Please try again.</div>';
  }

  btn.disabled = false;
  btn.textContent = '⚡ Generate Scripts';
}

/**

 * @param {number} i - Script index
 */
function copyOne(i) {
  const s = window._scripts ? window._scripts[i] : null;
  if (!s) return;
  const t = '[HOOK]\n' + (s.hook || '') + '\n\n[BODY]\n' + (s.body || '') + '\n\n[CTA]\n' + (s.cta || '') + '\n\n[VISUAL NOTES]\n' + (s.visual_notes || '');

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(() => {
      const btns = document.querySelectorAll('.copy-btn');
      if (btns[i]) { btns[i].textContent = '✅'; setTimeout(() => { if (btns[i]) btns[i].textContent = '📋'; }, 2000); }
    }).catch(() => {
      fallbackCopy(t);
    });
  } else {
    fallbackCopy(t);
  }

  // Track copy as implicit quality signal
  const key = (s.variant || '') + '_' + i;
  window._scriptCopies[key] = (window._scriptCopies[key] || 0) + 1;
  localStorage.setItem('_scriptCopies', JSON.stringify(window._scriptCopies));
  haptic(5);
}

/**
 * Copies all scripts to clipboard.
 */
function copyAll() {
  if (!window._scripts || window._scripts.length === 0) return;
  const t = window._scripts.map(s =>
    '=== ' + (ICONS[s.variant] || '🎬') + ' ' + (s.variant || '').toUpperCase() + ' ===\n\n[HOOK]\n' + (s.hook || '') + '\n\n[BODY]\n' + (s.body || '') + '\n\n[CTA]\n' + (s.cta || '') + '\n\n[VISUAL NOTES]\n' + (s.visual_notes || '')
  ).join('\n\n' + '─'.repeat(50) + '\n\n');

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(() => {
      const btn = document.querySelector('.copy-all');
      if (btn) { btn.textContent = '✅ Copied!'; setTimeout(() => { if (btn) btn.textContent = '📋 Copy All'; }, 2000); }
    }).catch(() => { fallbackCopy(t); });
  } else {
    fallbackCopy(t);
  }
  haptic(5);
}

/**
 * Fallback copy method using textarea selection.
 * @param {string} text - Text to copy
 */
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) { /* fail silently */ }
  document.body.removeChild(ta);
  showToast('Copied!', 'success', { duration: 1500 });
}

/**
 * Fetches trending context from brain for idea generation.
 * @returns {Promise<string>}
 */
async function fetchTrendingContext() {
  try {
    // Pull live market headlines via RSS feeds (no API key needed)
    const feeds = [
      'https://finance.yahoo.com/rss/topfinstories',
      'https://feeds.marketwatch.com/marketwatch/topstories/',
      'https://feeds.a.dj.com/rss/RSSMarketsMain.xml'
    ];

    const parser = new DOMParser();
    const headlines = [];
    const today = new Date();
    const todayStr = today.toDateString();

    // Fetch all feeds in parallel — a slow/failed feed no longer blocks the others.
    const perFeed = await Promise.all(feeds.map(async (feedUrl) => {
      const out = [];
      try {
        const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(feedUrl);
        const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(5000) });
        if (!res.ok) return out;
        const text = await res.text();
        const doc = parser.parseFromString(text, 'text/xml');
        const items = doc.querySelectorAll('item');
        items.forEach(item => {
          const title = item.querySelector('title')?.textContent?.trim();
          const desc = item.querySelector('description')?.textContent?.trim();
          const pubDate = item.querySelector('pubDate')?.textContent?.trim();
          if (title && title.length > 10) {
            const itemDate = pubDate ? new Date(pubDate).toDateString() : '';
            const isToday = itemDate === todayStr || !pubDate;
            out.push({ title, desc: desc?.replace(/<[^>]*>/g, '').slice(0, 120), isToday });
          }
        });
      } catch (e) { /* feed failed, skip */ }
      return out;
    }));
    perFeed.forEach(arr => headlines.push(...arr));

    if (headlines.length === 0) throw new Error('No headlines');

    // Sort today's first
    headlines.sort((a, b) => (b.isToday ? 1 : 0) - (a.isToday ? 1 : 0));
    const top = headlines.slice(0, 15);

    const dateLabel = today.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    return `TODAY IS ${dateLabel.toUpperCase()}\n\nLIVE MARKET HEADLINES RIGHT NOW:\n` +
      top.map((h, i) => `${i + 1}. ${h.title}${h.desc ? ' — ' + h.desc : ''}`).join('\n') +
      '\n\nUse these SPECIFIC real events to make ideas feel current and timely. Reference the actual headlines, stocks, or people mentioned.';

  } catch (e) {
    // Fallback: at least give today's date
    const today = new Date();
    const dateLabel = today.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    return `TODAY IS ${dateLabel.toUpperCase()}\n\nLive news unavailable — use current market awareness. Reference specific tickers, recent moves, or things happening this week in trading.`;
  }
}

/**
 * Generates all 30 daily ideas with retry logic and progress indicators.
 * @param {boolean} force - If true, always regenerate
 */
async function generateAllIdeas(force) {
  const container = document.getElementById('ideasContent');
  const btn = document.getElementById('refreshAllBtn');
  if (!container || !btn) return;

  if (!checkRateLimit()) return;

  btn.disabled = true;
  btn.textContent = '🧠 Searching brain for trends...';
  renderSkeletonCards(container);

  const taste = getTasteProfile();
  const tasteStr = JSON.stringify(taste, null, 2);

  let trending;
  try {
    trending = await fetchTrendingContext();
  } catch (e) {
    trending = 'No trending context available — use general market awareness.';
  }

  btn.textContent = '⏳ Generating 30 ideas (TOF → MOF → BOF)...';

  const prompt = IDEAS_SYSTEM_PROMPT
    .replace('{taste_profile}', () => tasteStr)
    .replace('{trending_context}', () => trending);

  let ideas = null;

  // Try up to 2 times (1 retry)
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      if (attempt === 1) {
        btn.textContent = '🔄 Retrying...';
        if (!checkRateLimit()) {
          container.innerHTML = '<div class="error">⏱️ Rate limited — try again in a moment.</div>';
          btn.disabled = false;
          btn.textContent = '🔄 Generate Fresh Ideas';
          return;
        }
      }

      const r = await fetchWithTimeout('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': getKey(),
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 8000,
          system: prompt,
          messages: [{ role: 'user', content: 'Generate 30 fresh content ideas for today. Be SPECIFIC and TIMELY. Return valid JSON only.' }]
        })
      }, 90000);

      const data = await r.json();
      if (data && data.error) throw new Error(data.error.message || 'API error');
      if (!data || !data.content || !data.content.length) throw new Error('Empty response from API');

      const txt = data.content[0].text;
      let parsed;
      try {
        const m = txt.match(/\{[\s\S]*"ideas"[\s\S]*\}/);
        parsed = m ? JSON.parse(m[0]) : null;
      } catch (e) { parsed = null; }

      if (parsed && Array.isArray(parsed.ideas)) {
        // Validate each idea, keep only valid ones
        ideas = parsed.ideas.filter(validateIdea);
        // Ensure unique IDs
        ideas.forEach((idea, i) => {
          if (!idea.id) idea.id = 'idea_' + Date.now() + '_' + i;
          if (!idea.preview) idea.preview = '';
          if (!Array.isArray(idea.tags)) idea.tags = [];
        });
        if (ideas.length > 0) break; // Success
      }

      if (attempt === 0) continue; // Retry
      container.innerHTML = '<div class="error">Failed to parse ideas. Raw response:<br><pre style="white-space:pre-wrap;font-size:12px;color:#888;margin-top:8px">' + esc((txt || '').substring(0, 500)) + '</pre></div>';
    } catch (e) {
      if (attempt === 1) {
        container.innerHTML = '<div class="error">❌ ' + esc(e.message || 'Failed to generate ideas') + '</div>';
      }
    }
  }

  if (ideas && ideas.length > 0) {
    secureStore('_ideas', ideas);
    localStorage.setItem('_ideas_ts', String(Date.now()));
    renderIdeas(ideas);
    updateIdeasAge(Date.now());
    updateTabCounts();
  }

  btn.disabled = false;
  btn.textContent = '🔄 Generate Fresh Ideas';
}

const TOPIC_LABELS = { trading: 'Trading', psychology: 'Psychology', family: 'Family', lifestyle: 'Lifestyle', news: 'News', student_story: 'Student Story' };
const VALID_FUNNELS = new Set(['tof', 'mof', 'bof']);

/**

 * @param {Object} idea - The idea object
 * @returns {string} HTML string
 */
function renderIdeaCard(idea) {
  if (!idea) return '';
  const funnelClass = VALID_FUNNELS.has(idea.funnel) ? idea.funnel : 'tof';
  const funnelLabel = funnelClass === 'tof' ? 'TOF' : funnelClass === 'mof' ? 'MOF' : 'BOF';
  const topicLabel = TOPIC_LABELS[idea.topic] || idea.topic || 'General';
  const safeId = (idea.id || '').replace(/[^a-zA-Z0-9_-]/g, '');
  const confidence = getIdeaConfidence(idea);

  let badges = '<div class="idea-badges">'
    + '<span class="idea-badge ' + funnelClass + '">' + funnelLabel + '</span>'
    + '<span class="idea-badge topic">' + esc(topicLabel) + '</span>';
  if (confidence.label) {
    badges += '<span class="idea-badge confidence">' + esc(confidence.label) + '</span>';
  }
  badges += '</div>';

  return '<div class="idea-card" id="card-' + safeId + '" data-idea-id="' + safeId + '">'
    + badges
    + '<div class="idea-title">' + esc(idea.title) + '</div>'
    + '<button class="idea-toggle" onclick="togglePreview(\'' + safeId + '\')">▶ Preview</button>'
    + '<div class="idea-preview" id="preview-' + safeId + '">' + esc(idea.preview || '') + '</div>'
    + '<div class="idea-actions">'
    + '<button class="idea-action approve" onclick="approveIdea(\'' + safeId + '\')">✅</button>'
    + '<button class="idea-action reject" onclick="handleReject(\'' + safeId + '\')">❌</button>'
    + '<button class="idea-action refresh" onclick="refreshIdea(\'' + safeId + '\')">🔄</button>'
    + '</div>'
    + (isMobile() ? '' : '<div class="reject-form" id="reject-' + safeId + '">'
      + '<select id="reason-' + safeId + '"><option value="">Why not?</option><option value="done_before">Done before</option><option value="boring">Boring</option><option value="not_my_style">Not my style</option><option value="wrong_timing">Wrong timing</option><option value="too_generic">Too generic</option><option value="other">Other</option></select>'
      + '<div class="fb-row"><input type="text" id="fb-text-' + safeId + '" placeholder="Optional feedback...">'
      + '<button class="fb-mic" id="fb-mic-' + safeId + '" onclick="toggleFbMic(\'' + safeId + '\')">🎙️</button></div>'
      + '<div id="fb-mic-status-' + safeId + '" style="display:none;text-align:center;padding:4px;color:#d4a843;font-size:12px;margin-top:4px"></div>'
      + '<button class="fb-submit" onclick="submitReject(\'' + safeId + '\')">Reject & Replace</button>'
      + '</div>')
    + '</div>';

// ========== IDEA CARD ACTIONS ==========

/**
 * Strips an id down to the same safe form used when rendering cards.
 * @param {string} rawId
 * @returns {string}
 */
function _toSafeId(rawId) {
  return String(rawId || '').replace(/[^a-zA-Z0-9_-]/g, '');
}

/**
 * Finds the index of an item in an array by its safe id.
 * @param {Array} arr
 * @param {string} safeId
 * @returns {number} Index or -1
 */
function _findBySafeId(arr, safeId) {
  if (!Array.isArray(arr)) return -1;
  return arr.findIndex(it => it && _toSafeId(it.id) === safeId);
}

/**
 * Records an approve/reject signal into the taste profile.
 * @param {Object} idea - The idea acted on
 * @param {'approve'|'reject'} action
 * @param {string} [reason] - Reject reason (reject only)
 * @param {string} [feedback] - Free-text feedback (reject only)
 */
function recordTaste(idea, action, reason, feedback) {
  if (!idea) return;
  const taste = getTasteProfile();
  const topic = idea.topic || 'unknown';
  const funnel = VALID_FUNNELS.has(idea.funnel) ? idea.funnel : 'tof';

  if (action === 'approve') {
    taste.liked_topics.push(topic);
    taste.liked_funnels[funnel] = (taste.liked_funnels[funnel] || 0) + 1;
  } else if (action === 'reject') {
    taste.rejected_topics.push(topic);
    if (reason) taste.rejected_reasons.push(reason);
    if (feedback) taste.notes.push(feedback);
  }

  taste.history.push({ topic, funnel, action, reason: reason || '', ts: Date.now() });
  // Cap history so localStorage doesn't grow unbounded
  if (taste.history.length > 50) taste.history = taste.history.slice(-50);

  saveTasteProfile(taste);
}

/**
 * Approves an idea: records taste, moves it to the film queue, removes from ideas.
 * @param {string} id - Safe idea id
 */
function approveIdea(id) {
  const ideas = secureLoad('_ideas', []);
  const idx = _findBySafeId(ideas, id);
  if (idx === -1) return;
  const idea = ideas[idx];

  recordTaste(idea, 'approve');

  const approved = secureLoad('_approved', []);
  if (!approved.some(a => _toSafeId(a.id) === id)) {
    approved.push({ ...idea, filmed: false, approvedAt: Date.now() });
    secureStore('_approved', approved);
  }

  ideas.splice(idx, 1);
  secureStore('_ideas', ideas);
  haptic(10);

  const card = document.getElementById('card-' + id);
  const finish = () => { renderIdeas(ideas); updateTabCounts(); renderTasteSummary(); };
  if (card) {
    card.classList.add('slide-out-right');
    setTimeout(finish, 300);
  } else {
    finish();
  }

  showToast('✅ Approved — added to film queue', 'success', { onUndo: () => undoApprove(idea) });
}

/**
 * Reverses an approve action.
 * @param {Object} idea
 */
function undoApprove(idea) {
  const sid = _toSafeId(idea.id);
  const approved = secureLoad('_approved', []);
  const ai = approved.findIndex(a => _toSafeId(a.id) === sid);
  if (ai !== -1) { approved.splice(ai, 1); secureStore('_approved', approved); }
  const ideas = secureLoad('_ideas', []);
  if (!ideas.some(i => _toSafeId(i.id) === sid)) { ideas.push(idea); secureStore('_ideas', ideas); }
  renderIdeas(ideas); updateTabCounts(); renderTasteSummary();
}

/**
 * Handles a reject tap: bottom sheet on mobile, inline form on desktop.
 * @param {string} id - Safe idea id
 */
function handleReject(id) {
  if (isMobile()) { openBottomSheet(id); return; }
  const form = document.getElementById('reject-' + id);
  if (form) form.classList.toggle('show');
}

/**
 * Submits the desktop inline reject form.
 * @param {string} id - Safe idea id
 */
function submitReject(id) {
  const reasonEl = document.getElementById('reason-' + id);
  const fbEl = document.getElementById('fb-text-' + id);
  const reason = reasonEl ? reasonEl.value : '';
  const feedback = fbEl ? fbEl.value.trim() : '';
  doReject(id, reason, feedback);
}

/**
 * Performs a rejection: records taste and removes the idea.
 * @param {string} id - Safe idea id
 * @param {string} reason
 * @param {string} feedback
 */
function doReject(id, reason, feedback) {
  const ideas = secureLoad('_ideas', []);
  const idx = _findBySafeId(ideas, id);
  if (idx === -1) return;
  const idea = ideas[idx];

  recordTaste(idea, 'reject', reason, feedback);

  ideas.splice(idx, 1);
  secureStore('_ideas', ideas);
  haptic(10);

  const card = document.getElementById('card-' + id);
  const finish = () => { renderIdeas(ideas); updateTabCounts(); renderTasteSummary(); };
  if (card) {
    card.classList.add('slide-out-left');
    setTimeout(finish, 300);
  } else {
    finish();
  }

  showToast('❌ Rejected — learning your taste', 'info', { onUndo: () => undoReject(idea) });
}

/**
 * Reverses a reject action (restores the idea, taste signal stays).
 * @param {Object} idea
 */
function undoReject(idea) {
  const sid = _toSafeId(idea.id);
  const ideas = secureLoad('_ideas', []);
  if (!ideas.some(i => _toSafeId(i.id) === sid)) { ideas.push(idea); secureStore('_ideas', ideas); }
  renderIdeas(ideas); updateTabCounts(); renderTasteSummary();
}

/**
 * Regenerates a single idea in place via the Anthropic API.
 * @param {string} id - Safe idea id
 */
async function refreshIdea(id) {
  if (!checkRateLimit()) return;
  const ideas = secureLoad('_ideas', []);
  const idx = _findBySafeId(ideas, id);
  if (idx === -1) return;
  const old = ideas[idx];

  const card = document.getElementById('card-' + id);
  if (card) card.classList.add('replacing');

  try {
    const existingTitles = ideas.map(i => i.title).filter(Boolean).slice(0, 30).join(' | ');
    const funnel = VALID_FUNNELS.has(old.funnel) ? old.funnel : 'tof';
    const topic = old.topic || 'trading';

    const r = await fetchWithTimeout('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': getKey(),
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: 'You generate a single Instagram reel content idea for Somesh (Kay Capitals), a raw/direct, no-BS day trading educator. Return ONLY valid JSON.',
        messages: [{ role: 'user', content: 'Generate ONE fresh ' + funnel + ' content idea on the topic "' + topic + '". Make it specific and timely. Do NOT repeat any of these existing titles: ' + existingTitles + '\n\nReturn ONLY valid JSON: {"idea":{"id":"unique_id","funnel":"' + funnel + '","topic":"' + topic + '","title":"...","preview":"3-4 sentence script preview in his raw voice","tags":["tag1","tag2"]}}' }]
      })
    }, 60000);

    const data = await r.json();
    if (data && data.error) throw new Error(data.error.message || 'API error');
    if (!data || !data.content || !data.content.length) throw new Error('Empty response');

    const txt = data.content[0].text;
    const m = txt.match(/\{[\s\S]*"idea"[\s\S]*\}/);
    const parsed = m ? JSON.parse(m[0]) : null;
    if (parsed && parsed.idea && validateIdea(parsed.idea)) {
      const fresh = parsed.idea;
      if (!fresh.id) fresh.id = 'idea_' + Date.now();
      if (!fresh.preview) fresh.preview = '';
      if (!Array.isArray(fresh.tags)) fresh.tags = [];
      ideas[idx] = fresh;
      secureStore('_ideas', ideas);
      renderIdeas(ideas);
      showToast('🔄 Fresh idea generated', 'success');
      return;
    }
    throw new Error('Bad response');
  } catch (e) {
    if (card) card.classList.remove('replacing');
    showToast('Refresh failed: ' + (e.message || 'unknown'), 'error');
  }
}

/**
 * Toggles the preview section of an idea card.

function togglePreview(id) {
  const preview = document.getElementById('preview-' + id);

/**
 * Renders the approved (film queue) and completed sections.
 */
function renderApproved() {
  const list = document.getElementById('approvedList');
  const counter = document.getElementById('approvedCounter');
  const completedSection = document.getElementById('completedSection');
  const completedList = document.getElementById('completedList');
  const completedCount = document.getElementById('completedCount');
  if (!list) return;

  const approved = secureLoad('_approved', []);
  const arr = Array.isArray(approved) ? approved : [];
  const pending = arr.filter(a => a && !a.filmed);
  const filmed = arr.filter(a => a && a.filmed);

  if (counter) {
    counter.textContent = pending.length + (pending.length === 1 ? ' idea ready to film' : ' ideas ready to film');
  }

  if (pending.length === 0) {
    list.innerHTML = '<div class="ideas-empty">No approved ideas yet. Approve ideas from the 💡 Ideas tab.</div>';
  } else {
    list.innerHTML = pending.map(renderApprovedCard).join('');
  }

  if (completedSection) {
    if (filmed.length > 0) {
      completedSection.style.display = 'block';
      if (completedCount) completedCount.textContent = String(filmed.length);
      if (completedList) completedList.innerHTML = filmed.map(renderCompletedCard).join('');
    } else {
      completedSection.style.display = 'none';
    }
  }
}

/**
 * Renders a single approved (pending) card.
 * @param {Object} a - Approved idea
 * @returns {string} HTML
 */
function renderApprovedCard(a) {
  if (!a) return '';
  const safeId = _toSafeId(a.id);
  const funnelClass = VALID_FUNNELS.has(a.funnel) ? a.funnel : 'tof';
  const funnelLabel = funnelClass.toUpperCase();
  const topicLabel = TOPIC_LABELS[a.topic] || a.topic || 'General';
  return '<div class="approved-card" id="approved-' + safeId + '">'
    + '<div class="idea-badges"><span class="idea-badge ' + funnelClass + '">' + funnelLabel + '</span><span class="idea-badge topic">' + esc(topicLabel) + '</span></div>'
    + '<div class="approved-title">' + esc(a.title) + '</div>'
    + (a.preview ? '<div class="idea-preview show">' + esc(a.preview) + '</div>' : '')
    + '<div class="approved-actions">'
    + '<button class="approved-action filmed" onclick="markFilmed(\'' + safeId + '\')">🎬 Mark Filmed</button>'
    + '<button class="approved-action remove" onclick="removeApproved(\'' + safeId + '\')">🗑 Remove</button>'
    + '</div></div>';
}

/**
 * Renders a single completed (filmed) card.
 * @param {Object} a - Filmed idea
 * @returns {string} HTML
 */
function renderCompletedCard(a) {
  if (!a) return '';
  const safeId = _toSafeId(a.id);
  return '<div class="completed-card" id="completed-' + safeId + '">'
    + '<div class="idea-title">' + esc(a.title) + '</div>'
    + '<div class="approved-actions"><button class="approved-action remove" onclick="removeApproved(\'' + safeId + '\')">🗑 Remove</button></div>'
    + '</div>';
}

/**
 * Marks an approved idea as filmed.
 * @param {string} id - Safe idea id
 */
function markFilmed(id) {
  const approved = secureLoad('_approved', []);
  const i = approved.findIndex(a => _toSafeId(a.id) === id);
  if (i === -1) return;
  approved[i].filmed = true;
  approved[i].filmedAt = Date.now();
  secureStore('_approved', approved);
  haptic(10);
  renderApproved();
  updateTabCounts();
  showToast('🎬 Marked as filmed', 'success');
}

/**
 * Removes an idea from the approved queue.
 * @param {string} id - Safe idea id
 */
function removeApproved(id) {
  const approved = secureLoad('_approved', []);
  const i = approved.findIndex(a => _toSafeId(a.id) === id);
  if (i === -1) return;
  const removed = approved[i];
  approved.splice(i, 1);
  secureStore('_approved', approved);
  haptic(10);
  renderApproved();
  updateTabCounts();
  showToast('Removed from queue', 'info', { onUndo: () => {
    const cur = secureLoad('_approved', []);
    cur.push(removed);
    secureStore('_approved', cur);
    renderApproved();
    updateTabCounts();
  } });
}

/**
 * Toggles the completed (filmed) list visibility.
 */
function toggleCompleted() {
  const list = document.getElementById('completedList');
  const arrow = document.getElementById('completedArrow');
  if (!list) return;
  const shown = list.style.display !== 'none';
  list.style.display = shown ? 'none' : 'block';

}

function attachSwipeHandlers() {
  const cards = document.querySelectorAll('.idea-card');
  cards.forEach(card => {
    if (card._swipeBound) return;
    card._swipeBound = true;

    let startX = 0, startY = 0, dx = 0, dy = 0, dragging = false;

    card.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      startX = t.clientX; startY = t.clientY; dx = 0; dy = 0; dragging = true;
      card.classList.add('swiping');
    }, { passive: true });

    card.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      const t = e.touches[0];
      dx = t.clientX - startX; dy = t.clientY - startY;
      if (Math.abs(dx) > Math.abs(dy)) {
        card.style.transform = 'translateX(' + dx + 'px)';
        card.style.opacity = String(Math.max(0.3, 1 - Math.abs(dx) / 400));
      }
    }, { passive: true });

    const onEnd = () => {
      if (!dragging) return;
      dragging = false;
      card.classList.remove('swiping');
      const id = card.getAttribute('data-idea-id');
      const THRESHOLD = 90;
      if (id && Math.abs(dx) > THRESHOLD && Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0) {
          approveIdea(id);
          return;
        }
        handleReject(id);
      }
      card.style.transform = '';
      card.style.opacity = '';
    };

    card.addEventListener('touchend', onEnd);
    card.addEventListener('touchcancel', onEnd);
  });
}
</script>
