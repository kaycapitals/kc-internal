<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Content Engine</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding:16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto}
.hdr{text-align:center;padding:24px 0 20px}
.hdr h1{font-size:24px;font-weight:700;color:#d4a843;margin-bottom:6px}
.hdr p{color:#555;font-size:13px}
.input-wrap{margin-bottom:20px}
textarea{width:100%;padding:16px;border-radius:12px;border:1px solid #222;background:#111;color:#fff;font-size:16px;resize:none;outline:none;font-family:inherit;min-height:80px;transition:border-color .2s}
textarea:focus{border-color:#d4a843}
textarea::placeholder{color:#444}
.btn-row{display:flex;gap:8px;margin-top:10px}
.gen-btn{flex:1;padding:14px;border-radius:12px;border:none;background:#d4a843;color:#000;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .2s}
.gen-btn:disabled{opacity:.4;cursor:not-allowed}
.gen-btn:hover:not(:disabled){opacity:.85}
.hint{color:#333;font-size:11px;text-align:center;margin-top:6px}
.loading{text-align:center;padding:40px 20px}
.loading .bar{width:100%;height:3px;background:#1a1a1a;border-radius:2px;overflow:hidden;margin-bottom:16px}
.loading .fill{width:0%;height:100%;background:#d4a843;border-radius:2px;animation:load 8s ease-in-out forwards}
@keyframes load{0%{width:0%}50%{width:60%}90%{width:85%}100%{width:92%}}
.loading p{color:#555;font-size:13px}
.error{padding:14px;border-radius:10px;background:#1a0a0a;color:#cc4444;font-size:14px;margin-bottom:16px}
.results-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.results-hdr h2{color:#fff;font-size:18px}
.copy-all{padding:6px 14px;border-radius:8px;border:1px solid #d4a843;background:transparent;color:#d4a843;font-size:12px;cursor:pointer}
.card{background:#111;border:1px solid #1a1a1a;border-radius:14px;padding:18px;margin-bottom:16px}
.card-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #1a1a1a}
.badge{font-size:14px;font-weight:700;color:#d4a843;letter-spacing:.5px}
.card-meta{display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dur{color:#555;font-size:12px}
.copy-btn{background:none;border:none;font-size:16px;cursor:pointer;padding:2px 6px}
.section{margin-bottom:14px}
.lbl{font-size:10px;font-weight:700;color:#d4a843;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px}
.hook-box{padding:12px;border-radius:10px;background:#161616;border-left:3px solid #d4a843}
.hook-box p{color:#fff;font-size:16px;font-weight:600;line-height:1.4}
.body-text{color:#bbb;font-size:14px;line-height:1.7;white-space:pre-wrap}
.cta-box{padding:10px 12px;border-radius:10px;background:#0f1a0f}
.cta-box p{color:#6b6;font-size:14px;font-weight:500;line-height:1.5}
.vis-box{padding:8px 12px;border-radius:8px;background:#0f0f1a}
.vis-box p{color:#88c;font-size:12px;line-height:1.5;font-style:italic}
.cost{text-align:center;color:#333;font-size:11px;padding:8px}
.raw{color:#bbb;font-size:13px;white-space:pre-wrap;line-height:1.6}
@media(max-width:600px){
  body{padding:10px}
  .hdr h1{font-size:20px}
  textarea{font-size:15px;padding:12px}
  .gen-btn{padding:12px;font-size:14px}
}

/* Tab Navigation */
.tab-bar{display:flex;gap:0;border-bottom:1px solid #222;margin-bottom:20px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab-btn{flex:1;padding:14px 8px;background:none;border:none;color:#555;font-size:14px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap;min-width:0;text-align:center}
.tab-btn.active{color:#d4a843;border-bottom-color:#d4a843}
.tab-btn:hover{color:#888}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* Idea Cards */
.funnel-section{margin-bottom:24px}
.funnel-hdr{font-size:16px;font-weight:700;margin-bottom:12px;padding:10px 14px;border-radius:10px;display:flex;align-items:center;gap:8px}
.funnel-hdr.tof{background:#1a0808;color:#cc2222;border:1px solid #331111}
.funnel-hdr.mof{background:#1a1508;color:#d4a843;border:1px solid #332a11}
.funnel-hdr.bof{background:#081a0c;color:#22aa44;border:1px solid #113322}

.idea-card{background:#111;border:1px solid #222;border-radius:12px;padding:14px;margin-bottom:10px;position:relative}
.idea-card.replacing{opacity:.5;pointer-events:none}
.idea-badges{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.idea-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.5px}
.idea-badge.tof{background:#cc2222;color:#fff}
.idea-badge.mof{background:#d4a843;color:#000}
.idea-badge.bof{background:#22aa44;color:#fff}
.idea-badge.topic{background:#222;color:#999}
.idea-title{color:#fff;font-size:15px;font-weight:600;line-height:1.4;margin-bottom:8px}
.idea-preview{display:none;color:#999;font-size:13px;line-height:1.5;padding:10px;background:#0a0a0a;border-radius:8px;margin-bottom:8px}
.idea-preview.show{display:block}
.idea-toggle{background:none;border:none;color:#555;font-size:12px;cursor:pointer;padding:4px 0;margin-bottom:6px}
.idea-toggle:hover{color:#888}
.idea-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.idea-action{padding:8px 12px;border-radius:8px;border:1px solid #222;background:#0a0a0a;color:#fff;font-size:13px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px}
.idea-action:hover{border-color:#444}
.idea-action.approve{border-color:#22aa44}
.idea-action.approve:hover{background:#0a1a0f}
.idea-action.reject{border-color:#cc2222}
.idea-action.reject:hover{background:#1a0a0a}
.idea-action.refresh{border-color:#555}

/* Reject Feedback Form */
.reject-form{display:none;padding:12px;background:#0a0a0a;border-radius:10px;margin-top:8px;border:1px solid #1a1111}
.reject-form.show{display:block}
.reject-form select{width:100%;padding:10px;border-radius:8px;border:1px solid #222;background:#111;color:#fff;font-size:14px;margin-bottom:8px;outline:none}
.reject-form .fb-row{display:flex;gap:6px}
.reject-form input{flex:1;padding:10px;border-radius:8px;border:1px solid #222;background:#111;color:#fff;font-size:14px;outline:none}
.reject-form .fb-mic{width:40px;height:40px;border-radius:50%;border:2px solid #333;background:#111;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.reject-form .fb-mic.recording{background:#cc2222;border-color:#cc2222}
.reject-form .fb-submit{width:100%;padding:10px;border-radius:8px;border:none;background:#cc2222;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px}

/* Approved Queue */
.approved-counter{text-align:center;padding:16px;color:#d4a843;font-size:18px;font-weight:700;margin-bottom:16px}
.approved-card{background:#111;border:1px solid #222;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;flex-direction:column;gap:10px}
.approved-title{color:#fff;font-size:15px;font-weight:600;line-height:1.4}
.approved-actions{display:flex;gap:6px;flex-wrap:wrap}
.approved-action{padding:8px 14px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.approved-action.generate{background:#d4a843;color:#000}
.approved-action.remove{background:none;border:1px solid #cc2222;color:#cc2222}
.approved-action.filmed{background:none;border:1px solid #22aa44;color:#22aa44}
.completed-section{margin-top:24px;border-top:1px solid #222;padding-top:16px}
.completed-toggle{background:none;border:none;color:#555;font-size:13px;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.completed-card{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:10px;padding:12px;margin-bottom:8px;opacity:.6}
.completed-card .idea-title{font-size:13px;color:#666}

/* Loading overlay for ideas */
.ideas-loading{text-align:center;padding:60px 20px}
.ideas-loading .spinner{width:40px;height:40px;border:3px solid #222;border-top-color:#d4a843;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.ideas-loading p{color:#555;font-size:14px}
.ideas-empty{text-align:center;padding:40px 20px;color:#444;font-size:14px}

@media(max-width:600px){
  .tab-btn{font-size:13px;padding:12px 4px}
  .idea-actions{gap:4px}
  .idea-action{padding:6px 10px;font-size:12px}
}
</style>
</head>

    <button onclick="localStorage.removeItem('_cs');document.getElementById('loginErr').textContent='Session cleared';document.getElementById('loginErr').style.display='block'" style="display:block;margin:20px auto 0;background:none;border:none;color:#333;font-size:11px;cursor:pointer">Clear saved session</button>
  </div>
</div>

<!-- Main App (hidden until login) -->
<div id="mainApp" style="display:none">
<div class="wrap">
  <div class="hdr">
    <h1>🎬 Content Engine</h1>
    <p>1,025 reels analyzed · your voice · your scripts</p>
    <button onclick="localStorage.removeItem('_cs');location.reload()" style="background:none;border:none;color:#333;font-size:11px;cursor:pointer;margin-top:8px">Log out</button>
  </div>

  <!-- Tab Navigation -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('generate')" id="tabGenerate">⚡ Generate</button>
    <button class="tab-btn" onclick="switchTab('ideas')" id="tabIdeas">💡 Ideas <span id="ideasCount">(0)</span></button>
    <button class="tab-btn" onclick="switchTab('approved')" id="tabApproved">✅ Approved <span id="approvedCount">(0)</span></button>
  </div>

  <!-- Tab 1: Generate (existing) -->
  <div class="tab-panel active" id="panelGenerate">
    <div class="input-wrap">
      <div style="position:relative">
        <textarea id="idea" rows="3" placeholder="Drop your idea here or tap the mic to speak..." style="padding-right:56px"></textarea>
        <button id="micBtn" onclick="toggleMic()" style="position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;border:2px solid #333;background:#111;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s">🎙️</button>
      </div>
      <div id="micStatus" style="display:none;text-align:center;padding:8px;color:#d4a843;font-size:13px"></div>
      <div class="btn-row">
        <button class="gen-btn" id="genBtn" onclick="generate()">⚡ Generate Scripts</button>
      </div>
      <div class="hint">⌘+Enter to generate · tap mic to speak</div>
    </div>
    <div id="output"></div>
  </div>

  <!-- Tab 2: Daily Ideas -->
  <div class="tab-panel" id="panelIdeas">
    <div id="ideasContent">
      <div class="ideas-empty">Tap to load today's ideas</div>
    </div>
    <div style="text-align:center;margin-top:16px">
      <button class="gen-btn" onclick="generateAllIdeas(true)" id="refreshAllBtn" style="max-width:300px">🔄 Generate Fresh Ideas</button>
      <div class="hint" style="margin-top:8px" id="ideasAge"></div>
    </div>
  </div>

  <!-- Tab 3: Approved Queue -->
  <div class="tab-panel" id="panelApproved">
    <div class="approved-counter" id="approvedCounter">0 ideas ready to film</div>
    <div id="approvedList"></div>
    <div class="completed-section" id="completedSection" style="display:none">
      <button class="completed-toggle" onclick="toggleCompleted()">
        <span id="completedArrow">▶</span> Completed (<span id="completedCount">0</span>)
      </button>
      <div id="completedList" style="display:none"></div>
    </div>
  </div>

</div>
</div>

## CRITICAL RULES — READ EVERY ONE

### SPEECH AUTHENTICITY (THIS IS THE #1 PRIORITY)
- **Write SPOKEN words, not written words.** This is a guy talking to his phone camera in his garage/office. NOT a copywriter.
- **Run-on sentences are MANDATORY.** Real speech doesn't have clean sentence breaks: "and I lost money for the first 14 months straight but everything changed the moment I started taking everything seriously I started journaling my trades I started writing down why I'm losing the money"
- **Filler words are MANDATORY.** Every script MUST include at least 3-4 of: "like", "you know what", "I mean", "because if you think about it", "you understand what I'm saying", "honestly", "at the end of the day"
- **Self-corrections and false starts.** Include at least ONE per script: "wait no, let me say that differently", "actually no, here's what I mean", "I was gonna say — actually check this out"
- **Mid-sentence tangents that loop back.** He goes off-topic then comes back: "and the market — you know what's funny is my wife was asking me about this the other day — but anyway the market literally"
- **Imprecise numbers like real speech.** Say "like 40-50 thousand" not "$50,000". Say "about 70-80 percent" not "75%". Say "probably like 14 months" not "14 months."
- **Energy shifts MID-SENTENCE.** He starts calm then suddenly gets fired up within the same thought, or gets vulnerable then snaps back to tough.

### CONTENT RULES
1. **HOOKS MUST STOP THE SCROLL IN 2 SECONDS.** Pattern-interrupt. Controversial. Specific numbers. Or start mid-sentence like he's already talking.
2. **USE HIS EXACT PHRASES** — don't paraphrase "let me put you on some sauce" into "let me share something valuable." Don't clean up "freaking" into "very."
3. **STEAL FROM HIS QUOTES ABOVE.** If one fits the topic, use it word-for-word or close. These are his best lines — use them.
4. **CTAs must be HIS format:** "just comment the word [X] down below and I'll send you all the details right away" or "like this video first and comment the word [word] and I'll DM you the link straight away." FULL sentence, not shortened.
5. **BODY should have ONE clear lesson, not three.** He hammers ONE point with examples, metaphors, and repetition.
6. **Include his metaphors:** food on the table, chapter 1 vs chapter 533, Subway Surfers for levels, being the house not the gambler.
7. **80-180 words MAX.** If it reads like an article, it's too long.
8. **NEVER sound like ChatGPT.** No "In this video I'll show you", no "Are you tired of losing?", no "Here are 3 tips." He doesn't talk like that.
9. **Accidental vulnerability > strategic vulnerability.** Don't plan the emotional moment. Let it slip out naturally mid-rant like real life.

async function searchBrain(query, limit=6) {
  try {
    const r = await fetch(BRAIN_API, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({query, limit})

// Voice recording
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;

async function toggleMic() {
  const btn = document.getElementById('micBtn');
  const status = document.getElementById('micStatus');

  if (isRecording) {
    // Stop recording
    mediaRecorder.stop();
    btn.style.background = '#111';
    btn.style.borderColor = '#333';
    btn.textContent = '🎙️';
    status.textContent = '⏳ Transcribing...';
    isRecording = false;
    return;
  }

  // Start recording
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(audioChunks, { type: 'audio/webm' });

      if (blob.size < 1000) {
        status.textContent = '⚠️ Recording too short';
        setTimeout(() => status.style.display = 'none', 2000);
        return;
      }

      status.style.display = 'block';
      status.textContent = '⏳ Transcribing your voice...';

      try {
        const formData = new FormData();
        formData.append('file', blob, 'voice.webm');
        formData.append('model', 'whisper-1');
        formData.append('language', 'en');

        const res = await fetch('https://api.openai.com/v1/audio/transcriptions', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + getOKey() },
          body: formData
        });

        const data = await res.json();
        if (data.text) {
          const ta = document.getElementById('idea');
          ta.value = ta.value ? ta.value + ' ' + data.text : data.text;
          status.textContent = '✅ Got it!';
          setTimeout(() => status.style.display = 'none', 1500);
        } else {
          status.textContent = '❌ ' + (data.error?.message || 'Transcription failed');
          setTimeout(() => status.style.display = 'none', 3000);
        }
      } catch(err) {
        status.textContent = '❌ ' + err.message;
        setTimeout(() => status.style.display = 'none', 3000);
      }
    };

    mediaRecorder.start();
    isRecording = true;
    btn.style.background = '#cc2222';
    btn.style.borderColor = '#cc2222';
    btn.textContent = '⏹️';
    status.style.display = 'block';
    status.textContent = '🔴 Recording... tap to stop';
  } catch(err) {
    status.style.display = 'block';
    status.textContent = '❌ Mic access denied';
    setTimeout(() => status.style.display = 'none', 3000);
  }
}

function loadIdeasTab() {
  const ideas = _safeParse('_ideas', '[]');
  const ts = parseInt(localStorage.getItem('_ideas_ts') || '0');
  const age = Date.now() - ts;

  if (ideas.length === 0 || age > IDEAS_STALE_MS) {
    generateAllIdeas(false);
  } else {
    renderIdeas(ideas);
    updateIdeasAge(ts);
  }
}

function updateIdeasAge(ts) {
  if (!ts) { document.getElementById('ideasAge').textContent = ''; return; }
  const hrs = Math.floor((Date.now() - ts) / 3600000);
  const mins = Math.floor((Date.now() - ts) / 60000) % 60;
  document.getElementById('ideasAge').textContent = hrs > 0 ? `Generated ${hrs}h ${mins}m ago` : `Generated ${mins}m ago`;
}

function _safeParse(key, fallback) { try { return JSON.parse(localStorage.getItem(key) || fallback); } catch(e) { localStorage.removeItem(key); return JSON.parse(fallback); } }

function getTasteProfile() {
  const taste = _safeParse('_taste', '{"liked_topics":[],"rejected_topics":[],"liked_funnels":{"tof":0,"mof":0,"bof":0},"rejected_reasons":[],"notes":[]}');
  if (!taste.liked_topics) taste.liked_topics = [];
  if (!taste.rejected_topics) taste.rejected_topics = [];
  if (!taste.liked_funnels) taste.liked_funnels = {tof:0,mof:0,bof:0};
  if (!taste.rejected_reasons) taste.rejected_reasons = [];
  if (!taste.notes) taste.notes = [];
  return taste;
}

  let html = '';

  // TOF Section
  html += '<div class="funnel-section"><div class="funnel-hdr tof" style="justify-content:space-between">🔴 TOP OF FUNNEL — Reach & Traffic (' + tof.length + ')<button onclick="refreshNewsOnly()" id="refreshNewsBtn" style="padding:6px 12px;border-radius:8px;border:1px solid #cc2222;background:none;color:#cc2222;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap">🔥 Refresh News</button></div>';
  tof.forEach(idea => { html += renderIdeaCard(idea); });
  html += '</div>';

  // MOF Section
  html += '<div class="funnel-section"><div class="funnel-hdr mof">🟡 MIDDLE OF FUNNEL — Engagement (' + mof.length + ')</div>';
  mof.forEach(idea => { html += renderIdeaCard(idea); });
  html += '</div>';

  // BOF Section
  html += '<div class="funnel-section"><div class="funnel-hdr bof">🟢 BOTTOM OF FUNNEL — Convert (' + bof.length + ')</div>';
  bof.forEach(idea => { html += renderIdeaCard(idea); });
  html += '</div>';

  container.innerHTML = html;
}

const TOPIC_LABELS = {trading:'Trading',psychology:'Psychology',family:'Family',lifestyle:'Lifestyle',news:'News',student_story:'Student Story'};

function renderIdeaCard(idea) {
  const funnelClass = idea.funnel || 'tof';
  const funnelLabel = funnelClass === 'tof' ? 'TOF' : funnelClass === 'mof' ? 'MOF' : 'BOF';
  const topicLabel = TOPIC_LABELS[idea.topic] || idea.topic || 'General';
  const safeId = (idea.id || '').replace(/[^a-zA-Z0-9_-]/g, '');

  return `<div class="idea-card" id="card-${safeId}">
    <div class="idea-badges">
      <span class="idea-badge ${funnelClass}">${funnelLabel}</span>
      <span class="idea-badge topic">${esc(topicLabel)}</span>
    </div>
    <div class="idea-title">${esc(idea.title)}</div>
    <button class="idea-toggle" onclick="togglePreview('${safeId}')">▶ Preview</button>
    <div class="idea-preview" id="preview-${safeId}">${esc(idea.preview || '')}</div>
    <div class="idea-actions">
      <button class="idea-action approve" onclick="approveIdea('${safeId}')">✅</button>
      <button class="idea-action reject" onclick="showRejectForm('${safeId}')">❌</button>
      <button class="idea-action refresh" onclick="refreshIdea('${safeId}')">🔄</button>
    </div>
    <div class="reject-form" id="reject-${safeId}">
      <select id="reason-${safeId}">
        <option value="">Why not?</option>
        <option value="done_before">Done before</option>
        <option value="boring">Boring</option>
        <option value="not_my_style">Not my style</option>
        <option value="wrong_timing">Wrong timing</option>
        <option value="too_generic">Too generic</option>
        <option value="other">Other</option>
      </select>
      <div class="fb-row">
        <input type="text" id="fb-text-${safeId}" placeholder="Optional feedback...">
        <button class="fb-mic" id="fb-mic-${safeId}" onclick="toggleFbMic('${safeId}')">🎙️</button>
      </div>
      <div id="fb-mic-status-${safeId}" style="display:none;text-align:center;padding:4px;color:#d4a843;font-size:12px;margin-top:4px"></div>
      <button class="fb-submit" onclick="submitReject('${safeId}')">Reject & Replace</button>
    </div>
  </div>`;
}

function togglePreview(id) {
  const el = document.getElementById('preview-' + id);
  const btn = el?.previousElementSibling;
  if (el) {
    el.classList.toggle('show');
    if (btn) btn.textContent = el.classList.contains('show') ? '▼ Preview' : '▶ Preview';
  }
}

function getIdeaById(id) {
  const ideas = _safeParse('_ideas', '[]');
  return ideas.find(i => (i.id || '').replace(/[^a-zA-Z0-9_-]/g, '') === id);
}

const _busyCards = new Set();
function approveIdea(id) {
  if (_busyCards.has(id)) return;
  _busyCards.add(id);
  const ideas = _safeParse('_ideas', '[]');
  const idx = ideas.findIndex(i => (i.id || '').replace(/[^a-zA-Z0-9_-]/g, '') === id);
  if (idx === -1) return;

  const idea = ideas[idx];
  ideas.splice(idx, 1);
  localStorage.setItem('_ideas', JSON.stringify(ideas));

  // Add to approved
  const approved = _safeParse('_approved', '[]');
  idea.approvedAt = Date.now();
  idea.filmed = false;
  approved.unshift(idea);
  localStorage.setItem('_approved', JSON.stringify(approved));

  // Update taste
  const taste = getTasteProfile();
  taste.liked_topics.push(idea.topic);
  if (taste.liked_funnels[idea.funnel] !== undefined) taste.liked_funnels[idea.funnel]++;
  // Keep last 50
  if (taste.liked_topics.length > 50) taste.liked_topics = taste.liked_topics.slice(-50);
  saveTasteProfile(taste);

  // Animate removal
  const card = document.getElementById('card-' + id);
  if (card) {
    card.style.transition = 'all .3s';
    card.style.opacity = '0';
    card.style.transform = 'translateX(100px)';
    setTimeout(() => { renderIdeas(ideas); updateTabCounts(); }, 300);
  } else {
    renderIdeas(ideas);
    updateTabCounts();
  }
}

function showRejectForm(id) {
  const form = document.getElementById('reject-' + id);
  if (form) form.classList.toggle('show');
}

async function submitReject(id) {
  if (_busyCards.has(id)) return;
  _busyCards.add(id);
  const ideas = _safeParse('_ideas', '[]');
  const idx = ideas.findIndex(i => (i.id || '').replace(/[^a-zA-Z0-9_-]/g, '') === id);
  if (idx === -1) return;

  const idea = ideas[idx];
  const reason = document.getElementById('reason-' + id)?.value || '';
  const text = document.getElementById('fb-text-' + id)?.value || '';

  // Save feedback
  const feedback = _safeParse('_feedback', '[]');
  feedback.push({ ideaId: idea.id, title: idea.title, funnel: idea.funnel, topic: idea.topic, reason, text, ts: Date.now() });
  localStorage.setItem('_feedback', JSON.stringify(feedback));

  // Update taste
  const taste = getTasteProfile();
  taste.rejected_topics.push(idea.topic);
  if (reason) taste.rejected_reasons.push(reason);
  if (text) taste.notes.push(text);
  if (taste.rejected_topics.length > 50) taste.rejected_topics = taste.rejected_topics.slice(-50);
  if (taste.rejected_reasons.length > 50) taste.rejected_reasons = taste.rejected_reasons.slice(-50);
  if (taste.notes.length > 30) taste.notes = taste.notes.slice(-30);
  saveTasteProfile(taste);

  // Replace with new idea
  const card = document.getElementById('card-' + id);
  if (card) card.classList.add('replacing');

  try {
    const newIdea = await generateOneIdea(idea.funnel);
    if (newIdea) {
      ideas[idx] = newIdea;
    } else {
      ideas.splice(idx, 1);
    }
  } catch(e) {
    ideas.splice(idx, 1);
  }

  localStorage.setItem('_ideas', JSON.stringify(ideas));
  renderIdeas(ideas);
  updateTabCounts();
}

async function refreshIdea(id) {
  if (_busyCards.has(id)) return;
  _busyCards.add(id);
  const ideas = _safeParse('_ideas', '[]');
  const idx = ideas.findIndex(i => (i.id || '').replace(/[^a-zA-Z0-9_-]/g, '') === id);
  if (idx === -1) return;

  const idea = ideas[idx];
  const card = document.getElementById('card-' + id);
  if (card) card.classList.add('replacing');

  try {
    const newIdea = await generateOneIdea(idea.funnel);
    if (newIdea) {
      ideas[idx] = newIdea;
    }
  } catch(e) { /* keep old idea on error */ }

  localStorage.setItem('_ideas', JSON.stringify(ideas));
  renderIdeas(ideas);
  updateTabCounts();
}

async function refreshNewsOnly() {
  const btn = document.getElementById('refreshNewsBtn');
  if (!btn) return;
  const origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '⏳ Fetching fresh news...';

  try {
    // Fetch real trending news
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': getKey(),
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 2000,
        system: `You generate TOP OF FUNNEL content ideas for Somesh (Kay Capitals) — day trading educator, 1M+ IG followers. Focus on NEWS, CURRENT EVENTS, CONTROVERSY, and TIMELY topics only. Ideas must feel like they happened TODAY or THIS WEEK. Include: market news, earnings, Fed decisions, political moves affecting markets, viral financial topics, breaking economic data. Each idea should be a specific scroll-stopping hook. Return ONLY valid JSON.`,
        messages: [{role: 'user', content: `Generate 5 fresh NEWS-BASED top of funnel content ideas. These must be TIMELY — things happening RIGHT NOW in markets, politics, or economy that affect traders. Think: earnings reports, Fed meetings, tariffs, market crashes, viral moments.

Return: {"ideas":[{"id":"news_${Date.now()}_1","funnel":"tof","topic":"news","title":"...","preview":"2-3 sentence script preview","tags":["news","timely"]}]}`}]
      })
    });

    const data = await r.json();
    if (data.error) throw new Error(data.error.message);
    const txt = data.content[0].text;
    const m = txt.match(/\{[\s\S]*"ideas"[\s\S]*\}/);
    if (!m) throw new Error('Bad response');

    const parsed = JSON.parse(m[0]);
    const newNewsIdeas = parsed.ideas || [];

    // Replace only news/timely TOF ideas, keep family/lifestyle/trading TOF ideas
    let ideas = _safeParse('_ideas', '[]');
    const newsTopics = ['news'];
    const oldNewsIdeas = ideas.filter(i => i.funnel === 'tof' && newsTopics.includes(i.topic));
    const nonNewsIdeas = ideas.filter(i => !(i.funnel === 'tof' && newsTopics.includes(i.topic)));

    // Replace old news with new, keep everything else
    ideas = [...nonNewsIdeas, ...newNewsIdeas.map((idea, idx) => ({
      ...idea,
      id: idea.id || `news_${Date.now()}_${idx}`
    }))];

    localStorage.setItem('_ideas', JSON.stringify(ideas));
    renderIdeas(ideas);
    updateTabCounts();
    btn.textContent = '✅ News refreshed!';
    setTimeout(() => { btn.textContent = '🔥 Refresh News'; btn.disabled = false; }, 2000);
  } catch(e) {
    btn.textContent = '❌ ' + (e.message || 'Failed');
    setTimeout(() => { btn.textContent = origText; btn.disabled = false; }, 3000);
  }
}

async function generateOneIdea(funnel) {
  const taste = getTasteProfile();
  const funnelLabel = funnel === 'tof' ? 'TOP OF FUNNEL' : funnel === 'mof' ? 'MIDDLE OF FUNNEL' : 'BOTTOM OF FUNNEL';

  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': getKey(),
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 500,
        system: `You generate content ideas for Somesh (Kay Capitals) — day trading educator, 1M+ IG followers. Return ONLY valid JSON.`,
        messages: [{role: 'user', content: `Generate 1 new ${funnelLabel} Instagram reel idea. Be SPECIFIC and TIMELY.

Taste profile: ${JSON.stringify(taste)}

Return ONLY: {"idea":{"id":"${Date.now()}_new","funnel":"${funnel}","topic":"trading|psychology|family|lifestyle|news|student_story","title":"...","preview":"2-3 sentences","tags":[]}}`}]
      })
    });

    const data = await r.json();
    if (data.error) return null;
    const txt = data.content[0].text;
    const m = txt.match(/\{[\s\S]*"idea"[\s\S]*\}/);
    if (m) {
      const parsed = JSON.parse(m[0]);
      return parsed.idea || null;
    }
    return null;
  } catch(e) { return null; }
}

// Voice feedback for reject form
let fbMediaRecorder = null;
let fbAudioChunks = [];
let fbRecordingId = null;

async function toggleFbMic(id) {
  const btn = document.getElementById('fb-mic-' + id);
  const status = document.getElementById('fb-mic-status-' + id);

  if (fbRecordingId === id) {
    // Stop recording
    fbMediaRecorder.stop();
    btn.classList.remove('recording');
    btn.textContent = '🎙️';
    status.textContent = '⏳ Transcribing...';
    status.style.display = 'block';
    fbRecordingId = null;
    return;
  }

  // Stop any existing recording
  if (fbRecordingId && fbMediaRecorder) {
    fbMediaRecorder.stop();
    const oldBtn = document.getElementById('fb-mic-' + fbRecordingId);
    if (oldBtn) { oldBtn.classList.remove('recording'); oldBtn.textContent = '🎙️'; }
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    fbAudioChunks = [];
    fbMediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
    fbRecordingId = id;

    fbMediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) fbAudioChunks.push(e.data);
    };

    fbMediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(fbAudioChunks, { type: 'audio/webm' });
      if (blob.size < 1000) {
        status.textContent = '⚠️ Too short';
        setTimeout(() => status.style.display = 'none', 2000);
        return;
      }

      status.style.display = 'block';
      status.textContent = '⏳ Transcribing...';

      try {
        const formData = new FormData();
        formData.append('file', blob, 'voice.webm');
        formData.append('model', 'whisper-1');
        formData.append('language', 'en');

        const res = await fetch('https://api.openai.com/v1/audio/transcriptions', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + getOKey() },
          body: formData
        });

        const data = await res.json();
        if (data.text) {
          const input = document.getElementById('fb-text-' + id);
          if (input) input.value = input.value ? input.value + ' ' + data.text : data.text;
          status.textContent = '✅ Got it!';
          setTimeout(() => status.style.display = 'none', 1500);
        } else {
          status.textContent = '❌ ' + (data.error?.message || 'Failed');
          setTimeout(() => status.style.display = 'none', 3000);
        }
      } catch(err) {
        status.textContent = '❌ ' + err.message;
        setTimeout(() => status.style.display = 'none', 3000);
      }
    };

    fbMediaRecorder.start();
    btn.classList.add('recording');
    btn.textContent = '⏹️';
    status.style.display = 'block';
    status.textContent = '🔴 Recording...';
  } catch(err) {
    status.style.display = 'block';
    status.textContent = '❌ Mic access denied';
    setTimeout(() => status.style.display = 'none', 3000);
  }
}

// ========== APPROVED TAB ==========
function renderApproved() {
  const approved = _safeParse('_approved', '[]');
  const active = approved.filter(a => !a.filmed);
  const completed = approved.filter(a => a.filmed);

  document.getElementById('approvedCounter').textContent = active.length + ' idea' + (active.length !== 1 ? 's' : '') + ' ready to film';

  let html = '';
  if (active.length === 0) {
    html = '<div class="ideas-empty">No approved ideas yet.<br>Go to 💡 Ideas and approve some!</div>';
  }
  active.forEach(idea => {
    const safeId = (idea.id || '').replace(/[^a-zA-Z0-9_-]/g, '');
    const funnelClass = idea.funnel || 'tof';
    const funnelLabel = funnelClass === 'tof' ? 'TOF' : funnelClass === 'mof' ? 'MOF' : 'BOF';
    const topicLabel = TOPIC_LABELS[idea.topic] || idea.topic || 'General';

    html += `<div class="approved-card">
      <div class="idea-badges">
        <span class="idea-badge ${funnelClass}">${funnelLabel}</span>
        <span class="idea-badge topic">${esc(topicLabel)}</span>
      </div>
      <div class="approved-title">${esc(idea.title)}</div>
      <div class="approved-actions">
        <button class="approved-action generate" onclick="generateFromIdea('${safeId}')">⚡ Generate Scripts</button>
        <button class="approved-action filmed" onclick="markFilmed('${safeId}')">✅ Filmed</button>
        <button class="approved-action remove" onclick="removeApproved('${safeId}')">🗑️</button>
      </div>
    </div>`;
  });
  document.getElementById('approvedList').innerHTML = html;

  // Completed section
  if (completed.length > 0) {
    document.getElementById('completedSection').style.display = 'block';
    document.getElementById('completedCount').textContent = completed.length;
    let cHtml = '';
    completed.forEach(idea => {
      const funnelClass = idea.funnel || 'tof';
      const funnelLabel = funnelClass === 'tof' ? 'TOF' : funnelClass === 'mof' ? 'MOF' : 'BOF';
      cHtml += `<div class="completed-card"><div class="idea-badges"><span class="idea-badge ${funnelClass}">${funnelLabel}</span></div><div class="idea-title">${esc(idea.title)}</div></div>`;
    });
    document.getElementById('completedList').innerHTML = cHtml;
  } else {
    document.getElementById('completedSection').style.display = 'none';
  }

  updateTabCounts();
}

function generateFromIdea(id) {
  const approved = _safeParse('_approved', '[]');
  const idea = approved.find(i => (i.id || '').replace(/[^a-zA-Z0-9_-]/g, '') === id);
  if (!idea) return;

  // Switch to generate tab and pre-fill
  switchTab('generate');
  const ta = document.getElementById('idea');
  ta.value = idea.title;
  ta.focus();
  // Auto-trigger generation
  setTimeout(() => generate(), 300);
}

function markFilmed(id) {
  const approved = _safeParse('_approved', '[]');
  const idea = approved.find(i => (i.id || '').replace(/[^a-zA-Z0-9_-]/g, '') === id);
  if (idea) {
    idea.filmed = true;
    idea.filmedAt = Date.now();
    localStorage.setItem('_approved', JSON.stringify(approved));
    renderApproved();
  }
}

function removeApproved(id) {
  let approved = _safeParse('_approved', '[]');
  approved = approved.filter(i => (i.id || '').replace(/[^a-zA-Z0-9_-]/g, '') !== id);
  localStorage.setItem('_approved', JSON.stringify(approved));
  renderApproved();
}

function toggleCompleted() {
  const list = document.getElementById('completedList');
  const arrow = document.getElementById('completedArrow');
  if (list.style.display === 'none') {
    list.style.display = 'block';
    arrow.textContent = '▼';
  } else {
    list.style.display = 'none';
    arrow.textContent = '▶';
  }
}
