<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Re-Engagement Command Center | 862 Leads</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#D4A843;--gold-light:#F0D78C;--gold-dark:#A67C2E;
  --bg:#0A0A0F;--bg2:#12121A;--bg3:#1A1A28;--bg4:#222236;
  --text:#E8E8F0;--text2:#A0A0B8;--text3:#6B6B80;
  --green:#2ECC71;--green-dark:#1A7A42;--yellow:#F1C40F;--red:#E74C3C;--red-dark:#922B21;
  --blue:#3498DB;--purple:#9B59B6;--orange:#E67E22;--pink:#E91E63;--teal:#1ABC9C;
  --glass:rgba(255,255,255,0.04);--glass-border:rgba(255,255,255,0.08);
  --radius:16px;--radius-sm:10px;
  --hot:#E74C3C;--warm:#E67E22;--medium:#F1C40F;--cold:#5D6D7E;
}
html{scroll-behavior:smooth;font-size:16px}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,sans-serif;line-height:1.6;overflow-x:hidden;min-height:100vh}
h1,h2,h3,h4{font-weight:700;letter-spacing:-.02em}
::selection{background:rgba(212,168,67,.3)}

#particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}

.glass{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}

/* HEADER BAR */
.header-bar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,10,15,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.header-left{display:flex;align-items:center;gap:12px}
.header-brand{font-weight:800;font-size:1rem;color:var(--gold);white-space:nowrap}
.done-counter{font-size:.85rem;color:var(--text2);padding:4px 12px;border-radius:50px;background:rgba(212,168,67,.08);border:1px solid rgba(212,168,67,.15);white-space:nowrap}
.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hdr-btn{padding:6px 14px;border-radius:8px;font-size:.78rem;font-weight:600;border:1px solid var(--glass-border);background:var(--glass);color:var(--text2);cursor:pointer;transition:all .2s;white-space:nowrap}
.hdr-btn:hover{border-color:var(--gold);color:var(--gold)}
.hdr-btn.danger{color:var(--red);border-color:rgba(231,76,60,.3)}
.hdr-btn.danger:hover{background:rgba(231,76,60,.1)}

/* MAIN CONTENT */
.main{position:relative;z-index:1;padding:72px 16px 40px;max-width:900px;margin:0 auto}

/* HERO */
.hero{text-align:center;padding:40px 0 32px}
.hero-badge{display:inline-block;padding:6px 18px;border:1px solid var(--gold);border-radius:50px;color:var(--gold);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:20px;animation:shimmer 3s ease-in-out infinite}
@keyframes shimmer{0%,100%{opacity:.7}50%{opacity:1}}
.hero h1{font-size:clamp(1.6rem,4.5vw,2.8rem);line-height:1.15;margin-bottom:12px}
.hero h1 .gold{background:linear-gradient(135deg,var(--gold-light),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{color:var(--text2);font-size:clamp(.88rem,2vw,1.05rem);max-width:600px;margin:0 auto}

/* STATS ROW */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:32px 0}
.stat-card{padding:18px 12px;text-align:center;transition:transform .3s;cursor:default}
.stat-card:hover{transform:translateY(-3px)}
.stat-num{font-size:clamp(1.4rem,3vw,2rem);font-weight:800;display:block;line-height:1.2}
.stat-label{color:var(--text2);font-size:.78rem;margin-top:2px}
.stat-card.hot .stat-num{color:var(--hot)}
.stat-card.warm .stat-num{color:var(--warm)}
.stat-card.medium .stat-num{color:var(--medium)}
.stat-card.cold .stat-num{color:var(--cold)}

/* FILTERS */
.filters-toggle{display:none;width:100%;padding:12px;border-radius:var(--radius-sm);border:1px solid var(--glass-border);background:var(--glass);color:var(--gold);font-size:.9rem;font-weight:600;cursor:pointer;text-align:center;margin-bottom:12px}
.filters-panel{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filter-label{font-size:.78rem;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;font-weight:600;min-width:50px;flex-shrink:0}
.search-wrap{position:relative;flex:1;min-width:200px}
.search-wrap input{width:100%;padding:10px 14px 10px 36px;border-radius:var(--radius-sm);border:1px solid var(--glass-border);background:var(--bg2);color:var(--text);font-size:.9rem;outline:none;transition:border-color .3s}
.search-wrap input:focus{border-color:var(--gold)}
.search-wrap input::placeholder{color:var(--text3)}
.search-wrap .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:.9rem}

.temp-btns{display:flex;gap:6px;flex-wrap:wrap}
.temp-btn{padding:7px 14px;border-radius:8px;font-size:.8rem;font-weight:600;border:1px solid var(--glass-border);background:var(--glass);color:var(--text2);cursor:pointer;transition:all .2s;white-space:nowrap}
.temp-btn:hover{border-color:var(--gold);color:var(--text)}
.temp-btn.active{background:rgba(212,168,67,.15);border-color:var(--gold);color:var(--gold)}

.filter-select{padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--glass-border);background:var(--bg2);color:var(--text);font-size:.85rem;outline:none;cursor:pointer;min-width:140px}
.filter-select:focus{border-color:var(--gold)}

/* SHOW/HIDE DONE */
.show-done-wrap{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.toggle-switch{position:relative;width:40px;height:22px;cursor:pointer}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--bg3);border-radius:22px;transition:.3s;border:1px solid var(--glass-border)}
.toggle-slider::before{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:var(--text3);left:2px;top:2px;transition:.3s}
.toggle-switch input:checked+.toggle-slider{background:rgba(212,168,67,.2);border-color:var(--gold)}
.toggle-switch input:checked+.toggle-slider::before{transform:translateX(18px);background:var(--gold)}
.show-done-label{font-size:.82rem;color:var(--text2)}

/* RESULTS INFO */
.results-info{font-size:.82rem;color:var(--text3);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}

/* LEAD CARDS */
.cards-container{display:flex;flex-direction:column;gap:14px}
.lead-card{position:relative;overflow:hidden;transition:all .4s cubic-bezier(.25,.46,.45,.94);cursor:pointer}
.lead-card.done-card{opacity:.3;order:9999}
.lead-card:hover{border-color:rgba(212,168,67,.2)}

/* Temperature borders */
.lead-card.temp-hot{border-color:rgba(231,76,60,.35);box-shadow:0 0 20px rgba(231,76,60,.08),0 0 40px rgba(212,168,67,.04)}
.lead-card.temp-warm{border-color:rgba(230,126,34,.3)}
.lead-card.temp-medium{border-color:rgba(241,196,15,.25)}
.lead-card.temp-cold{border-color:rgba(93,109,126,.3)}

.card-main{padding:16px 18px;display:flex;gap:12px;align-items:flex-start}
.card-check{flex-shrink:0;margin-top:2px}
.card-check input[type=checkbox]{width:20px;height:20px;accent-color:var(--gold);cursor:pointer}
.card-body{flex:1;min-width:0}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.card-name{font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-score{font-weight:800;font-size:.95rem;flex-shrink:0;padding:3px 10px;border-radius:6px}
.card-score.hot{background:rgba(231,76,60,.15);color:var(--hot)}
.card-score.warm{background:rgba(230,126,34,.15);color:var(--warm)}
.card-score.medium{background:rgba(241,196,15,.15);color:var(--medium)}
.card-score.cold{background:rgba(93,109,126,.15);color:var(--cold)}
.card-meta{font-size:.82rem;color:var(--text3);margin-bottom:2px}
.card-meta span{margin-right:12px}
.card-objection{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.obj-price{background:rgba(241,196,15,.1);color:var(--yellow);border:1px solid rgba(241,196,15,.2)}
.obj-timing{background:rgba(52,152,219,.1);color:var(--blue);border:1px solid rgba(52,152,219,.2)}
.obj-trust{background:rgba(155,89,182,.1);color:var(--purple);border:1px solid rgba(155,89,182,.2)}
.obj-skill_doubt{background:rgba(230,126,34,.1);color:var(--orange);border:1px solid rgba(230,126,34,.2)}
.obj-affordability{background:rgba(231,76,60,.1);color:var(--red);border:1px solid rgba(231,76,60,.2)}
.obj-ghost{background:rgba(93,109,126,.1);color:#8395a7;border:1px solid rgba(93,109,126,.2)}
.obj-scam_fear{background:rgba(233,30,99,.1);color:var(--pink);border:1px solid rgba(233,30,99,.2)}

.card-message{margin-top:10px;padding:10px 14px;background:rgba(212,168,67,.04);border-left:3px solid var(--gold);border-radius:0 8px 8px 0}
.card-message-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);margin-bottom:4px;font-weight:600}
.card-message-text{font-size:.88rem;color:var(--text2);line-height:1.5;white-space:pre-wrap}

.card-actions{display:flex;gap:8px;margin-top:10px}
.card-btn{padding:8px 16px;border-radius:8px;font-size:.8rem;font-weight:600;border:1px solid var(--glass-border);background:var(--glass);color:var(--text2);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
.card-btn:hover{border-color:var(--gold);color:var(--gold)}
.card-btn.copy-btn:hover{background:rgba(212,168,67,.1)}
.card-btn.done-btn:hover{background:rgba(46,204,113,.1);border-color:var(--green);color:var(--green)}
.card-btn.done-btn.is-done{background:rgba(46,204,113,.15);border-color:var(--green);color:var(--green)}

/* Expanded detail */
.card-detail{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.25,.46,.45,.94)}
.lead-card.expanded .card-detail{max-height:400px}
.card-detail-inner{padding:0 18px 16px;margin-left:32px}
.detail-row{display:flex;gap:8px;margin-bottom:6px;font-size:.85rem}
.detail-label{color:var(--text3);font-weight:600;min-width:90px;flex-shrink:0}
.detail-value{color:var(--text2)}

/* LOAD MORE */
.load-more-wrap{text-align:center;padding:24px 0}
.load-more-btn{padding:12px 32px;border-radius:var(--radius-sm);border:1px solid var(--gold);background:rgba(212,168,67,.08);color:var(--gold);font-size:.9rem;font-weight:700;cursor:pointer;transition:all .2s}
.load-more-btn:hover{background:rgba(212,168,67,.15)}
.load-more-btn:disabled{opacity:.4;cursor:default}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(10,10,15,.95);border:1px solid var(--gold);border-radius:var(--radius-sm);padding:12px 24px;color:var(--gold);font-size:.88rem;font-weight:600;z-index:200;transition:transform .3s;pointer-events:none;backdrop-filter:blur(20px)}
.toast.show{transform:translateX(-50%) translateY(0)}

/* MOBILE */
@media(max-width:640px){
  .stats-row{grid-template-columns:repeat(2,1fr);gap:8px}
  .stat-card{padding:14px 8px}
  .filters-toggle{display:block}
  .filters-panel{display:none}
  .filters-panel.open{display:flex}
  .filter-row{flex-direction:column;align-items:stretch}
  .filter-label{min-width:auto}
  .temp-btns{justify-content:center}
  .header-bar{padding:8px 12px}
  .header-actions{gap:4px}
  .hdr-btn{padding:5px 10px;font-size:.72rem}
  .main{padding:64px 10px 40px}
  .hero{padding:24px 0 20px}
  .card-main{padding:12px 14px}
  .card-actions{flex-wrap:wrap}
}
@media(max-width:380px){
  .temp-btn{padding:5px 8px;font-size:.72rem}
}

/* Print hidden */
@media print{
  #particles,.header-bar,.toast,.filters-panel,.filters-toggle,.load-more-wrap{display:none}
  .main{padding-top:20px}
  .lead-card{break-inside:avoid;page-break-inside:avoid}
}

/* Animations */
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.card-enter{animation:fadeInUp .4s ease forwards}
</style>
</head>

// Expand shorthand
const ALL_LEADS = RAW.map((r,i) => ({
  id: i,
  name: r.n,
  phone: r.p,
  lastDate: r.d,
  daysSince: r.ds,
  prob: r.ps,
  objection: r.o,
  intent: r.il,
  deathPoint: r.dp,
  message: r.m
}));

// ===== STATE =====
let doneSet = new Set(JSON.parse(localStorage.getItem('re_done') || '[]'));
let filtered = [];
let displayed = 0;
const PAGE = 50;
let currentTemp = 'all';

// ===== HELPERS =====
function getTemp(prob) {
  if (prob >= 70) return 'hot';
  if (prob >= 50) return 'warm';
  if (prob >= 30) return 'medium';
  return 'cold';
}

function getTempEmoji(t) {
  return {hot:'🔥',warm:'🟡',medium:'🟠',cold:'🧊'}[t] || '';
}

function objLabel(o) {
  return {price:'Price',timing:'Timing',trust:'Trust',skill_doubt:'Skill Doubt',affordability:'Affordability',ghost:'Ghost',scam_fear:'Scam Fear'}[o] || o;
}

function saveDone() {
  localStorage.setItem('re_done', JSON.stringify([...doneSet]));
  updateDoneCounter();
}

function updateDoneCounter() {
  document.getElementById('doneCounter').textContent = 'Done: ' + doneSet.size + ' / ' + ALL_LEADS.length;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ===== FILTERS =====
function setTemp(btn) {
  document.querySelectorAll('.temp-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentTemp = btn.dataset.temp;
  applyFilters();
}

function applyFilters() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const obj = document.getElementById('objFilter').value;
  const sort = document.getElementById('sortFilter').value;
  const showDone = document.getElementById('showDoneToggle').checked;

  filtered = ALL_LEADS.filter(l => {
    if (!showDone && doneSet.has(l.id)) return false;
    if (currentTemp !== 'all' && getTemp(l.prob) !== currentTemp) return false;
    if (obj !== 'all' && l.objection !== obj) return false;
    if (search && !l.name.toLowerCase().includes(search) && !l.phone.includes(search)) return false;
    return true;
  });

  // Sort
  filtered.sort((a, b) => {
    // Done items always at bottom
    const aDone = doneSet.has(a.id) ? 1 : 0;
    const bDone = doneSet.has(b.id) ? 1 : 0;
    if (aDone !== bDone) return aDone - bDone;

    switch(sort) {
      case 'prob-asc': return a.prob - b.prob;
      case 'recent': return new Date(b.lastDate) - new Date(a.lastDate);
      case 'oldest': return new Date(a.lastDate) - new Date(b.lastDate);
      default: return b.prob - a.prob;
    }
  });

  displayed = 0;
  document.getElementById('cardsContainer').innerHTML = '';
  loadMore();
  document.getElementById('resultsCount').textContent = 'Showing ' + Math.min(displayed, filtered.length) + ' of ' + filtered.length + ' leads';
}

// ===== RENDER =====
function renderCard(lead) {
  const temp = getTemp(lead.prob);
  const isDone = doneSet.has(lead.id);
  const div = document.createElement('div');
  div.className = 'lead-card glass temp-' + temp + (isDone ? ' done-card' : '') + ' card-enter';
  div.dataset.id = lead.id;

  const msgPreview = lead.message ? (lead.message.length > 160 ? lead.message.substring(0, 160) + '...' : lead.message) : 'No message available';

  div.innerHTML = `
    <div class="card-main" onclick="toggleExpand(this.parentElement)">
      <div class="card-check" onclick="event.stopPropagation()">
        <input type="checkbox" ${isDone ? 'checked' : ''} onchange="toggleDone(${lead.id}, this.checked)">
      </div>
      <div class="card-body">
        <div class="card-top">
          <span class="card-name">${esc(lead.name)}</span>
          <span class="card-score ${temp}">${getTempEmoji(temp)} ${lead.prob}%</span>
        </div>
        <div class="card-meta">
          <span>${esc(lead.phone)}</span>
          <span>Last contact: ${lead.daysSince} days ago</span>
        </div>
        <span class="card-objection obj-${lead.objection}">${objLabel(lead.objection)}</span>
        <div class="card-message">
          <div class="card-message-label">Custom Message</div>
          <div class="card-message-text">${esc(msgPreview)}</div>
        </div>
        <div class="card-actions" onclick="event.stopPropagation()">
          <button class="card-btn copy-btn" onclick="copyMsg(${lead.id})">📋 Copy Message</button>
          <button class="card-btn done-btn ${isDone ? 'is-done' : ''}" onclick="toggleDoneBtn(${lead.id})">✅ Done</button>
        </div>
      </div>
    </div>
    <div class="card-detail">
      <div class="card-detail-inner">
        <div class="detail-row"><span class="detail-label">Death Point:</span><span class="detail-value">${esc(lead.deathPoint || 'N/A')}</span></div>
        <div class="detail-row"><span class="detail-label">Intent Level:</span><span class="detail-value">${lead.intent ? lead.intent.charAt(0).toUpperCase() + lead.intent.slice(1) : 'N/A'}</span></div>
        <div class="detail-row"><span class="detail-label">Last Date:</span><span class="detail-value">${lead.lastDate}</span></div>
        <div class="detail-row"><span class="detail-label">Full Message:</span><span class="detail-value" style="white-space:pre-wrap">${esc(lead.message || 'No message')}</span></div>
      </div>
    </div>
  `;
  return div;
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function loadMore() {
  const container = document.getElementById('cardsContainer');
  const end = Math.min(displayed + PAGE, filtered.length);
  for (let i = displayed; i < end; i++) {
    container.appendChild(renderCard(filtered[i]));
  }
  displayed = end;
  document.getElementById('resultsCount').textContent = 'Showing ' + displayed + ' of ' + filtered.length + ' leads';

  const wrap = document.getElementById('loadMoreWrap');
  if (displayed < filtered.length) {
    wrap.style.display = 'block';
    document.getElementById('loadMoreBtn').textContent = 'Load More (' + (filtered.length - displayed) + ' remaining)';
  } else {
    wrap.style.display = 'none';
  }
}

// ===== ACTIONS =====
function toggleExpand(card) {
  card.classList.toggle('expanded');
}

function toggleDone(id, checked) {
  if (checked) doneSet.add(id); else doneSet.delete(id);
  saveDone();
  const card = document.querySelector('.lead-card[data-id="' + id + '"]');
  if (card) {
    card.classList.toggle('done-card', checked);
    const btn = card.querySelector('.done-btn');
    if (btn) btn.classList.toggle('is-done', checked);
    // If not showing done and just marked done, remove card after animation
    if (checked && !document.getElementById('showDoneToggle').checked) {
      setTimeout(() => { card.style.transition='opacity .4s,max-height .4s';card.style.opacity='0';card.style.maxHeight='0';card.style.overflow='hidden';
        setTimeout(() => { card.remove(); updateResultsCount(); }, 400);
      }, 300);
    }
  }
}

function toggleDoneBtn(id) {
  const isDone = doneSet.has(id);
  toggleDone(id, !isDone);
  const card = document.querySelector('.lead-card[data-id="' + id + '"]');
  if (card) {
    const cb = card.querySelector('input[type=checkbox]');
    if (cb) cb.checked = !isDone;
  }
}

function updateResultsCount() {
  const visible = document.querySelectorAll('.lead-card:not([style*="opacity: 0"])').length;
  document.getElementById('resultsCount').textContent = 'Showing ' + visible + ' of ' + filtered.length + ' leads';
}

function copyMsg(id) {
  const lead = ALL_LEADS[id];
  if (lead && lead.message) {
    navigator.clipboard.writeText(lead.message).then(() => showToast('Message copied!')).catch(() => showToast('Copy failed'));
  }
}

function copyAllHotMessages() {
  const hotLeads = ALL_LEADS.filter(l => l.prob >= 70 && !doneSet.has(l.id));
  const msgs = hotLeads.map(l => l.name + ' (' + l.phone + '):\n' + l.message).join('\n\n---\n\n');
  navigator.clipboard.writeText(msgs).then(() => showToast(hotLeads.length + ' hot lead messages copied!')).catch(() => showToast('Copy failed'));
}

function exportRemaining() {
  const remaining = ALL_LEADS.filter(l => !doneSet.has(l.id));
  let csv = 'Name,Phone,Last Contact Date,Days Since,Probability,Objection,Intent,Message\n';
  remaining.forEach(l => {
    csv += '"' + (l.name||'').replace(/"/g,'""') + '","' + l.phone + '","' + l.lastDate + '",' + l.daysSince + ',' + l.prob + ',"' + l.objection + '","' + (l.intent||'') + '","' + (l.message||'').replace(/"/g,'""').replace(/\n/g,' ') + '"\n';
  });
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 're-engagement-remaining-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  showToast(remaining.length + ' leads exported!');
}

function resetAll() {
  if (confirm('Reset all done status? This will unmark all ' + doneSet.size + ' completed leads.')) {
    doneSet.clear();
    saveDone();
    applyFilters();
    showToast('All leads reset!');
  }
}

// ===== PARTICLES =====
(function(){
  const c = document.getElementById('particles'), ctx = c.getContext('2d');
  let w, h, pts = [];
  function resize() { w = c.width = innerWidth; h = c.height = innerHeight; }
  resize(); window.addEventListener('resize', resize);
  class P {
    constructor() { this.reset(); }
    reset() { this.x = Math.random()*w; this.y = Math.random()*h; this.vx = (Math.random()-.5)*.3; this.vy = (Math.random()-.5)*.3; this.r = Math.random()*1.5+.5; this.a = Math.random()*.25+.05; }
    update() { this.x += this.vx; this.y += this.vy; if(this.x<0||this.x>w) this.vx *= -1; if(this.y<0||this.y>h) this.vy *= -1; }
    draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fillStyle = 'rgba(212,168,67,'+this.a+')'; ctx.fill(); }
  }
  if (!window.matchMedia('(prefers-reduced-motion:reduce)').matches) {
    for (let i = 0; i < 35; i++) pts.push(new P());
    (function animate() {
      ctx.clearRect(0, 0, w, h);
      pts.forEach(p => { p.update(); p.draw(); });
      for (let i = 0; i < pts.length; i++) for (let j = i+1; j < pts.length; j++) {
        const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y, d = Math.sqrt(dx*dx + dy*dy);
        if (d < 120) { ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.strokeStyle = 'rgba(212,168,67,' + (.05*(1-d/120)) + ')'; ctx.stroke(); }
      }
      requestAnimationFrame(animate);
    })();
  }
})();

// ===== INIT =====
updateDoneCounter();
applyFilters();
</script>
